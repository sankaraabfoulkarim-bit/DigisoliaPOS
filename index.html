function SectionImportCSV({ T, shopId, products, setProducts, flashMsg }) {
  const [preview, setPreview] = useState([]); const [importing, setImporting] = useState(false);
  const parseCSV=(text)=>{
    const lines=text.trim().split("\n"); const headers=lines[0].split(/[;,]/).map(h=>h.trim().toLowerCase().replace(/"/g,""));
    return lines.slice(1).map(line=>{const vals=line.split(/[;,]/).map(v=>v.trim().replace(/"/g,"")); const obj={}; headers.forEach((h,i)=>obj[h]=vals[i]||""); return obj;}).filter(r=>r.nom||r.name);
  };
  const handleFile=(e)=>{const f=e.target.files[0]; if(!f) return; const reader=new FileReader(); reader.onload=ev=>setPreview(parseCSV(ev.target.result).slice(0,50)); reader.readAsText(f,"utf-8");};
  const doImport=()=>{
    setImporting(true);
    const newProds=preview.map(r=>({id:"imp_"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:r.nom||r.name||"Article",price:parseInt(r["prix vente"]||r.prix||r.price||0)||0,prixAchat:parseInt(r["prix achat"]||r.achat||r.cost||0)||0,category:r.categorie||r.category||"Importé",stock:parseInt(r.stock)||0,barcode:r.barcode||null,active:true,photo:null}));
    const updated=[...(products||[]),...newProds]; if (typeof setProducts === "function") setProducts(updated); OfflineStore.set(shopId,"products",updated);
    if(db) newProds.forEach(p=>db.collection("shops").doc(shopId).collection("products").doc(p.id).set(p).catch(()=>{}));
    setPreview([]); setImporting(false); flashMsg(`✅ ${newProds.length} produits importés`);
    auditLog.add(shopId,"produit",`Import CSV: ${newProds.length} produits`);
  };
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>🗂️ Import produits CSV</div>
    <div style={{fontSize:10,color:T.textMute,marginBottom:12}}>Colonnes: nom, prix vente, prix achat, categorie, stock, barcode</div>
    <label style={{display:"block",background:T.btnBlue.bg,border:`2px dashed ${T.blue}55`,borderRadius:14,padding:24,textAlign:"center",cursor:"pointer",marginBottom:12}}>
      <div style={{fontSize:24,marginBottom:6}}>📁</div><div style={{fontSize:12,fontWeight:700,color:T.blue}}>Choisir fichier CSV</div>
      <input type="file" accept=".csv,.txt" onChange={handleFile} style={{display:"none"}}/>
    </label>
    {preview.length>0&&<><div style={{fontSize:11,fontWeight:700,marginBottom:8}}>Aperçu ({preview.length})</div>
      {preview.slice(0,5).map((r,i)=><div key={i} style={{background:T.surface,borderRadius:8,padding:8,marginBottom:4,fontSize:10}}><span style={{fontWeight:600}}>{r.nom||r.name}</span> · {fmtPrice(parseInt(r["prix vente"]||r.prix||0))} · {r.categorie||r.category||"—"} · Stock: {r.stock||"0"}</div>)}
      {preview.length>5&&<div style={{fontSize:10,color:T.textMute,textAlign:"center",marginBottom:8}}>+{preview.length-5} autres...</div>}
      <div style={{display:"flex",gap:8}}><button onClick={()=>setPreview([])} style={{flex:1,background:T.surface2,border:"none",borderRadius:10,padding:10}}>Annuler</button><button onClick={doImport} disabled={importing} style={{flex:1,background:T.green,border:"none",borderRadius:10,padding:10,fontWeight:700,color:T.bg}}>⬆️ Importer {preview.length}</button></div>
    </>}
  </div>);
}

//  FEAT 20 — SCAN FACTURE (OCR IA)
// ══════════════════════════════════════════════════════════════════
function SectionScanFacture({ T, shopId, flashMsg }) {
  const [img, setImg] = useState(null); const [loading, setLoading] = useState(false); const [result, setResult] = useState(null);
  const [history, setHistory] = useState(() => { try { return JSON.parse(localStorage.getItem(`pos_factures_${shopId}`)||"[]"); } catch(e){ return []; } });
  const handleImg=(e)=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>setImg(ev.target.result); r.readAsDataURL(f);};
  const analyze=async()=>{
    if(!img) return; setLoading(true);
    try {
      const base64=img.split(",")[1]; const mediaType=img.split(";")[0].split(":")[1];
      const response=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mediaType,data:base64}},{type:"text",text:'Analyse cette facture et extrais en JSON UNIQUEMENT: {"fournisseur":"","date":"YYYY-MM-DD","total":0,"items":[{"nom":"","qte":1,"prix":0}],"notes":""}'}]}]})});
      const data=await response.json(); const text=(data.content||[]).find(c=>c.type==="text")?.text||"{}";
      const parsed=JSON.parse(text.replace(/```json|```/g,"").trim());
      setResult(parsed);
      const saved=[...history,{...parsed,id:Date.now().toString(36),analyzedAt:Date.now()}];
      setHistory(saved); localStorage.setItem(`pos_factures_${shopId}`,JSON.stringify(saved));
      flashMsg("✅ Facture analysée");
    } catch(e){flashMsg("❌ Erreur: "+e.message);}
    setLoading(false);
  };
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>📷 Scan facture fournisseur (IA)</div>
    <div style={{fontSize:10,color:T.textMute,marginBottom:12}}>Photographiez une facture — l'IA extrait les montants automatiquement</div>
    <label style={{display:"block",background:T.btnBlue.bg,border:`2px dashed ${T.blue}55`,borderRadius:14,padding:20,textAlign:"center",cursor:"pointer",marginBottom:img?8:12}}>
      {img?<img src={img} style={{maxWidth:"100%",maxHeight:160,borderRadius:8,objectFit:"contain"}}/>:<><div style={{fontSize:32}}>📷</div><div style={{fontSize:12,color:T.blue,fontWeight:700}}>Photo ou fichier</div></>}
      <input type="file" accept="image/*" capture="environment" onChange={handleImg} style={{display:"none"}}/>
    </label>
    {img&&!result&&<button onClick={analyze} disabled={loading} style={{width:"100%",background:T.accent,border:"none",borderRadius:12,padding:12,fontWeight:700,color:T.bg,marginBottom:12}}>{loading?"⏳ Analyse IA...":"🤖 Analyser la facture"}</button>}
    {result&&<div style={{background:T.surface,borderRadius:14,padding:14,marginBottom:12}}>
      <div style={{fontSize:12,fontWeight:800,marginBottom:8,color:T.accent}}>✅ Résultat</div>
      {result.fournisseur&&<div style={{fontSize:11}}><span style={{color:T.textMute}}>Fournisseur:</span> <b>{result.fournisseur}</b></div>}
      {result.date&&<div style={{fontSize:11}}><span style={{color:T.textMute}}>Date:</span> {result.date}</div>}
      {result.total&&<div style={{fontSize:16,fontWeight:800,color:T.green,margin:"6px 0"}}>Total: {fmtPrice(result.total)}</div>}
      {(result.items||[]).map((it,i)=><div key={i} style={{background:T.surface2,borderRadius:8,padding:"5px 10px",marginBottom:4,fontSize:11}}>{it.qte}× {it.nom} — {fmtPrice(it.prix*it.qte)}</div>)}
      <button onClick={()=>{setResult(null);setImg(null);}} style={{marginTop:8,width:"100%",background:T.surface2,border:"none",borderRadius:10,padding:8,fontSize:11}}>Nouvelle facture</button>
    </div>}
    {history.length>0&&<div>
      <div style={{fontSize:11,fontWeight:700,marginBottom:6}}>Historique ({history.length})</div>
      {[...history].reverse().slice(0,5).map(h=><div key={h.id} style={{background:T.surface2,borderRadius:8,padding:8,marginBottom:4,display:"flex",justifyContent:"space-between"}}><div><div style={{fontSize:11,fontWeight:600}}>{h.fournisseur||"Inconnu"}</div><div style={{fontSize:9,color:T.textMute}}>{h.date||"—"} · {(h.items||[]).length} articles</div></div><div style={{fontWeight:700,color:T.green}}>{fmtPrice(h.total)}</div></div>)}
    </div>}
  </div>);
}

function BarChart({ data, color, labelColor, h }) {
  const max = Math.max(...data.map(d=>d.v), 1);
  const ch = h || 100;
  return React.createElement("div", {style:{display:"flex", alignItems:"flex-end", gap:4, height:ch+32}},
    data.map((d,i) => {
      const barH = Math.max(4, Math.round((d.v / max) * ch));
      return React.createElement("div", {key:i, style:{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2}},
        React.createElement("div", {style:{fontSize:8, color:labelColor||"#aaa", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", maxWidth:"100%", textAlign:"center"}}, d.v > 0 ? fmtPrice(d.v).replace(" F","") : ""),
        React.createElement("div", {style:{width:"100%", height:barH, background:color||"#6ee7b7", borderRadius:"4px 4px 0 0"}}),
        React.createElement("div", {style:{fontSize:8, color:labelColor||"#aaa", whiteSpace:"nowrap"}}, d.label)
      );
    })
  );
}

      setShops(snap.docs.map(d => ({ id: d.id, ...d.data() })));

    }, () => setLoading(false));

  const openPlanModal = (shop) => {
    setPlanModalShop(shop);
    setPlanForm({ plan: shop.plan || "mensuel", customMode: "days", customDays: "", customDate: "", from: "today" });
  };

  const previewNewEnd = (shop, form) => {
    if(!shop) return null;
    const base = form.from === "extend" && shop.subscriptionEnd && shop.subscriptionEnd > Date.now() ? shop.subscriptionEnd : Date.now();
    if(form.plan === "personnalise") {
      if(form.customMode === "date") {
        if(!form.customDate) return null;
        return new Date(form.customDate + "T23:59:59").getTime();
      }
      const days = parseInt(form.customDays) || 0;
      if(days <= 0) return null;
      return calculateEndDateDays(base, days);
    }
    return calculateEndDate(base, form.plan);
  };

  const confirmPlanChange = async () => {
    const shop = planModalShop;
    if(!shop) return;
    const newEnd = previewNewEnd(shop, planForm);
    if(!newEnd) { flashMsg(planForm.customMode === "date" ? "Choisissez une date" : "Entrez un nombre de jours valide"); return; }
    const base = planForm.from === "extend" && shop.subscriptionEnd && shop.subscriptionEnd > Date.now() ? shop.subscriptionEnd : Date.now();
    try {
      await db.collection("shops").doc(shop.id).update({ plan: planForm.plan, subscriptionStart: base, subscriptionEnd: newEnd });
      flashMsg(`Abonnement ${shop.shopName} mis à jour : ${planLabel(planForm.plan)}`);
      setPlanModalShop(null);
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  const [showAdminForm, setShowAdminForm] = useState(false);
  const [aName, setAName] = useState("");
  const [aPin, setAPin] = useState("");
  const [aShopId, setAShopId] = useState("");

  const createAdmin = async () => {
    if (!aName.trim() || aPin.length < 4 || !aShopId) { flashMsg("Nom, PIN (4+ chiffres) et commerce requis"); return; }
    const doc = { name: aName.trim(), pin: btoa(aPin), shopId: aShopId, active: true, createdAt: Date.now() };
    try {
      await db.collection("superadmin").doc("admins").collection("list").add(doc);
      setAName(""); setAPin(""); setAShopId(""); setShowAdminForm(false);
      flashMsg("✅ Admin créé");
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  const toggleAdmin = async (adm) => {
    try {
      await db.collection("superadmin").doc("admins").collection("list").doc(adm.id).update({ active: !adm.active });
      flashMsg(adm.active ? `🔒 Admin désactivé : ${adm.name}` : `✅ Admin activé : ${adm.name}`);
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  const deleteAdmin = async (adm) => {
    if (!window.confirm(`Supprimer l'admin ${adm.name} ?`)) return;
    try {
      await db.collection("superadmin").doc("admins").collection("list").doc(adm.id).delete();
      flashMsg("🗑️ Admin supprimé");
    } catch(e) { flashMsg("Erreur: " + e.message); }
  };

  const [allSales, setAllSales] = useState([]);
  const [salesLoading, setSalesLoading] = useState(false);
  const loadAllSales = async () => {
    if (!db || salesLoading) return;
    setSalesLoading(true);
    try {
      const allS = [];
      for (const shop of shops.slice(0, 20)) {
        const snap = await db.collection("shops").doc(shop.id).collection("sales")
          .orderBy("timestamp", "desc").limit(50).get();
        snap.docs.forEach(d => allS.push({ ...d.data(), id: d.id, _shopName: shop.shopName }));
      }
      allS.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      setAllSales(allS);
    } catch(e) { flashMsg("Erreur chargement ventes: " + e.message); }
    setSalesLoading(false);
  };

  const today = new Date().toISOString().slice(0, 10);
  const totalShops = shops.length;
  const activeShops = shops.filter(s => s.active !== false && s.sessionActive !== false).length;
  const expiringShops = shops.filter(s => { const d = getDaysLeft(s.subscriptionEnd); return d <= 7 && d > 0; }).length;
  const expiredShops = shops.filter(s => getDaysLeft(s.subscriptionEnd) === 0 && s.active !== false).length;
  const cloudShops = shops.filter(s => s.cloudEnabled !== false).length;
  const localShops = shops.filter(s => s.cloudEnabled === false).length;

  const TABS = [["shops","🏪 Commerces"],["admins","👥 Admins"],["activites","📊 Activités"],["settings","⚙️ Paramètres"]];

  return (
    <div className="dev-dash-root" style={{ background:T.bg, color:T.text }}>
      <div style={{ background:T.header, borderBottom:`1px solid ${T.border}`, padding:"10px 16px", display:"flex", alignItems:"center", justifyContent:"space-between", flexShrink:0 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span style={{ fontSize:22 }}>🛡️</span>
          <div>
            <div style={{ fontFamily:"'Outfit'", fontSize:16, fontWeight:800, color:T.purple }}>Super Admin</div>
            <div style={{ fontSize:9, color:T.textMute }}>Tableau de bord global</div>
          </div>
        </div>
        <div style={{ display:"flex", gap:6 }}>
          <div style={{ display:"flex", gap:2, padding:3, borderRadius:20, background:T.surface2 }}>
            {Object.values(THEMES).map(th => (
              <button key={th.id} onClick={() => setThemeName(th.id)}
                className={`theme-btn${themeName===th.id?" active":""}`}
                style={{ background: themeName===th.id ? T.accent : "transparent", color: themeName===th.id ? T.bg : T.textMute }}>
                {th.label}
              </button>
            ))}
          </div>
          <button onClick={logout} style={{ background:"transparent", border:`1px solid ${T.border}`, borderRadius:8, padding:"4px 10px", fontSize:11, color:T.textMute }}>↩ Déco</button>
        </div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:8, padding:12, flexShrink:0 }}>
        <div style={{ background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.green}33` }}>
          <div style={{ fontSize:10, color:T.textMute }}>Commerces actifs</div>

          <div style={{ fontSize:9, color:T.textMute }}>/ {totalShops} total</div>
        </div>
        <div style={{ background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.blue}33` }}>
          <div style={{ fontSize:10, color:T.textMute }}>Cloud Actif / Local</div>
          <div style={{ fontSize:20, fontWeight:800, color:T.blue }}>☁️ {cloudShops} · 📴 {localShops}</div>
          <div style={{ fontSize:9, color:T.textMute }}>Temps réel vs Local</div>
        </div>
        <div style={{ background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.orange}33` }}>
          <div style={{ fontSize:10, color:T.textMute }}>Abonnements expirant</div>
          <div style={{ fontSize:28, fontWeight:800, color:T.orange }}>{expiringShops}</div>
          <div style={{ fontSize:9, color:T.textMute }}>dans 7 jours</div>
        </div>
        <div style={{ background:T.surface, borderRadius:14, padding:12, border:`1px solid ${T.red}33` }}>
          <div style={{ fontSize:10, color:T.textMute }}>Abonnements expirés</div>
          <div style={{ fontSize:28, fontWeight:800, color:T.red }}>{expiredShops}</div>

        </div>
      </div>

      <div style={{ display:"flex", gap:5, padding:"0 12px 8px", flexWrap:"wrap", flexShrink:0 }}>
        {TABS.map(([k,l]) => (
          <button key={k} onClick={() => setTab(k)}

            {l}
          </button>

      <div className="dev-dash-scroll" style={{ padding:"0 12px 32px" }}>
        {tab === "shops" && (
          <div>
            {loading && <div className="spin" style={{ width:28,height:28,border:`2px solid ${T.border}`,borderTopColor:T.accent,borderRadius:"50%",margin:"20px auto" }}></div>}
            {shops.map(shop => {
              const daysLeft = getDaysLeft(shop.subscriptionEnd);
              const isSessionOff = shop.sessionActive === false;
              const isCloud = shop.cloudEnabled !== false;
              const statusColor = isSessionOff ? T.orange : shop.active === false ? T.red : daysLeft <= 0 ? T.red : daysLeft <= 7 ? T.orange : T.green;
              return (
                <div key={shop.id} style={{ background:T.surface, borderRadius:14, padding:14, marginBottom:10, borderLeft:`4px solid ${statusColor}` }}>

                    <div style={{ flex:1 }}>
                      <div style={{ fontWeight:800, fontSize:14 }}>{shop.shopName}</div>
                      <div style={{ fontSize:10, color:T.textMute }}>👤 {shop.ownerName} · 📱 {shop.whatsapp}</div>

                      <div style={{ marginTop:4 }}>
                        <span style={{ fontSize:10, fontWeight:700, padding:"2px 8px", borderRadius:10, background: isCloud ? T.btnBlue.bg : "#ff990022", color: isCloud ? T.blue : T.orange, border:`1px solid ${isCloud ? T.blue+"44" : T.orange+"44"}` }}>

                    </div>
                    <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:4 }}>
                      <span style={{ fontSize:10, fontWeight:700, color:statusColor }}>
                        {isSessionOff ? "🔶 Session OFF" : shop.active===false ? "🔴 Inactif" : daysLeft<=0 ? "⚠️ Expiré" : daysLeft<=7 ? "⚠️ Bientôt expiré" : "🟢 Actif"}
                      </span>
                      <button onClick={() => openPlanModal(shop)}

                        📝 Gérer abonnement
                      </button>
                      <button onClick={() => toggleCloud(shop)}

                      </button>
                      <button onClick={() => toggleShopSession(shop)}
                        style={{ background: isSessionOff ? T.btnGreen.bg : T.btnRed.bg, border:"none", borderRadius:8, padding:"5px 12px", fontSize:11, fontWeight:700, color: isSessionOff ? T.green : T.red }}>

                      </button>
                    </div>
                  </div>
                  <ShopQuickStats T={T} shopId={shop.id} />

        {tab === "admins" && (
          <div>
            <div style={{ background:T.surface2, borderRadius:12, padding:12, marginBottom:12, fontSize:11, color:T.textMute }}>
              ℹ️ Les admins créés ici peuvent accéder à n'importe quel commerce via leur PIN. Chaque admin est lié à un commerce spécifique.
            </div>
            <button onClick={() => setShowAdminForm(true)}
              style={{ background:T.purple, border:"none", borderRadius:12, padding:12, marginBottom:12, width:"100%", fontWeight:700, color:"#fff" }}>
              + Créer un nouvel admin
            </button>

            {showAdminForm && (
              <div style={{ background:T.surface, borderRadius:16, padding:16, marginBottom:12, border:`1px solid ${T.purple}44` }}>
                <div style={{ fontSize:14, fontWeight:700, marginBottom:10, color:T.purple }}>👥 Nouvel Admin</div>
                <input placeholder="Nom complet" value={aName} onChange={e => setAName(e.target.value)}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, color:T.text, marginBottom:8 }} />
                <input type="password" placeholder="PIN (4-6 chiffres)" maxLength={6} value={aPin} onChange={e => setAPin(e.target.value.replace(/\D/g,""))}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, color:T.text, marginBottom:8 }} />
                <select value={aShopId} onChange={e => setAShopId(e.target.value)}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, color:T.text, marginBottom:12 }}>
                  <option value="">— Choisir un commerce —</option>
                  {shops.map(s => <option key={s.id} value={s.id}>{s.shopName}</option>)}
                </select>
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={() => { setShowAdminForm(false); setAName(""); setAPin(""); setAShopId(""); }}
                    style={{ flex:1, background:T.surface2, border:"none", borderRadius:10, padding:10 }}>Annuler</button>
                  <button onClick={createAdmin}
                    style={{ flex:1, background:T.purple, border:"none", borderRadius:10, padding:10, fontWeight:700, color:"#fff" }}>Créer</button>
                </div>
              </div>
            )}

            {adminsLoading && <div style={{ textAlign:"center", padding:20, color:T.textMute }}>⏳ Chargement...</div>}
            {!adminsLoading && admins.length === 0 && (
              <div style={{ textAlign:"center", padding:40, color:T.textMute, fontSize:12 }}>Aucun admin créé</div>
            )}
            {admins.map(adm => {
              const shop = shops.find(s => s.id === adm.shopId);
              return (
                <div key={adm.id} style={{ background:T.surface, borderRadius:12, padding:12, marginBottom:8, borderLeft:`3px solid ${adm.active ? T.purple : T.red}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"start" }}>
                    <div>
                      <div style={{ fontWeight:700 }}>👤 {adm.name}</div>
                      <div style={{ fontSize:10, color:T.textMute }}>Commerce: {shop?.shopName || adm.shopId}</div>
                      <div style={{ fontSize:9, color:T.textMute }}>Créé: {formatDate(adm.createdAt)}</div>
                      <span style={{ fontSize:9, fontWeight:700, color:adm.active?T.green:T.red }}>
                        {adm.active ? "✅ Actif" : "🔒 Désactivé"}
                      </span>
                    </div>
                    <div style={{ display:"flex", gap:6 }}>
                      <button onClick={() => toggleAdmin(adm)}
                        style={{ background: adm.active ? T.btnRed.bg : T.btnGreen.bg, border:"none", borderRadius:8, padding:"5px 10px", fontSize:11, color: adm.active ? T.red : T.green }}>
                        {adm.active ? "🔒 Désactiver" : "✅ Activer"}
                      </button>
                      <button onClick={() => deleteAdmin(adm)}
                        style={{ background:T.btnRed.bg, border:"none", borderRadius:8, padding:"5px 8px", color:T.red }}>🗑️</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab === "activites" && (
          <div>
            <div style={{ background:T.surface2, borderRadius:12, padding:12, marginBottom:10, fontSize:11, color:T.textMute }}>
              📊 Activités consolidées de tous les commerces (50 dernières ventes par commerce, max 20 commerces)
            </div>
            {allSales.length === 0 && !salesLoading && (
              <button onClick={loadAllSales}
                style={{ background:T.purple, border:"none", borderRadius:12, padding:14, width:"100%", fontWeight:700, color:"#fff", marginBottom:12 }}>
                🔄 Charger les activités
              </button>
            )}
            {salesLoading && <div className="spin" style={{ width:28,height:28,border:`2px solid ${T.border}`,borderTopColor:T.purple,borderRadius:"50%",margin:"20px auto" }}></div>}
            {allSales.map(sale => (
              <div key={sale.id + sale._shopName} style={{ background:T.surface, borderRadius:10, padding:10, marginBottom:6, borderLeft:`3px solid ${sale.cancelled?T.red:T.green}` }}>
                <div style={{ display:"flex", justifyContent:"space-between" }}>
                  <div>
                    <div style={{ fontSize:11, fontWeight:700 }}>{sale._shopName}</div>
                    <div style={{ fontSize:10, color:T.textMute }}>
                      {sale.caissier ? `👤 ${sale.caissier}` : "Admin"} · {sale.date}
                      {sale.timestamp && ` à ${new Date(sale.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}`}
                    </div>
                  </div>
                  <div style={{ textAlign:"right" }}>
                    <div style={{ fontWeight:800, color:sale.cancelled?T.red:T.accent }}>{sale.cancelled?"❌":""}{fmtPrice(sale.total)}</div>
                    <div style={{ fontSize:9, color:T.textMute }}>{(sale.items||[]).length} art.</div>
                  </div>
                </div>
              </div>
            ))}
            {allSales.length > 0 && (
              <button onClick={loadAllSales} style={{ background:T.surface2, border:`1px solid ${T.border}`, borderRadius:10, padding:10, width:"100%", fontSize:11, color:T.textMute, marginTop:8 }}>
                🔄 Actualiser
              </button>
            )}
          </div>
        )}

        {tab === "settings" && (
          <div>
            <div style={{ background:T.surface, borderRadius:14, padding:16, marginBottom:12 }}>
              <div style={{ fontSize:14, fontWeight:700, marginBottom:8 }}>🎨 Thème</div>
              <div style={{ display:"flex", gap:8 }}>
                {Object.values(THEMES).map(th => (
                  <button key={th.id} onClick={() => setThemeName(th.id)}
                    style={{ flex:1, background:themeName===th.id?T.accent:T.surface2, border:`2px solid ${themeName===th.id?T.accent:T.border}`, borderRadius:10, padding:10, fontWeight:700, color:themeName===th.id?T.bg:T.text }}>
                    {th.label} {th.label}
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function ShopQuickStats({ T, shopId }) {
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(false);
  const [expanded, setExpanded] = useState(false);

  const load = async () => {
    if (stats || loading || !db) return;
    setLoading(true);
    try {
      const today = new Date().toISOString().slice(0, 10);
      const snap = await db.collection("shops").doc(shopId).collection("sales")
        .where("date", "==", today).get();
      const sales = snap.docs.map(d => d.data()).filter(s => !s.cancelled && s.id !== "_init");
      const ca = sales.reduce((a, s) => a + (s.total || 0), 0);
      const byCaissier = {};
      sales.forEach(s => {
        const k = s.caissier || "Admin";
        byCaissier[k] = (byCaissier[k] || 0) + (s.total || 0);
      });
      setStats({ ca, nb: sales.length, byCaissier });
    } catch(e) { setStats({ ca: 0, nb: 0, byCaissier: {} }); }
    setLoading(false);
  };

  return (
    <div style={{ marginTop:8, paddingTop:8, borderTop:`1px solid ${T.border}` }}>
      <button onClick={() => { setExpanded(!expanded); if (!expanded) load(); }}
        style={{ background:"transparent", border:"none", fontSize:10, color:T.blue, padding:0, cursor:"pointer" }}>
        {expanded ? "▲ Masquer stats" : "▼ Stats du jour"}
      </button>
      {expanded && (
        <div style={{ marginTop:8 }}>
          {loading && <span style={{ fontSize:10, color:T.textMute }}>⏳...</span>}
          {stats && (
            <div>
              <div style={{ display:"flex", gap:8, marginBottom:6 }}>
                <div style={{ background:T.surface2, borderRadius:8, padding:"6px 10px", flex:1, textAlign:"center" }}>
                  <div style={{ fontSize:9, color:T.textMute }}>CA Auj.</div>
                  <div style={{ fontWeight:800, color:T.green, fontSize:13 }}>{fmtPrice(stats.ca)}</div>
                </div>
                <div style={{ background:T.surface2, borderRadius:8, padding:"6px 10px", flex:1, textAlign:"center" }}>
                  <div style={{ fontSize:9, color:T.textMute }}>Ventes</div>
                  <div style={{ fontWeight:800, color:T.blue, fontSize:13 }}>{stats.nb}</div>
                </div>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  ADMINISTRATION DÉVELOPPEUR (DevDashboard)
//  Avec contrôle d'activation / désactivation du Cloud par commerce
// ══════════════════════════════════════════════════════════════════
function DevDashboard({ T, themeName, setThemeName, logout, flashMsg }) {
  const [shops, setShops] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState("");
  const [cloudFilter, setCloudFilter] = useState("all"); // "all" | "cloud" | "local"
  const [planModalShop, setPlanModalShop] = useState(null);
  const [planForm, setPlanForm] = useState({ plan: "mensuel", customMode: "days", customDays: "", customDate: "", from: "today" });

  // Modals pour la gestion des accès et création de commerces
  const [showNewShopModal, setShowNewShopModal] = useState(false);
  const [newShopForm, setNewShopForm] = useState({
    shopName: "",
    ownerName: "",
    whatsapp: "",
    username: "",
    password: "1234",
    accessCode: "",
    plan: "mensuel",
    cloudEnabled: true
  });

  const [editAuthShop, setEditAuthShop] = useState(null);
  const [editAuthForm, setEditAuthForm] = useState({ username: "", password: "", accessCode: "" });

  useEffect(() => {
    if(!db) { setLoading(false); return; }
    const unsub = db.collection("shops").onSnapshot(snap => {
      setShops(snap.docs.map(d=>({id:d.id, ...d.data()})));
      setLoading(false);
    }, (err) => {
      console.warn("DevDashboard shops error:", err);
      setLoading(false);
    });
    return unsub;
  }, []);

  const openPlanModal = (shop) => {
    setPlanModalShop(shop);
    setPlanForm({ plan: shop.plan || "mensuel", customMode: "days", customDays: "", customDate: "", from: "today" });
  };

  const openNewShopModal = () => {
    const randomCode = "DEV-" + Math.floor(1000 + Math.random() * 9000);
    setNewShopForm({
      shopName: "",
      ownerName: "",
      whatsapp: "",
      username: "",
      password: "1234",
      accessCode: randomCode,
      plan: "mensuel",
      cloudEnabled: true
    });
    setShowNewShopModal(true);
  };

  const handleCreateShop = async () => {
    if (!newShopForm.shopName.trim()) { flashMsg("Le nom du commerce est obligatoire"); return; }
    const id = "shop_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const now = Date.now();
    const subEnd = calculateEndDate(now, newShopForm.plan || "mensuel");
    const uname = (newShopForm.username.trim() || newShopForm.shopName.trim().toLowerCase().replace(/[^a-z0-9]/g, "")) || "commerce";
    const pwd = newShopForm.password.trim() || "1234";
    const devCode = (newShopForm.accessCode.trim() || ("DEV-" + Math.floor(1000 + Math.random() * 9000))).toUpperCase();

    const newShop = {
      id,
      shopName: newShopForm.shopName.trim(),
      ownerName: newShopForm.ownerName.trim() || "Gérant",
      whatsapp: newShopForm.whatsapp.trim(),
      username: uname,
      password: pwd,
      accessCode: devCode,
      plan: newShopForm.plan || "mensuel",
      subscriptionStart: now,
      subscriptionEnd: subEnd,
      cloudEnabled: newShopForm.cloudEnabled !== false,
      active: true,
      createdAt: now
    };

    try {
      if (db) await db.collection("shops").doc(id).set(newShop);
      const updated = [...shops, newShop];
      setShops(updated);
      try { localStorage.setItem("pos_cached_shops", JSON.stringify(updated)); } catch(e) {}
      setShowNewShopModal(false);
      flashMsg(`✅ Commerce « ${newShop.shopName} » créé avec succès !`);
    } catch(e) {
      flashMsg("Erreur lors de la création : " + e.message);
    }
  };

  const openEditAuth = (shop) => {
    setEditAuthShop(shop);
    setEditAuthForm({
      username: getShopUsername(shop),
      password: getShopPassword(shop),
      accessCode: getShopAccessCode(shop)
    });
  };

  const handleSaveAuth = async () => {
    if (!editAuthShop) return;
    const patch = {
      username: editAuthForm.username.trim() || getShopUsername(editAuthShop),
      password: editAuthForm.password.trim() || "1234",
      accessCode: (editAuthForm.accessCode.trim() || getShopAccessCode(editAuthShop)).toUpperCase()
    };
    try {
      if (db) await db.collection("shops").doc(editAuthShop.id).update(patch);
      setShops(prev => prev.map(s => s.id === editAuthShop.id ? { ...s, ...patch } : s));
      try {
        const cached = JSON.parse(localStorage.getItem("pos_cached_shops") || "[]");
        localStorage.setItem("pos_cached_shops", JSON.stringify(cached.map(s => s.id === editAuthShop.id ? { ...s, ...patch } : s)));
      } catch(e) {}
      setEditAuthShop(null);
      flashMsg(`✅ Accès mis à jour pour « ${editAuthShop.shopName} »`);
    } catch(e) {
      flashMsg("Erreur mise à jour : " + e.message);
    }
  };

  const copyOrShareAccess = (shop) => {
    const uname = getShopUsername(shop);
    const pwd = getShopPassword(shop);
    const code = getShopAccessCode(shop);
    const text = `🏪 ACCÈS CAISSE PRO — ${shop.shopName}\n\n` +
      `🔑 Option 1 : Connexion Nom & Mot de passe\n` +
      `👤 Identifiant : ${uname}\n` +
      `🔒 Mot de passe : ${pwd}\n\n` +
      `🏷️ Option 2 : Code Développeur\n` +
      `⚡ Code d'accès : ${code}\n\n` +
      `🌐 Accédez à votre caisse sur : ${window.location.origin}`;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(text);
      flashMsg("📋 Identifiants copiés dans le presse-papier !");
    }
    const phone = String(shop.whatsapp || "").replace(/\D/g, "");
    if (phone) {
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, "_blank");
    }
  };

  const previewNewEnd = (shop, form) => {
    if(!shop) return null;
    const base = form.from === "extend" && shop.subscriptionEnd && shop.subscriptionEnd > Date.now() ? shop.subscriptionEnd : Date.now();
    if(form.plan === "personnalise") {
      if(form.customMode === "date") {
        if(!form.customDate) return null;
        return new Date(form.customDate + "T23:59:59").getTime();
      }
      const days = parseInt(form.customDays) || 0;
      if(days <= 0) return null;
      return calculateEndDateDays(base, days);
    }
    return calculateEndDate(base, form.plan);
  };

  const confirmPlanChange = async () => {
    const shop = planModalShop;
    if(!shop) return;
    const newEnd = previewNewEnd(shop, planForm);
    if(!newEnd) { flashMsg(planForm.customMode === "date" ? "Choisissez une date" : "Entrez un nombre de jours valide"); return; }
    const base = planForm.from === "extend" && shop.subscriptionEnd && shop.subscriptionEnd > Date.now() ? shop.subscriptionEnd : Date.now();
    await db.collection("shops").doc(shop.id).update({ plan: planForm.plan, subscriptionStart: base, subscriptionEnd: newEnd });
    flashMsg(`Abonnement ${shop.shopName} mis à jour : ${planLabel(planForm.plan)}`);
    setPlanModalShop(null);
  };

  const sendReminder = async (shop) => {
    if (!shop) return;
    const daysLeft = shop.subscriptionEnd ? getDaysLeft(shop.subscriptionEnd) : 0;
    const message = `🔔 RAPPEL D'ABONNEMENT - ${shop.shopName || ""}\n\nVotre abonnement ${shop.plan || "mensuel"} expire le ${formatDate(shop.subscriptionEnd)}\nPlus que ${daysLeft} jours !\n\nContactez-nous pour renouveler : ${DEV_WHATSAPP}`;
    const phone = String(shop.whatsapp || shop.phone || "").replace(/\D/g, "");
    if (phone) {
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, "_blank");
      flashMsg(`Rappel envoyé à ${shop.shopName}`);
    } else {
      flashMsg("Numéro WhatsApp manquant pour ce commerce");
    }
  };

  const toggleShop = async (shop) => {
    await db.collection("shops").doc(shop.id).update({active:!shop.active});
    flashMsg(shop.active?"Commerce suspendu":"Commerce activé");
  };

  // ── MODIFICATION DEMANDÉE : ACTIVER / DÉSACTIVER LE CLOUD DU COMMERCE ──
  const toggleCloud = async (shop) => {
    const isCloud = shop.cloudEnabled !== false;
    const newVal = !isCloud;
    try {
      await db.collection("shops").doc(shop.id).update({ cloudEnabled: newVal });
      flashMsg(newVal
        ? `☁️ Cloud activé pour « ${shop.shopName} » (Suivi à distance et temps réel ON)`
        : `📴 Cloud désactivé pour « ${shop.shopName} » (Données en Local uniquement — Pas de Firebase)`);
    } catch(e) {
      flashMsg("Erreur: " + e.message);
    }
  };

  const getPlanColor = (plan) => {
    if(plan === "mensuel") return T.blue;
    if(plan === "trimestriel") return T.orange;
    if(plan === "annuel") return T.green;
    if(plan === "personnalise") return T.purple;
    return T.textMute;
  };

  const getStatusColor = (shop) => {
    if(!shop.active) return T.red;
    if(!shop.subscriptionEnd) return T.orange;
    const daysLeft = getDaysLeft(shop.subscriptionEnd);
    if(daysLeft <= 0) return T.red;
    if(daysLeft <= 7) return T.orange;
    return T.green;
  };

  const cloudShopsCount = shops.filter(s => s.cloudEnabled !== false).length;
  const localShopsCount = shops.filter(s => s.cloudEnabled === false).length;

  const filteredShops = shops.filter(shop => {
    if (cloudFilter === "cloud" && shop.cloudEnabled === false) return false;
    if (cloudFilter === "local" && shop.cloudEnabled !== false) return false;
    const q = search.trim().toLowerCase();
    if(!q) return true;
    return (shop.shopName||"").toLowerCase().includes(q) ||
           (shop.ownerName||"").toLowerCase().includes(q) ||
           (shop.whatsapp||"").includes(q) ||
           getShopUsername(shop).toLowerCase().includes(q) ||
           getShopAccessCode(shop).toLowerCase().includes(q);
  });

  return (
    <div className="dev-dash-root" style={{background:T.bg}}>
      <div style={{background:T.header, padding:"8px 12px", borderBottom:`1px solid ${T.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", gap:8, flexWrap:"wrap", flexShrink:0}}>
        <div>
          <div style={{fontSize:9, color:T.textMute}}>Administration Développeur</div>
          <div style={{fontFamily:"'Outfit'", fontWeight:800, color:T.purple, fontSize:13}}>Abonnements, Accès & Contrôle Cloud Firebase</div>
        </div>
        <div style={{display:"flex", gap:6, alignItems:"center"}}>
          <div className="hdr-themes theme-toggle" style={{background:T.surface2}}>
            <button className={`theme-btn${themeName==="auto"?"  active":""}`} onClick={()=>setThemeName("auto")} title="Auto" style={{background:themeName==="auto"?T.accent:"transparent", color:themeName==="auto"?T.bg:T.textSub}}>⚙️</button>
            <button className={`theme-btn${themeName==="light"?" active":""}`} onClick={()=>setThemeName("light")} title="Clair" style={{background:themeName==="light"?T.accent:"transparent", color:themeName==="light"?T.bg:T.textSub}}>☀️</button>
            <button className={`theme-btn${themeName==="dark"?"  active":""}`} onClick={()=>setThemeName("dark")} title="Sombre" style={{background:themeName==="dark"?T.accent:"transparent", color:themeName==="dark"?T.bg:T.textSub}}>🌙</button>
            <button className={`theme-btn${themeName==="neon"?"  active":""}`} onClick={()=>setThemeName("neon")} title="Néon" style={{background:themeName==="neon"?T.accent:"transparent", color:themeName==="neon"?T.bg:T.textSub}}>⚡</button>
          </div>
          <button onClick={logout} style={{background:"transparent", border:`1px solid ${T.border}`, borderRadius:8, padding:"4px 8px", fontSize:11}}>↩<span className="hdr-text-label"> Déco</span></button>
        </div>
      </div>

      <div className="dev-dash-scroll" style={{padding:12}}>
        <div style={{background:T.surface, borderRadius:16, padding:16, marginBottom:12}}>
          <div style={{fontWeight:800, fontSize:15, color:T.text}}>🏪 Administration Développeur — Commerces</div>
          <div style={{fontSize:11, color:T.textMute, marginTop:2}}>
            Gérez les accès marchands (Nom, Mot de passe, Code Développeur), les abonnements et le basculement Cloud/Local.
          </div>
          <div style={{display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:8, marginTop:12}}>
            <div style={{background:T.btnBlue.bg, borderRadius:12, padding:"10px 12px", border:`1px solid ${T.blue}44`}}>
              <div style={{fontSize:10, color:T.blue, fontWeight:700}}>☁️ CLOUD ACTIF (Temps réel)</div>
              <div style={{fontSize:22, fontWeight:800, color:T.blue}}>{cloudShopsCount}</div>
              <div style={{fontSize:9, color:T.textMute}}>Synchronisation Firebase ON</div>
            </div>
            <div style={{background:"#ff990015", borderRadius:12, padding:"10px 12px", border:`1px solid #ff990044`}}>
              <div style={{fontSize:10, color:T.orange, fontWeight:700}}>📴 MODE LOCAL UNIQUEMENT</div>
              <div style={{fontSize:22, fontWeight:800, color:T.orange}}>{localShopsCount}</div>
              <div style={{fontSize:9, color:T.textMute}}>Données locales (Pas de Firebase)</div>
            </div>
          </div>
        </div>

        {/* Filtres Cloud */}
        <div style={{display:"flex", gap:6, marginBottom:10}}>
          <button onClick={()=>setCloudFilter("all")}
            style={{flex:1, background:cloudFilter==="all"?T.purple:T.surface, border:`1px solid ${cloudFilter==="all"?T.purple:T.border}`, borderRadius:10, padding:"7px 4px", fontSize:11, fontWeight:700, color:cloudFilter==="all"?"#fff":T.text}}>
            Tous ({shops.length})
          </button>
          <button onClick={()=>setCloudFilter("cloud")}
            style={{flex:1, background:cloudFilter==="cloud"?T.blue:T.surface, border:`1px solid ${cloudFilter==="cloud"?T.blue:T.border}`, borderRadius:10, padding:"7px 4px", fontSize:11, fontWeight:700, color:cloudFilter==="cloud"?"#fff":T.text}}>
            ☁️ Cloud Actif ({cloudShopsCount})
          </button>
          <button onClick={()=>setCloudFilter("local")}
            style={{flex:1, background:cloudFilter==="local"?T.orange:T.surface, border:`1px solid ${cloudFilter==="local"?T.orange:T.border}`, borderRadius:10, padding:"7px 4px", fontSize:11, fontWeight:700, color:cloudFilter==="local"?"#fff":T.text}}>
            📴 Mode Local ({localShopsCount})
          </button>
        </div>

        <div style={{display:"flex", gap:8, marginBottom:14, alignItems:"center"}}>
          <input
            type="text"
            placeholder="🔎 Rechercher par nom, propriétaire, mot de passe, code DEV..."
            value={search}
            onChange={e=>setSearch(e.target.value)}
            style={{flex:1, background:T.inputBg||T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 12px", color:T.text, fontSize:13}}
          />
          <button onClick={openNewShopModal}
            style={{background:T.accent, border:"none", borderRadius:12, padding:"10px 14px", fontWeight:800, color:T.bg, fontSize:12, display:"flex", alignItems:"center", gap:6, whiteSpace:"nowrap", cursor:"pointer"}}>
            <span>➕</span> Nouveau Commerce
          </button>
        </div>

        {loading ? (
          <div className="spin" style={{width:30,height:30,border:`2px solid ${T.border}`,borderTopColor:T.accent,borderRadius:"50%",margin:"20px auto"}}></div>
        ) : filteredShops.length === 0 ? (
          <div style={{textAlign:"center", color:T.textMute, fontSize:12, padding:"30px 0"}}>
            Aucun commerce trouvé.<br/>
            <button onClick={openNewShopModal} style={{marginTop:10, background:T.accent, border:"none", borderRadius:10, padding:"8px 14px", fontWeight:700, color:T.bg, cursor:"pointer"}}>
              ➕ Créer un commerce
            </button>
          </div>
        ) : (
          <div className="dev-shop-grid">
            {filteredShops.map(shop => {
              const daysLeft = shop.subscriptionEnd ? getDaysLeft(shop.subscriptionEnd) : 0;
              const statusColor = getStatusColor(shop);
              const isCloud = shop.cloudEnabled !== false;
              const username = getShopUsername(shop);
              const password = getShopPassword(shop);
              const accessCode = getShopAccessCode(shop);

              return (
                <div key={shop.id} style={{background:T.surface, borderRadius:16, padding:16, borderLeft: `4px solid ${statusColor}`}}>
                  <div style={{display:"flex", justifyContent:"space-between", alignItems:"start", flexWrap:"wrap", gap:8}}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:800, fontSize:16}}>{shop.shopName}</div>
                      <div style={{fontSize:11, color:T.textMute}}>Propriétaire: {shop.ownerName} · WhatsApp: {shop.whatsapp}</div>
                      <div style={{fontSize:11, color:T.textMute}}>Créé le: {formatDate(shop.createdAt)}</div>
                      {/* Badge Cloud / Local */}
                      <div style={{marginTop:6, display:"flex", alignItems:"center", gap:6}}>
                        <span style={{
                          fontSize:10, fontWeight:700, padding:"3px 10px", borderRadius:12,
                          background: isCloud ? T.btnBlue.bg : "#ff990022",
                          color: isCloud ? T.blue : T.orange,
                          border: `1px solid ${isCloud ? T.blue+"44" : T.orange+"44"}`
                        }}>
                          {isCloud ? "☁️ Cloud Actif (Temps réel ON)" : "📴 Mode Local (Cloud OFF)"}
                        </span>
                      </div>
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div style={{fontSize:11, color:T.textMute}}>Statut</div>
                      <div style={{fontWeight:700, color:statusColor}}>{shop.active ? (daysLeft <= 0 ? "⚠️ Expiré" : (daysLeft <= 7 ? "⚠️ Bientôt expiré" : "✅ Actif")) : "🔒 Suspendu"}</div>
                    </div>
                  </div>

                  {/* IDENTIFIANTS & CODE DÉVELOPPEUR */}
                  <div style={{background:T.surface2, borderRadius:12, padding:"10px 12px", marginTop:10, display:"flex", flexWrap:"wrap", gap:10, alignItems:"center", justifyContent:"space-between", border:`1px dashed ${T.border}`}}>
                    <div style={{display:"flex", gap:14, flexWrap:"wrap", alignItems:"center"}}>
                      <div>
                        <span style={{fontSize:10, color:T.textMute, display:"block"}}>👤 Identifiant :</span>
                        <div style={{fontWeight:700, fontSize:12, color:T.accent}}>{username}</div>
                      </div>
                      <div>
                        <span style={{fontSize:10, color:T.textMute, display:"block"}}>🔑 Mot de passe :</span>
                        <div style={{fontWeight:700, fontSize:12, color:T.green}}>{password}</div>
                      </div>
                      <div>
                        <span style={{fontSize:10, color:T.textMute, display:"block"}}>🏷️ Code Développeur :</span>
                        <div style={{fontWeight:800, fontSize:12, color:T.purple, letterSpacing:1}}>{accessCode}</div>
                      </div>
                    </div>
                    <div style={{display:"flex", gap:6}}>
                      <button onClick={()=>openEditAuth(shop)} style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:8, padding:"5px 9px", fontSize:11, fontWeight:700, color:T.text, cursor:"pointer"}}>
                        ✏️ Modifier accès
                      </button>
                      <button onClick={()=>copyOrShareAccess(shop)} style={{background:T.btnGreen.bg, border:`1px solid ${T.green}44`, borderRadius:8, padding:"5px 9px", fontSize:11, fontWeight:700, color:T.green, cursor:"pointer"}}>
                        📲 Partager
                      </button>
                    </div>
                  </div>

                  <div style={{marginTop:12, paddingTop:12, borderTop:`1px solid ${T.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:8}}>
                    <div>
                      <div style={{fontSize:10, color:T.textMute}}>Abonnement</div>
                      <div style={{display:"flex", alignItems:"center", gap:6}}>
                        <span style={{background:getPlanColor(shop.plan), padding:"2px 10px", borderRadius:20, fontSize:11, fontWeight:600, color:"#fff"}}>{shop.plan || "mensuel"}</span>
                        {shop.subscriptionEnd && <span style={{fontSize:10, color:T.textMute}}>Expire: {formatDate(shop.subscriptionEnd)} ({daysLeft}j)</span>}
                      </div>
                    </div>

                    <div style={{display:"flex", gap:6, flexWrap:"wrap"}}>
                      {/* BOUTON TOGGLE CLOUD */}
                      <button onClick={()=>toggleCloud(shop)}
                        title={isCloud ? "Désactiver le cloud : les données restent en local sans synchronisation Firebase" : "Activer le cloud : synchronisation Firebase et suivi à distance en temps réel"}
                        style={{
                          background: isCloud ? T.btnRed.bg : T.btnGreen.bg,
                          border: `1px solid ${isCloud ? T.red+"55" : T.green+"55"}`,
                          borderRadius: 8, padding: "6px 12px", fontSize: 11, fontWeight: 700,
                          color: isCloud ? T.red : T.green
                        }}>
                        {isCloud ? "📴 Désactiver Cloud (Passer en Local)" : "☁️ Activer Cloud (Temps réel)"}
                      </button>

                      <button onClick={()=>openPlanModal(shop)} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:8, padding:"6px 12px", fontSize:11, fontWeight:600, color:T.text}}>
                        📝 Abonnement
                      </button>
                      <button onClick={()=>sendReminder(shop)} style={{background:T.btnBlue.bg, border:"none", borderRadius:8, padding:"6px 12px", fontSize:11, color:T.blue}}>
                        📱 Rappel
                      </button>
                      <button onClick={()=>toggleShop(shop)} style={{background:shop.active?T.btnRed.bg:T.btnGreen.bg, border:"none", borderRadius:8, padding:"6px 12px", fontSize:11, color:shop.active?T.red:T.green}}>
                        {shop.active?"🔒 Suspendre":"✅ Activer"}
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* MODAL CRÉATION DE COMMERCE */}
      {showNewShopModal && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.9)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000, padding:16}}>
          <div style={{background:T.surface, borderRadius:24, padding:20, width:"100%", maxWidth:420, maxHeight:"92vh", overflowY:"auto"}}>
            <div style={{fontSize:16, fontWeight:800, marginBottom:4, color:T.text}}>➕ Nouveau Commerce</div>
            <div style={{fontSize:11, color:T.textMute, marginBottom:16}}>Créez un commerce et définissez ses accès (Nom, mot de passe et code développeur)</div>

            <div style={{fontSize:11, color:T.textMute, marginBottom:4}}>Nom du commerce *</div>
            <input type="text" placeholder="Ex: Superette Touba, Boutique Fatou..." value={newShopForm.shopName}
              onChange={e=>setNewShopForm(f=>({...f, shopName:e.target.value}))}
              style={{width:"100%", background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:10, padding:10, color:T.text, marginBottom:10}} />

            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:10}}>
              <div>
                <div style={{fontSize:11, color:T.textMute, marginBottom:4}}>Nom du gérant</div>
                <input type="text" placeholder="Ex: Moussa Diop" value={newShopForm.ownerName}
                  onChange={e=>setNewShopForm(f=>({...f, ownerName:e.target.value}))}
                  style={{width:"100%", background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:10, padding:10, color:T.text}} />
              </div>
              <div>
                <div style={{fontSize:11, color:T.textMute, marginBottom:4}}>WhatsApp</div>
                <input type="tel" placeholder="+221..." value={newShopForm.whatsapp}
                  onChange={e=>setNewShopForm(f=>({...f, whatsapp:e.target.value}))}
                  style={{width:"100%", background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:10, padding:10, color:T.text}} />
              </div>
            </div>

            <div style={{background:T.surface2, borderRadius:14, padding:12, marginBottom:12, border:`1px solid ${T.border}`}}>
              <div style={{fontSize:11, fontWeight:700, color:T.accent, marginBottom:8}}>🔑 Paramètres d'authentification du commerce</div>
              
              <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8}}>
                <div>
                  <div style={{fontSize:10, color:T.textMute, marginBottom:3}}>Identifiant</div>
                  <input type="text" placeholder="Identifiant" value={newShopForm.username}
                    onChange={e=>setNewShopForm(f=>({...f, username:e.target.value}))}
                    style={{width:"100%", background:T.surface, border:`1px solid ${T.border}`, borderRadius:8, padding:8, color:T.text, fontSize:12}} />
                </div>
                <div>
                  <div style={{fontSize:10, color:T.textMute, marginBottom:3}}>Mot de passe</div>
                  <input type="text" placeholder="Mot de passe" value={newShopForm.password}
                    onChange={e=>setNewShopForm(f=>({...f, password:e.target.value}))}
                    style={{width:"100%", background:T.surface, border:`1px solid ${T.border}`, borderRadius:8, padding:8, color:T.green, fontWeight:700, fontSize:12}} />
                </div>
              </div>

              <div>
                <div style={{fontSize:10, color:T.textMute, marginBottom:3}}>🏷️ Code d'accès Développeur (fourni au client)</div>
                <div style={{display:"flex", gap:6}}>
                  <input type="text" placeholder="Ex: DEV-1001" value={newShopForm.accessCode}
                    onChange={e=>setNewShopForm(f=>({...f, accessCode:e.target.value.toUpperCase()}))}
                    style={{flex:1, background:T.surface, border:`1px solid ${T.purple}`, borderRadius:8, padding:8, color:T.purple, fontWeight:800, letterSpacing:1, fontSize:13}} />
                  <button type="button" onClick={()=>setNewShopForm(f=>({...f, accessCode:"DEV-" + Math.floor(1000 + Math.random() * 9000)}))}
                    style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:8, padding:"8px 10px", fontSize:11, color:T.text, cursor:"pointer"}}>
                    🎲 Aléatoire
                  </button>
                </div>
              </div>
            </div>

            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12}}>
              <div>
                <div style={{fontSize:11, color:T.textMute, marginBottom:4}}>Formule d'abonnement</div>
                <select value={newShopForm.plan} onChange={e=>setNewShopForm(f=>({...f, plan:e.target.value}))}
                  style={{width:"100%", background:T.inputBg, border:`1px solid ${T.border}`, borderRadius:10, padding:10, color:T.text, fontSize:12}}>
                  <option value="mensuel">📅 Mensuel (30j)</option>
                  <option value="trimestriel">📆 Trimestriel (90j)</option>
                  <option value="annuel">🗓️ Annuel (365j)</option>
                </select>
              </div>

//  IMPRESSION BLE / USB / RAWBT
// ══════════════════════════════════════════════════════════════════
class BLEPrinter {
  constructor() {
    this.device = null;
    this.server = null;
    this.characteristic = null;
    this.connected = false;
    this.listeners = [];
    this.reconnecting = false;
    this._keepAliveTimer = null;
    this._printing = false;
  }
  subscribe(callback) { this.listeners.push(callback); return () => { this.listeners = this.listeners.filter(l => l !== callback); }; }
  notify(data) { this.listeners.forEach(l => l(data)); }
  async connect() {
    if (!navigator.bluetooth) throw new Error("Web Bluetooth non disponible. Utilisez Chrome/Edge sur Android.");
    this.notify({ status: "searching", message: "Recherche d'imprimante..." });
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        "000018f0-0000-1000-8000-00805f9b34fb",
        "e7810a71-73ae-499d-8c15-faa9aef0c3f2",
        "49535343-fe7d-4ae5-8fa9-9fafd205e455",
        "0000ff00-0000-1000-8000-00805f9b34fb"
      ]
    });
    this.device = device;
    device.addEventListener("gattserverdisconnected", () => {
      this.connected = false;
      this.characteristic = null;
      this.notify({ status: "disconnected", message: "Imprimante déconnectée" });
      this.autoReconnect();
    });
    await this.doConnect();
    this._startKeepAlive();
    this.notify({ status: "connected", message: `Connecté à ${device.name || "Imprimante"}`, name: device.name });
    return device.name;
  }
  async doConnect() {
    this.server = await this.device.gatt.connect();
    const services = await this.server.getPrimaryServices();
    let foundChar = null;
    for (const service of services) {
      const chars = await service.getCharacteristics();
      for (const char of chars) {
        if (char.properties.write || char.properties.writeWithoutResponse) { foundChar = char; break; }
      }
      if (foundChar) break;
    }
    if (!foundChar) throw new Error("Caractéristique d'écriture introuvable");
    this.characteristic = foundChar;
    this.connected = true;
  }
  _startKeepAlive() {
    if (this._keepAliveTimer) clearInterval(this._keepAliveTimer);
    this._keepAliveTimer = setInterval(async () => {
      if (!this.connected || this._printing) return;
      try {
        if (this.characteristic && this.device?.gatt?.connected) {
          const noop = new Uint8Array([0x1B, 0x00]);
          await this.characteristic.writeValueWithoutResponse(noop);
        }
      } catch(e) { this.connected = false; this.autoReconnect(); }
    }, 8000);
  }
  _stopKeepAlive() { if (this._keepAliveTimer) { clearInterval(this._keepAliveTimer); this._keepAliveTimer = null; } }
  async autoReconnect() {
    if (this.reconnecting) return;
    this.reconnecting = true;
    this.notify({ status: "reconnecting", message: "Tentative de reconnexion..." });
    for (let i = 0; i < 5; i++) {
      await new Promise(r => setTimeout(r, 2000));
      try {
        if (this.device && this.device.gatt) {
          await this.doConnect();
          this.reconnecting = false;
          this._startKeepAlive();
          this.notify({ status: "connected", message: "Reconnecté !", name: this.device.name });
          return;
        }
      } catch(e) {}
    }
    this.reconnecting = false;
    this.notify({ status: "disconnected", message: "Reconnexion échouée" });
  }
  async disconnect() {
    this._stopKeepAlive();
    if (this.device && this.device.gatt.connected) this.device.gatt.disconnect();
    this.connected = false;
    this.characteristic = null;
    this.notify({ status: "disconnected", message: "Déconnecté" });
  }
  async print(data) {
    if (!this.connected || !this.characteristic) throw new Error("Imprimante non connectée");
    this._printing = true;
    const chunkSize = 95;
    const useWrite = this.characteristic.properties.writeWithoutResponse === false;
    try {
      for (let i = 0; i < data.length; i += chunkSize) {
        const chunk = data.slice(i, i + chunkSize);
        if (useWrite) await this.characteristic.writeValue(chunk);
        else await this.characteristic.writeValueWithoutResponse(chunk);
        await new Promise(r => setTimeout(r, 40));
      }
    } finally { this._printing = false; }
  }
}
const printer = new BLEPrinter();

class USBPrinter {
  constructor() {
    this.device = null;
    this.interfaceNumber = null;
    this.endpointOut = null;
    this.connected = false;
    this.listeners = [];
  }
  subscribe(callback) { this.listeners.push(callback); return () => { this.listeners = this.listeners.filter(l => l !== callback); }; }
  notify(data) { this.listeners.forEach(l => l(data)); }
  async connect() {
    if (!navigator.usb) throw new Error("WebUSB non disponible. Utilisez Chrome/Edge sur PC ou Android.");
    this.notify({ status: "searching", message: "Sélection de l'imprimante USB..." });
    const device = await navigator.usb.requestDevice({ filters: [] });
    this.device = device;
    await this._openAndClaim();
    device.addEventListener && navigator.usb.addEventListener?.("disconnect", (e) => {
      if (e.device === this.device) {
        this.connected = false;
        this.notify({ status: "disconnected", message: "Imprimante USB déconnectée" });
      }
    });
    this.notify({ status: "connected", message: `Connecté à ${device.productName || "Imprimante USB"}`, name: device.productName });
    return device.productName;
  }
  async _openAndClaim() {
    const device = this.device;
    await device.open();
    if (!device.configuration) await device.selectConfiguration(1);
    let ifaceNum = null, epOut = null;
    for (const cfg of device.configurations) {
      for (const iface of cfg.interfaces) {
        for (const alt of iface.alternates) {
          const out = alt.endpoints.find(e => e.direction === "out");
          if (out) { ifaceNum = iface.interfaceNumber; epOut = out.endpointNumber; break; }
        }
        if (epOut !== null) break;
      }
      if (epOut !== null) break;
    }
    if (epOut === null) throw new Error("Aucun point de sortie USB trouvé sur cette imprimante");
    await device.claimInterface(ifaceNum);
    this.interfaceNumber = ifaceNum;
    this.endpointOut = epOut;
    this.connected = true;
  }
  async disconnect() {
    try { if (this.device && this.interfaceNumber !== null) await this.device.releaseInterface(this.interfaceNumber); } catch(e) {}
    try { if (this.device) await this.device.close(); } catch(e) {}
    this.connected = false;
    this.device = null;
    this.notify({ status: "disconnected", message: "Déconnecté" });
  }
  async print(data) {
    if (!this.connected || !this.device || this.endpointOut === null) throw new Error("Imprimante USB non connectée");
    const chunkSize = 4096;
    for (let i = 0; i < data.length; i += chunkSize) {
      const chunk = data.slice(i, i + chunkSize);
      await this.device.transferOut(this.endpointOut, chunk);
    }
  }
}
const usbPrinter = new USBPrinter();

class RawBTPrinter {
  constructor() {
    this.connected = localStorage.getItem("pos_rawbt_ready") === "1";
    this.listeners = [];
  }
  subscribe(callback) { this.listeners.push(callback); return () => { this.listeners = this.listeners.filter(l => l !== callback); }; }
  notify(data) { this.listeners.forEach(l => l(data)); }
  async connect() {
    this.notify({ status: "searching", message: "Ouverture de RawBT..." });
    try { window.location.href = "rawbt://"; } catch(e) {}
    await new Promise(r => setTimeout(r, 300));
    this.connected = true;
    localStorage.setItem("pos_rawbt_ready", "1");
    this.notify({ status: "connected", message: "RawBT activé", name: "RawBT" });
    return "RawBT";
  }
  disconnect() {
    this.connected = false;
    localStorage.removeItem("pos_rawbt_ready");
    this.notify({ status: "disconnected", message: "RawBT désactivé" });
  }
  async print(data) {
    if (!this.connected) throw new Error("RawBT non activé");
    let binary = "";
    for (let i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
    const base64Data = btoa(binary);
    window.location.href = `rawbt:base64,${base64Data}`;
  }
}
const rawbtPrinter = new RawBTPrinter();

function activeThermalPrinter(connType) {
  if (connType === "usb") return usbPrinter;
  if (connType === "rawbt") return rawbtPrinter;
  return printer;
}
function thermalConnected(connType) { return activeThermalPrinter(connType).connected; }

async function openCashDrawer(connType) {
  const cmd = new Uint8Array([0x1B, 0x70, 0x00, 0x19, 0xFA]);
  try {
    const p = activeThermalPrinter(connType);
    if (p.connected) { await p.print(cmd); return true; }
  } catch(e) {}
  return false;
}

const ESC = 0x1B;
const GS = 0x1D;
const LF = 0x0A;
const COL_80 = 42;
const COL_57 = 32;

async function buildESCPOSTicket(shopName, shopPhone, items, total, invoiceNum, col, shopLogo, ticketFooter, shopAddress, shopSlogan) {
  const C = col || COL_80;
  const is80 = C >= COL_80;
  const buf = [];
  const push = (arr) => buf.push(...arr);

  const text = (str) => {
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code >= 32 && code <= 126) buf.push(code);
      else if (code === 0xE9 || code === 0xE8 || code === 0xEA) buf.push(0x65);
      else if (code === 0xE0 || code === 0xE2) buf.push(0x61);
      else if (code === 0xF9 || code === 0xFB) buf.push(0x75);
      else if (code === 0xE7) buf.push(0x63);
      else if (code === 0xEE) buf.push(0x69);
      else if (code === 0xF4) buf.push(0x6F);
      else buf.push(0x20);
    }
  };
  const line = (str) => { text(str); push([LF]); };
  const emptyLine = () => push([LF]);

  const sizeNormal  = () => push([GS, 0x21, 0x00]);
  const sizeMedium  = () => push([GS, 0x21, 0x11]);
  const boldOn      = () => push([ESC, 0x45, 0x01]);
  const boldOff     = () => push([ESC, 0x45, 0x00]);
  const alignCenter = () => push([ESC, 0x61, 0x01]);
  const alignLeft   = () => push([ESC, 0x61, 0x00]);

  push([ESC, 0x40]);
  push([ESC, 0x74, 0x00]);

  alignCenter();
  if (shopLogo) {
    try {
      const maxPx = is80 ? 512 : 384;
      const logoBytes = await logoToESCPOS(shopLogo, maxPx);
      push(logoBytes);
      emptyLine();
    } catch(e) { console.warn('Logo ESC/POS ignoré:', e); }
  }

  alignCenter();
  boldOn();
  push([GS, 0x21, is80 ? 0x11 : 0x10]);
  line(shopName.toUpperCase().slice(0, is80 ? 20 : 16));
  boldOff();
  sizeNormal();
  if (shopAddress) { alignCenter(); line(shopAddress.slice(0, C)); }
  if (shopPhone)   { alignCenter(); line("Tel: " + shopPhone); }
  if (shopSlogan)  { alignCenter(); line(shopSlogan.slice(0, C)); }

  const d = new Date();
  const dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  alignCenter();
  line("TICKET DE CAISSE");
  if (invoiceNum) line("N " + String(invoiceNum).slice(-12));
  line("Date: " + dateStr);

  alignLeft();
  sizeNormal();
  line("=".repeat(C));
  boldOn(); line("ARTICLE / QTE" + " ".repeat(Math.max(1, C - 13 - 7)) + "MONTANT"); boldOff();
  line("-".repeat(C));

  const maxLabel = is80 ? 22 : 16;
  items.forEach(it => {
    const qty = it.qty || 1;
    const price = it.amount;
    const totalLine = price * qty;
    const priceStr = fmtPrice(totalLine);
    const label = (it.label || "Article").slice(0, maxLabel);
    const spaces = Math.max(1, C - label.length - priceStr.length);
    sizeNormal();
    line(label + " ".repeat(spaces) + priceStr);
    if (qty > 1) {
      const qtyStr = `  x${qty} @ ${fmtPrice(price)}`;
      line(qtyStr);
    }
  });

  line("=".repeat(C));
  alignCenter();
  sizeMedium();
  boldOn();
  line("TOTAL: " + fmtPrice(total));
  boldOff();
  sizeNormal();

  emptyLine();
  alignCenter();
  const piedLines = (ticketFooter || "Merci pour votre confiance !\n--- Digitale Solution ---").split("\n").map(l=>l.trim()).filter(Boolean);
  piedLines.forEach(l => line(l.slice(0, C)));

  push([ESC, 0x64, 0x05]);
  push([GS, 0x56, 0x41, 0x03]);

  return new Uint8Array(buf);
}

async function printViaBLE(shopName, shopPhone, items, total, invoiceNum, ticketFormat, shopLogo, nbCopies, ticketFooter, shopAddress, shopSlogan) {
  if (!printer.connected) throw new Error("Imprimante non connectée");
  const col = ticketFormat === "57mm" ? COL_57 : COL_80;
  const copies = Math.max(1, parseInt(nbCopies) || 1);
  const ticket = await buildESCPOSTicket(shopName, shopPhone, items, total, invoiceNum, col, shopLogo, ticketFooter, shopAddress, shopSlogan);
  for (let i = 0; i < copies; i++) {
    await printer.print(ticket);
    if (i < copies - 1) await new Promise(r => setTimeout(r, 600));
  }
  return true;
}

async function printViaRawBT(shopName, shopPhone, items, total, invoiceNum, ticketFormat, shopLogo, nbCopies, ticketFooter, shopAddress, shopSlogan) {
  if (!rawbtPrinter.connected) throw new Error("RawBT non activé");
  const col = ticketFormat === "57mm" ? COL_57 : COL_80;
  const copies = Math.max(1, parseInt(nbCopies) || 1);

async function buildCommandeESCPOS(shopName, shopPhone, shopAddress, shopSlogan, shopLogo, commande, col, ticketFooter) {
  const C = col || COL_80;
  const is80 = C >= COL_80;
  const buf = [];
  const push = (arr) => buf.push(...arr);
  const text = (str) => {
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      if (code >= 32 && code <= 126) buf.push(code);
      else if (code === 0xE9 || code === 0xE8 || code === 0xEA) buf.push(0x65);
      else if (code === 0xE0 || code === 0xE2) buf.push(0x61);
      else if (code === 0xF9 || code === 0xFB) buf.push(0x75);
      else if (code === 0xE7) buf.push(0x63);
      else if (code === 0xEE) buf.push(0x69);
      else if (code === 0xF4) buf.push(0x6F);
      else buf.push(0x20);
    }
  };
  const line = (str) => { text(str); push([LF]); };
  const emptyLine = () => push([LF]);
  const sizeNormal  = () => push([GS, 0x21, 0x00]);
  const sizeMedium  = () => push([GS, 0x21, 0x11]);
  const boldOn      = () => push([ESC, 0x45, 0x01]);
  const boldOff     = () => push([ESC, 0x45, 0x00]);
  const alignCenter = () => push([ESC, 0x61, 0x01]);
  const alignLeft   = () => push([ESC, 0x61, 0x00]);

  push([ESC, 0x40]);
  push([ESC, 0x74, 0x00]);

  alignCenter();
  if (shopLogo) {
    try { const maxPx = is80 ? 512 : 384; push(await logoToESCPOS(shopLogo, maxPx)); emptyLine(); } catch(e) {}
  }

  alignCenter(); boldOn();
  push([GS, 0x21, is80 ? 0x11 : 0x10]);
  line(shopName.toUpperCase().slice(0, is80 ? 20 : 16));
  boldOff(); sizeNormal();
  if (shopAddress) { alignCenter(); line(shopAddress.slice(0, C)); }
  if (shopPhone)   { alignCenter(); line("Tel: " + shopPhone); }
  if (shopSlogan)  { alignCenter(); line(shopSlogan.slice(0, C)); }

  const d = new Date();
  const dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  alignCenter();
  line("BON DE COMMANDE");
  line("Date: " + dateStr);

  alignLeft(); sizeNormal();
  line("=".repeat(C));
  line("Client: " + `${commande.prenom} ${commande.nom}`);
  line("Tel: " + commande.telephone);
  line("Articles: " + commande.nbArticles);
  line("-".repeat(C));
  boldOn(); line("TOTAL A PAYER: " + fmtPrice(commande.total)); boldOff();
  line("VERSE: " + fmtPrice(commande.paidAmount || 0));
  boldOn(); line("RESTE A PAYER: " + fmtPrice(Math.max(0, commande.total - (commande.paidAmount||0)))); boldOff();
  line("=".repeat(C));

  emptyLine();
  alignCenter();
  const piedLines = (ticketFooter || "Merci pour votre confiance !\n--- Digitale Solution ---").split("\n").map(l=>l.trim()).filter(Boolean);
  piedLines.forEach(l => line(l.slice(0, C)));

  push([ESC, 0x64, 0x05]);
  push([GS, 0x56, 0x41, 0x03]);
  return new Uint8Array(buf);
}

    const unsub = activePrinter.subscribe(setStatus);

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>

          <span style={{ fontSize: 24 }}>{icon}</span>

            <div style={{ fontSize: 12, fontWeight: 600, color }}>{isConnected ? `Imprimante ${connTypeLabel(connType)} connectée` : (status.status === "searching" ? "Recherche..." : status.status === "reconnecting" ? "Reconnexion..." : "Hors ligne")}</div>
