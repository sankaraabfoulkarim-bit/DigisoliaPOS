    if(!montantNum || montantNum < 1) { flashMsg("Entrez un montant"); return; }
    const nom = label.trim() || `Vente ${fmtPrice(montantNum)}`;
    setLines([...lines, { id: Date.now()+Math.random(), label: nom, montant: montantNum }]);
    saveHistory(montantNum);
    setMontant("");
    setLabel("");
  };
  
  const supprimerLigne = (id) => setLines(lines.filter(l=>l.id!==id));
  const reset = () => { setLines([]); setMontant(""); setLabel(""); setModeMonnaie(false); setRecu(""); };
  
  const valider = (print) => {
    if(lines.length === 0) { flashMsg("Ajoutez des lignes"); return; }
    const items = lines.map(l => ({ label: l.label, amount: l.montant, qty: 1 }));
    addSale(items, totalLines, print);
    reset();
  };
  
  const pushDigit = (d) => {
    if(modeMonnaie) setRecu(p => p.length >= 8 ? p : p + d);
    else setMontant(p => p.length >= 8 ? p : p + d);
  };
  const del = () => {
    if(modeMonnaie) setRecu(p => p.slice(0,-1));
    else setMontant(p => p.slice(0,-1));
  };
  
  return (
    <div className="vr-root" style={{display:"flex", flexDirection:"column", width:"100%", maxWidth:900, margin:"0 auto", boxSizing:"border-box"}}>
      <div className="vr-layout" style={{display:"flex", gap:16, alignItems:"flex-start"}}>
        <div className="vr-left" style={{flex:"1 1 340px", minWidth:0}}>
          <div style={{background:T.surface, borderRadius:16, padding:16, marginBottom:12, border:`2px solid ${modeMonnaie ? T.blue : (montantNum>0 ? T.accent : T.border)}`}}>
            {!modeMonnaie && (
              <>
                <input placeholder="Libellé (optionnel)" value={label} onChange={e=>setLabel(e.target.value)} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, marginBottom:6, color:T.text}} />
                <div style={{display:"flex", gap:4, flexWrap:"wrap", marginBottom:8}}>
                  {QUICK_LABELS.map(l=>(
                    <button key={l} onClick={()=>setLabel(l)} style={{background:label===l?T.accent:T.surface2, border:`1px solid ${label===l?T.accent:T.border}`, borderRadius:8, padding:"3px 8px", fontSize:10, color:label===l?T.bg:T.textMute}}>{l}</button>
                  ))}
                </div>
                {montantHistory.length > 0 && montant === "" && (
                  <div style={{marginBottom:8}}>
                    <div style={{fontSize:9, color:T.textMute, marginBottom:4}}>🕐 Récents :</div>
                    <div style={{display:"flex", gap:4, flexWrap:"wrap"}}>
                      {montantHistory.slice(0,6).map(h=>(
                        <button key={h} onClick={()=>setMontant(String(h))} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:8, padding:"3px 8px", fontSize:10, fontWeight:600}}>{fmtPrice(h)}</button>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:8}}>
              <span style={{fontSize:11, color:T.textMute, flexShrink:0}}>{modeMonnaie ? "Montant reçu" : "Montant"}</span>
              <span style={{fontSize:"clamp(22px,min(8vw,5vh),36px)", fontWeight:800, color:modeMonnaie ? T.blue : (montantNum>0 ? T.accent : T.textMute), overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
                {modeMonnaie ? (recu ? fmtPrice(recuNum) : "—") : (montant ? fmtPrice(montantNum) : "0 F")}
              </span>
            </div>
          </div>

          {modeMonnaie && (
            <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8, marginBottom:12}}>
              {BILLS.map(b=><button key={b} onClick={()=>setRecu(String(b))} style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, padding:12, fontWeight:700}}>{b>=1000?(b/1000)+"k":b}</button>)}
            </div>
          )}

          {lines.length > 0 && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:10, color:T.textMute, marginBottom:6}}>Lignes ({lines.length})</div>
              <div style={{maxHeight:"clamp(120px,30vh,260px)", overflowY:"auto"}}>
                {lines.map((l,idx)=>(
                  <div key={l.id} style={{background:T.surface2, borderRadius:10, padding:10, marginBottom:6, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                    <div><span style={{color:T.textMute, marginRight:8}}>{idx+1}.</span><span>{l.label}</span></div>
                    <div style={{display:"flex", alignItems:"center", gap:10}}>
                      <span style={{fontWeight:700, color:T.accent}}>{fmtPrice(l.montant)}</span>
                      {!modeMonnaie && <button onClick={()=>supprimerLigne(l.id)} style={{background:T.btnRed.bg, border:"none", borderRadius:6, width:28, height:28, color:T.red, fontSize:16, flexShrink:0}}>×</button>}
                    </div>
                  </div>
                ))}
              </div>
              <div style={{background:T.btnGreen.bg, borderRadius:12, padding:12, marginTop:6, display:"flex", justifyContent:"space-between", border:`1px solid ${T.green}`}}>
                <span style={{fontWeight:700}}>TOTAL</span>
                <span style={{fontSize:20, fontWeight:800, color:T.green}}>{fmtPrice(totalLines)}</span>
              </div>
            </div>
          )}

          {modeMonnaie && recuNum > 0 && (
            <div style={{background:monnaie>=0 ? T.btnGreen.bg : T.btnRed.bg, borderRadius:12, padding:16, textAlign:"center", marginBottom:12}}>
              <div style={{fontSize:11, color:T.textMute}}>Monnaie à rendre</div>
              <div style={{fontSize:32, fontWeight:800, color:monnaie>=0 ? T.green : T.red}}>{monnaie>=0 ? fmtPrice(monnaie) : `-${fmtPrice(Math.abs(monnaie))}`}</div>
            </div>
          )}
        </div>

        <div className="vr-right" style={{flex:"1 1 260px", minWidth:0, background:T.bg}}>
          <div className="vr-numpad" style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:"clamp(4px,1vw,6px)"}}>
            {[7,8,9,4,5,6,1,2,3].map(d=><button key={d} className="vr-numkey" onClick={()=>pushDigit(String(d))} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:"clamp(38px,min(11vw,8vh),56px)", fontSize:"clamp(16px,min(5vw,3.4vh),22px)", fontWeight:600, color:T.text}}>{d}</button>)}
            <button className="vr-numkey" onClick={()=>pushDigit("00")} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:"clamp(38px,min(11vw,8vh),56px)", fontSize:"clamp(13px,min(3.6vw,2.6vh),17px)", color:T.text}}>00</button>
            <button className="vr-numkey" onClick={()=>pushDigit("0")} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:"clamp(38px,min(11vw,8vh),56px)", fontSize:"clamp(16px,min(5vw,3.4vh),22px)", color:T.text}}>0</button>
            <button className="vr-numkey" onClick={del} style={{background:T.btnRed.bg, border:`1px solid ${T.red}44`, borderRadius:12, height:"clamp(38px,min(11vw,8vh),56px)", fontSize:"clamp(14px,min(4vw,2.8vh),19px)", color:T.red}}>⌫</button>
          </div>

          {!modeMonnaie ? (
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:8}}>
              <button onClick={reset} style={{background:"transparent", border:`1px solid ${T.red}44`, borderRadius:12, padding:"10px 6px", color:T.red, fontWeight:600, fontSize:"clamp(11px,2.6vw,13px)"}}>✕ Annuler</button>
              <button onClick={ajouterLigne} style={{background:T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", color:T.blue, fontWeight:700, fontSize:"clamp(11px,2.6vw,13px)"}}>➕ Ajouter ligne</button>
              <button onClick={()=>{ if(lines.length) setModeMonnaie(true); else flashMsg("Ajoutez des lignes d'abord"); }} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", fontWeight:600, fontSize:"clamp(11px,2.6vw,13px)"}}>💵 Monnaie</button>
              <button onClick={()=>valider(false)} style={{background:T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", color:T.blue, fontWeight:700, fontSize:"clamp(11px,2.6vw,13px)"}}>✅ Sans ticket</button>
              <button onClick={()=>valider(true)} style={{gridColumn:"1 / -1", background:T.btnGreen.bg, border:`2px solid ${T.green}`, borderRadius:12, padding:12, color:T.green, fontWeight:800, fontSize:"clamp(13px,3vw,15px)"}}>🖨️ Valider et imprimer</button>
            </div>
          ) : (
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:8}}>
              <button onClick={()=>{ setModeMonnaie(false); setRecu(""); }} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", fontSize:"clamp(11px,2.6vw,13px)"}}>← Retour</button>
              <button onClick={()=>valider(false)} style={{background:T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius:12, padding:"10px 6px", color:T.blue, fontWeight:600, fontSize:"clamp(11px,2.6vw,13px)"}}>✅ Sans ticket</button>
              <button onClick={()=>valider(true)} style={{gridColumn:"1 / -1", background:T.btnGreen.bg, border:`2px solid ${T.green}`, borderRadius:12, padding:12, color:T.green, fontWeight:800, fontSize:"clamp(13px,3vw,15px)"}}>🖨️ Imprimer</button>
            </div>
          )}
        </div>
      </div>
      <div style={{height:80}} />
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  APPLICATION PRINCIPALE DU COMMERCE (MainApp)
// ══════════════════════════════════════════════════════════════════
function MainApp({
  shopId, shopName, ownerName, shopPhone, shopAddress, shopSlogan, shopLogo,
  ticketFormat, ticketCopies, ticketFooter, whatsappDev,
  themeName, setThemeName, logout, flashMsg,
  cloudEnabled = true, setShopCloud, onOpenDevModal
}) {
  const T = THEMES[themeName] || THEMES.dark;
  const today = new Date().toISOString().slice(0, 10);

  // Triple-clic logo commerce pour accès développeur secret
  const shopLogoClicksRef = useRef(0);
  const shopLogoTimerRef = useRef(null);
  const handleShopLogoTripleClick = () => {
    shopLogoClicksRef.current += 1;
    if (shopLogoTimerRef.current) clearTimeout(shopLogoTimerRef.current);
    if (shopLogoClicksRef.current >= 3) {
      shopLogoClicksRef.current = 0;
      if (onOpenDevModal) onOpenDevModal();
    } else {
      shopLogoTimerRef.current = setTimeout(() => {
        shopLogoClicksRef.current = 0;
      }, 1000);
    }
  };

  // ÉTATS LOCAUX / SYNCHRONISÉS
  const [products, setProducts] = useState(() => OfflineStore.get(shopId, "products", []));
  const [sales, setSales] = useState(() => OfflineStore.get(shopId, "sales", []));
  const [depenses, setDepenses] = useState(() => OfflineStore.get(shopId, "depenses", []));
  const [commandes, setCommandes] = useState(() => OfflineStore.get(shopId, "commandes", []));
  const [dettes, setDettes] = useState(() => OfflineStore.get(shopId, "dettes", []));
  const [cart, setCart] = useState(() => OfflineStore.get(shopId, "cart", []));

  // GESTION DES NIVEAUX D'ACCÈS (PROPRIÉTAIRE, GÉRANT, CAISSIÈRE)
  const [staffList, setStaffList] = useState(() => {
    const cached = OfflineStore.get(shopId, "caissiers", []);
    if (Array.isArray(cached) && cached.length > 0) {
      return cached.map((s, idx) => ({
        ...s,
        role: s.role || (idx === 0 ? "proprietaire" : idx === 1 ? "gerant" : "caissiere"),
        pin: s.pin || (idx === 0 ? "0000" : idx === 1 ? "1111" : "2222")
      }));
    }
    return getDefaultShopUsers(shopName, ownerName);
  });

  const [currentStaff, setCurrentStaff] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(`pos_active_staff_${shopId}`) || "null");
      if (saved?.id) return saved;
    } catch(e) {}
    const cached = OfflineStore.get(shopId, "caissiers", []);
    if (Array.isArray(cached) && cached.length > 0) {
      const p = cached.find(c => c.role === "proprietaire") || cached[0];
      return { ...p, role: p.role || "proprietaire", pin: p.pin || "0000" };
    }
    return getDefaultShopUsers(shopName, ownerName)[0];
  });

  // Modals de changement d'utilisateur et d'autorisation
  const [showSwitchUserModal, setShowSwitchUserModal] = useState(false);
  const [pinTargetUser, setPinTargetUser] = useState(null);
  const [switchPinInput, setSwitchPinInput] = useState("");
  const [switchPinError, setSwitchPinError] = useState(false);
  const [authModal, setAuthModal] = useState(null); // { title, desc, onSuccess }
  const [authPinInput, setAuthPinInput] = useState("");
  const [authPinError, setAuthPinError] = useState(false);
  const [tempUnlockedExpenses, setTempUnlockedExpenses] = useState(false);
  const [showLogoutModal, setShowLogoutModal] = useState(false);

  // Rôle actif et permissions
  const userRoleKey = currentStaff?.role || "proprietaire";
  const userRoleInfo = SHOP_ROLES[userRoleKey] || SHOP_ROLES.proprietaire;
  const canDo = (permKey) => {
    return !!(userRoleInfo.perms && userRoleInfo.perms[permKey]);
  };

  // Sync state
  const [syncState, setSyncState] = useState({ online: navigator.onLine, pending: 0 });

  // Navigation tabs
  const [tab, setTab] = useState("rapide"); // rapide, catalogue, panier, ventes, depenses, commandes, dettes, plus, cloture
  const [plusSubTab, setPlusSubTab] = useState("kpi");

  // Impression
  const [connType, setConnType] = useState(() => localStorage.getItem("pos_conn_type") || "ble");
  const handleSetConnType = (t) => { setConnType(t); localStorage.setItem("pos_conn_type", t); };

  // Synchronisation des collections avec respect du mode Cloud (cloudEnabled)
  useEffect(() => {
    const unsubs = [];
    const syncCol = (colName, setter) => {
      return syncShopData(shopId, colName, (data) => {
        setter(data);
      }, cloudEnabled);
    };

    unsubs.push(syncCol("products", setProducts));
    unsubs.push(syncCol("sales", setSales));
    unsubs.push(syncCol("depenses", setDepenses));
    unsubs.push(syncCol("commandes", setCommandes));
    unsubs.push(syncCol("dettes", setDettes));
    unsubs.push(syncCol("caissiers", (data) => {
      if (Array.isArray(data) && data.length > 0) {
        const enriched = data.map((s, idx) => ({
          ...s,
          role: s.role || (idx === 0 ? "proprietaire" : idx === 1 ? "gerant" : "caissiere"),
          pin: s.pin || (idx === 0 ? "0000" : idx === 1 ? "1111" : "2222")
        }));
        setStaffList(enriched);
      }
    }));

    const onlineH = () => setSyncState(s => ({ ...s, online: true }));
    const offlineH = () => setSyncState(s => ({ ...s, online: false }));
    window.addEventListener("online", onlineH);
    window.addEventListener("offline", offlineH);

    return () => {
      unsubs.forEach(u => u && u());
      window.removeEventListener("online", onlineH);
      window.removeEventListener("offline", offlineH);
    };
  }, [shopId, cloudEnabled]);

  // Sauvegarde panier dans OfflineStore
  useEffect(() => {
    OfflineStore.set(shopId, "cart", cart);
  }, [cart, shopId]);

  // GESTION DU STOCK
  const updateStock = (productId, delta, type = "sortie", motif = "") => {
    setProducts(prev => {
      const next = prev.map(p => {
        if (p.id !== productId || p.stock === -1 || p.stock === undefined) return p;
        const newStock = Math.max(0, (p.stock || 0) + (type === "entree" ? delta : -delta));
        return { ...p, stock: newStock };
      });
      OfflineStore.set(shopId, "products", next);
      if (cloudEnabled && db) {
        db.collection("shops").doc(shopId).collection("products").doc(productId).update({
          stock: next.find(p => p.id === productId)?.stock ?? 0
        }).catch(() => {});
      }
      return next;
    });
  };

  // AJOUTER UNE VENTE
  const addSale = async (items, total, printTicket = false, extra = {}) => {
    const saleId = "s_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const sale = {
      id: saleId,
      date: today,
      timestamp: Date.now(),
      items: items.map(i => ({
        label: i.label || i.name,
        amount: i.amount || i.price,
        qty: i.qty || 1,
        productId: i.productId || i.id || null
      })),
      total,
      caissier: currentStaff?.name || "Admin",
      caissierRole: currentStaff?.role || "proprietaire",
      cancelled: false,
      ...extra
    };

    // 1. Mettre à jour les ventes en local
    const nextSales = [sale, ...sales];
    setSales(nextSales);
    OfflineStore.set(shopId, "sales", nextSales);

    // 2. Décrémenter le stock pour chaque article
    items.forEach(it => {
      const pId = it.productId || it.id;
      if (pId) updateStock(pId, it.qty || 1, "sortie", `Vente #${saleId}`);
    });

    // 3. Sync Cloud si activé
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("sales").doc(saleId).set(sale).catch(() => {});
    }

    // 4. Audit Log
    const actorLog = currentStaff?.name ? `${currentStaff.name} (${userRoleInfo.label})` : "Admin";
    auditLog.add(shopId, "vente", `Vente: ${fmtPrice(total)} (${items.length} art.)`, actorLog);

    // 5. Impression
    if (printTicket) {
      try {
        if (thermalConnected(connType)) {
          await printViaThermal(connType, shopName, shopPhone, sale.items, total, saleId, ticketFormat, shopLogo, ticketCopies, ticketFooter, shopAddress, shopSlogan);
          flashMsg("✅ Vente enregistrée & ticket imprimé");
        } else {
          printFallback(shopName, shopPhone, sale.items, total, saleId, ticketFormat, shopLogo, ticketCopies, ticketFooter, shopAddress, shopSlogan);
          flashMsg("✅ Vente enregistrée (Aperçu impression)");
        }
      } catch(e) {
        flashMsg("⚠️ Vente enregistrée mais impression échouée: " + e.message);
      }
    } else {
      flashMsg("✅ Vente enregistrée : " + fmtPrice(total));
    }
  };

  // EXÉCUTER L'ANNULATION DE VENTE
  const doExecuteCancelSale = async (sale, authorizerName = "Gérant") => {
    if (!window.confirm(`Confirmer l'annulation de la vente #${sale.id} (${fmtPrice(sale.total)}) ?`)) return;
    const nextSales = sales.map(s => s.id === sale.id ? { ...s, cancelled: true } : s);
    setSales(nextSales);
    OfflineStore.set(shopId, "sales", nextSales);

    // Réintégrer le stock
    (sale.items || []).forEach(it => {
      if (it.productId) updateStock(it.productId, it.qty || 1, "entree", `Annulation #${sale.id}`);
    });

    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("sales").doc(sale.id).update({ cancelled: true }).catch(() => {});
    }

    const currentActor = currentStaff?.name || "Caissière";
    const auditText = currentStaff?.role === "caissiere"
      ? `Annulation vente #${sale.id} (${fmtPrice(sale.total)}) par Caissière ${currentActor} [Autorisé par ${authorizerName}]`
      : `Annulation vente #${sale.id} (${fmtPrice(sale.total)}) par ${authorizerName}`;
    auditLog.add(shopId, "annulation", auditText, authorizerName);
    flashMsg("❌ Vente annulée et stock réintégré");
  };

  // ANNULER UNE VENTE (VÉRIFICATION DES DROITS)
  const cancelSale = async (sale) => {
    if (currentStaff?.role === "caissiere") {
      setAuthPinInput("");
      setAuthPinError(false);
      setAuthModal({
        title: "🔐 Autorisation requise — Annulation de Vente",
        desc: `La caissière ${currentStaff?.name || ""} demande l'annulation de la vente #${sale.id} (${fmtPrice(sale.total)}). Entrez le code PIN d'un Gérant ou Propriétaire :`,
        onSuccess: (authorizer) => {
          doExecuteCancelSale(sale, authorizer.name);
        }
      });
      return;
    }
    doExecuteCancelSale(sale, currentStaff?.name || "Admin");
  };

  // PANIER ACTIONS
  const addToCart = (product) => {
    const existing = cart.find(c => c.id === product.id);
    let nextCart;
    if (existing) {
      nextCart = cart.map(c => c.id === product.id ? { ...c, qty: c.qty + 1 } : c);
    } else {
      nextCart = [...cart, { ...product, qty: 1, amount: product.price, label: product.name }];
    }
    setCart(nextCart);
    flashMsg(`+ ${product.name}`);
  };

  const updateCartQty = (id, delta) => {
    const next = cart.map(c => {
      if (c.id !== id) return c;
      const nQty = c.qty + delta;
      return nQty > 0 ? { ...c, qty: nQty } : null;
    }).filter(Boolean);
    setCart(next);
  };

  const clearCart = () => setCart([]);

  const validateCart = (print = false) => {
    if (!cart.length) return;
    const total = cart.reduce((s, i) => s + (i.amount || i.price) * i.qty, 0);
    addSale(cart, total, print);
    clearCart();
    setTab("rapide");
  };

  // DÉPENSES
  const addDepense = async (dep) => {
    const dId = "d_" + Date.now().toString(36);
    const item = { id: dId, date: today, timestamp: Date.now(), ...dep };
    const next = [item, ...depenses];
    setDepenses(next);
    OfflineStore.set(shopId, "depenses", next);
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("depenses").doc(dId).set(item).catch(() => {});
    }
    flashMsg("✅ Dépense enregistrée : " + fmtPrice(dep.montant));
  };

  const deleteDepense = async (id) => {
    const next = depenses.filter(d => d.id !== id);
    setDepenses(next);
    OfflineStore.set(shopId, "depenses", next);
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("depenses").doc(id).delete().catch(() => {});
    }
    flashMsg("🗑️ Dépense supprimée");
  };

  // COMMANDES
  const addCommande = async (cmd) => {
    const cId = "cmd_" + Date.now().toString(36);
    const item = { id: cId, date: today, timestamp: Date.now(), ...cmd };
    const next = [item, ...commandes];
    setCommandes(next);
    OfflineStore.set(shopId, "commandes", next);
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("commandes").doc(cId).set(item).catch(() => {});
    }
    flashMsg("✅ Bon de commande enregistré");
  };

  const updateCommande = async (id, patch) => {
    const next = commandes.map(c => c.id === id ? { ...c, ...patch } : c);
    setCommandes(next);
    OfflineStore.set(shopId, "commandes", next);
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("commandes").doc(id).update(patch).catch(() => {});
    }
    flashMsg("✅ Commande mise à jour");
  };

  // DETTES
  const addDette = async (dt) => {
    const dtId = "det_" + Date.now().toString(36);
    const item = { id: dtId, date: today, timestamp: Date.now(), regle: false, ...dt };
    const next = [item, ...dettes];
    setDettes(next);
    OfflineStore.set(shopId, "dettes", next);
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("dettes").doc(dtId).set(item).catch(() => {});
    }
    flashMsg("✅ Dette enregistrée");
  };

  const toggleDette = async (id, isRegle) => {
    const next = dettes.map(d => d.id === id ? { ...d, regle: isRegle } : d);
    setDettes(next);
    OfflineStore.set(shopId, "dettes", next);
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("dettes").doc(id).update({ regle: isRegle }).catch(() => {});
    }
    flashMsg(isRegle ? "✅ Dette marquée comme réglée" : "↩ Dette réouverte");
  };

  // CALCULS STATS RAPIDES
  const caToday = sales.filter(s => s.date === today && !s.cancelled).reduce((a, s) => a + (s.total || 0), 0);
  const cartCount = cart.reduce((a, c) => a + c.qty, 0);
  const cartTotal = cart.reduce((a, c) => a + (c.amount || c.price) * c.qty, 0);

  // RENDU DU SOUS-ONGLET "PLUS"
  const renderPlusContent = () => {
    switch(plusSubTab) {
      case "kpi":
        return <SectionKPI T={T} sales={sales} depenses={depenses} products={products} credits={dettes} />;
      case "monnaie":
        return <SectionMonnaieCalculator T={T} />;
      case "crm":
        return <SectionCRM T={T} shopId={shopId} sales={sales} flashMsg={flashMsg} />;
      case "promo":
        return <SectionPromo T={T} shopId={shopId} flashMsg={flashMsg} />;
      case "pwa":
        return <SectionPWAInstall T={T} flashMsg={flashMsg} />;
      case "fournisseurs":
        return <SectionFournisseurs T={T} shopId={shopId} flashMsg={flashMsg} />;
      case "abonnements":
        return <SectionAbonnements T={T} shopId={shopId} flashMsg={flashMsg} />;
      case "repas":
        return <SectionRepas T={T} shopId={shopId} addSale={addSale} flashMsg={flashMsg} />;
      case "prevision":
        return <SectionPrevision T={T} sales={sales} />;
      case "classement":
        return <SectionClassement T={T} sales={sales} />;
      case "devis":
        return <SectionDevis T={T} shopId={shopId} shopName={shopName} products={products} addSale={addSale} flashMsg={flashMsg} />;
      case "retours":
        return <SectionRetours T={T} shopId={shopId} sales={sales} updateStock={updateStock} flashMsg={flashMsg} />;
      case "lots":
        return <SectionLots T={T} shopId={shopId} products={products} setProducts={setProducts} flashMsg={flashMsg} />;
      case "equipe":
        return (
          <SectionEquipe
            T={T}
            shopId={shopId}
            staffList={staffList}
            setStaffList={setStaffList}
            currentStaff={currentStaff}
            onSelectStaff={(staff) => {
              setCurrentStaff(staff);
              localStorage.setItem(`pos_active_staff_${shopId}`, JSON.stringify(staff));
              flashMsg(`👤 Connecté en tant que ${staff.name} (${SHOP_ROLES[staff.role || "caissiere"]?.label})`);
            }}
            flashMsg={flashMsg}
            cloudEnabled={cloudEnabled}
            logout={logout}
          />
        );
      case "audit":
        if (!canDo("canViewAudit")) {
          return (
            <div style={{ background:T.surface, borderRadius:16, padding:24, textAlign:"center", border:`1px solid ${T.border}` }}>
              <div style={{ fontSize:36, marginBottom:8 }}>🔒</div>
              <div style={{ fontSize:15, fontWeight:800, color:T.text, marginBottom:4 }}>Accès restreint au Journal d'Audit</div>
              <div style={{ fontSize:12, color:T.textMute, maxWidth:320, margin:"0 auto 12px", lineHeight:1.5 }}>
                Le journal de sécurité et d'audit des actions est réservé au <strong>Propriétaire</strong> de l'établissement.
              </div>
              <button
                onClick={() => {
                  setAuthModal({
                    title: "Autorisation Audit Propriétaire",
                    desc: "Entrez le code PIN du Propriétaire pour consulter le journal d'audit :",
                    onSuccess: () => {
                      flashMsg("✅ Accès Journal d'audit autorisé");
                      setPlusSubTab("audit");
                    }
                  });
                }}
                style={{ background:T.accent, border:"none", borderRadius:10, padding:"8px 16px", fontWeight:800, color:T.bg, fontSize:12, cursor:"pointer" }}
              >
                🔐 Déverrouiller avec PIN Propriétaire
              </button>
            </div>
          );
        }
        return <SectionAudit T={T} shopId={shopId} />;
      case "sessions":
        return <SectionSessions T={T} shopId={shopId} sales={sales} caissiers={staffList} logout={logout} />;
      case "importcsv":
        return <SectionImportCSV T={T} shopId={shopId} products={products} setProducts={setProducts} flashMsg={flashMsg} />;
      case "qrcode":
        return <SectionQRCode T={T} shopId={shopId} shopName={shopName} products={products} />;
      case "alertes":
        return <SectionAlertes T={T} shopId={shopId} whatsapp={shopPhone} products={products} sales={sales} depenses={depenses} />;
      case "scanfacture":
        return <SectionScanFacture T={T} shopId={shopId} flashMsg={flashMsg} />;
      case "imprimante":
        return <BLEStatus T={T} connType={connType} setConnType={handleSetConnType} />;
      default:
        return null;
    }
  };

  // NOUVEAU PRODUIT MODAL / STATE
  const [showAddProd, setShowAddProd] = useState(false);
  const [newPName, setNewPName] = useState("");
  const [newPPrice, setNewPPrice] = useState("");
  const [newPCat, setNewPCat] = useState("");
  const [newPStock, setNewPStock] = useState("");
  const [catFilter, setCatFilter] = useState("all");
  const [searchProd, setSearchProd] = useState("");

  const handleCreateProduct = async () => {
    if (!newPName.trim() || !newPPrice) { flashMsg("Nom et prix requis"); return; }
    const pId = "p_" + Date.now().toString(36);
    const prod = {
      id: pId,
      name: newPName.trim(),
      price: parseInt(newPPrice) || 0,
      category: newPCat.trim() || "Général",
      stock: newPStock === "" ? -1 : parseInt(newPStock) || 0,
      active: true,
      createdAt: Date.now()
    };
    const nextProds = [...products, prod];
    setProducts(nextProds);
    OfflineStore.set(shopId, "products", nextProds);
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("products").doc(pId).set(prod).catch(() => {});
    }
    auditLog.add(shopId, "produit", `Création produit: ${prod.name} (${fmtPrice(prod.price)})`, currentCaissier?.name || "Admin");
    setNewPName(""); setNewPPrice(""); setNewPCat(""); setNewPStock(""); setShowAddProd(false);
    flashMsg("✅ Produit créé");
  };

  // NOUVELLE DÉPENSE STATE
  const [showAddDep, setShowAddDep] = useState(false);
  const [depMontant, setDepMontant] = useState("");
  const [depMotif, setDepMotif] = useState("");
  const [depCat, setDepCat] = useState("Divers");

  const handleCreateDepense = () => {
    if (!depMontant || !depMotif.trim()) { flashMsg("Montant et motif requis"); return; }
    addDepense({ montant: parseInt(depMontant)||0, motif: depMotif.trim(), categorie: depCat });
    setDepMontant(""); setDepMotif(""); setShowAddDep(false);
  };

  // NOUVELLE COMMANDE STATE
  const [showAddCmd, setShowAddCmd] = useState(false);
  const [cmdNom, setCmdNom] = useState("");
  const [cmdPrenom, setCmdPrenom] = useState("");
  const [cmdTel, setCmdTel] = useState("");
  const [cmdArticles, setCmdArticles] = useState("");
  const [cmdTotal, setCmdTotal] = useState("");
  const [cmdVerse, setCmdVerse] = useState("");

  const handleCreateCommande = () => {
    if (!cmdNom.trim() || !cmdTel.trim() || !cmdTotal) { flashMsg("Nom, téléphone et total requis"); return; }
    const totalNum = parseInt(cmdTotal) || 0;
    const verseNum = parseInt(cmdVerse) || 0;
    addCommande({
      nom: cmdNom.trim(),
      prenom: cmdPrenom.trim(),
      telephone: cmdTel.trim(),
      nbArticles: cmdArticles.trim() || "1",
      total: totalNum,
      paidAmount: verseNum,
      statut: verseNum >= totalNum ? "livre" : "en_cours"
    });
    setCmdNom(""); setCmdPrenom(""); setCmdTel(""); setCmdArticles(""); setCmdTotal(""); setCmdVerse(""); setShowAddCmd(false);
  };

  // NOUVELLE DETTE STATE
  const [showAddDette, setShowAddDette] = useState(false);
  const [detteClient, setDetteClient] = useState("");
  const [detteTel, setDetteTel] = useState("");
  const [detteMontant, setDetteMontant] = useState("");
  const [detteMotif, setDetteMotif] = useState("");

  const handleCreateDette = () => {
    if (!detteClient.trim() || !detteMontant) { flashMsg("Nom du client et montant requis"); return; }
    addDette({
      client: detteClient.trim(),
      telephone: detteTel.trim(),
      montant: parseInt(detteMontant) || 0,
      motif: detteMotif.trim() || "Achat à crédit"
    });
    setDetteClient(""); setDetteTel(""); setDetteMontant(""); setDetteMotif(""); setShowAddDette(false);
  };

  // FILTRAGE PRODUITS
  const categories = ["all", ...new Set(products.map(p => p.category || "Général"))];
  const filteredProducts = products.filter(p => {
    if (p.active === false) return false;
    if (catFilter !== "all" && (p.category || "Général") !== catFilter) return false;
    if (searchProd && !p.name.toLowerCase().includes(searchProd.toLowerCase())) return false;
    return true;
  });

  return (
    <div style={{ display:"flex", flexDirection:"column", height:"100vh", background:T.bg, color:T.text, overflow:"hidden" }}>
      {/* ── HEADER ── */}
      <header style={{ background:T.header, borderBottom:`1px solid ${T.border}`, padding:"8px 12px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:8, flexShrink:0 }}>
        <div
          onClick={handleShopLogoTripleClick}
          title={`${shopName || "Commerce"} (Triple-clic pour accès développeur)`}
          style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", userSelect:"none" }}
        >
          {shopLogo ? (
            <img src={shopLogo} alt="Logo" style={{ width:32, height:32, borderRadius:8, objectFit:"cover" }} />
          ) : (
            <div style={{ width:32, height:32, borderRadius:8, background:T.accent, color:T.bg, display:"flex", alignItems:"center", justifyContent:"center", fontWeight:900, fontSize:15 }}>
              {(shopName || "C").slice(0, 1).toUpperCase()}
            </div>
          )}
          <div>
            <div style={{ fontFamily:"'Outfit'", fontWeight:800, fontSize:14, lineHeight:1.1 }}>{shopName || "Caisse Pro"}</div>
            <div style={{ fontSize:9, color:T.textMute, display:"flex", alignItems:"center", gap:4 }}>
              <span>CA Auj: <b style={{ color:T.green }}>{fmtPrice(caToday)}</b></span>
              <span>·</span>
              <span style={{
                color: cloudEnabled ? T.blue : T.orange,
                fontWeight: 700
              }}>
                {cloudEnabled ? "☁️ Cloud" : "📴 Local"}
              </span>
            </div>
          </div>
        </div>

        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
          {/* BADGE RÔLE ET SÉLECTEUR RAPIDE D'UTILISATEUR */}
          <button
            onClick={() => {
              setPinTargetUser(null);
              setSwitchPinInput("");
              setSwitchPinError(false);
              setShowSwitchUserModal(true);
            }}
            title="Changer d'utilisateur ou de niveau d'accès (Propriétaire, Gérant, Caissière)"
            style={{
              display: "flex",
              alignItems: "center",
              gap: 5,
              background: userRoleInfo.bgBadge,
              border: `1.5px solid ${userRoleInfo.borderBadge}`,
              borderRadius: 10,
              padding: "4px 8px",
              fontSize: 11,
              fontWeight: 800,
              color: userRoleInfo.color,
              cursor: "pointer"
            }}
          >
            <span>{userRoleInfo.icon}</span>
            <span style={{ maxWidth: 85, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
              {currentStaff?.name || userRoleInfo.label}
            </span>
            <span style={{ fontSize: 9, opacity: 0.7 }}>▾</span>
          </button>

          {/* BOUTON INSTALLATION PWA */}
          <PWAInstallHeaderButton T={T} flashMsg={flashMsg} />

          <div className="hdr-themes theme-toggle" style={{ background:T.surface2 }}>
            <button className={`theme-btn${themeName==="auto"?" active":""}`} onClick={()=>setThemeName("auto")}>⚙️</button>
            <button className={`theme-btn${themeName==="light"?" active":""}`} onClick={()=>setThemeName("light")}>☀️</button>
            <button className={`theme-btn${themeName==="dark"?" active":""}`} onClick={()=>setThemeName("dark")}>🌙</button>
            <button className={`theme-btn${themeName==="neon"?" active":""}`} onClick={()=>setThemeName("neon")}>⚡</button>
          </div>

          <button
            onClick={() => setShowLogoutModal(true)}
            title="Se déconnecter de la session du commerce"
            aria-label="Déconnexion de la session du commerce"
            style={{
              display: "flex",
              alignItems: "center",
              gap: 4,
              background: T.btnRed?.bg || "rgba(239,68,68,0.12)",
              border: `1.5px solid ${T.red || "#ef4444"}44`,
              borderRadius: 8,
              padding: "5px 9px",
              fontSize: 11,
              fontWeight: 700,
              color: T.red || "#ef4444",
              cursor: "pointer",
              transition: "all 0.15s ease",
              whiteSpace: "nowrap"
            }}
          >
            <span style={{ fontSize: 13 }}>🚪</span>
            <span>Déconnexion</span>
          </button>
        </div>
      </header>

      {/* ── BANNIÈRE STATUT CLOUD / LOCAL (DEMANDE UTILISATEUR) ── */}
      <OfflineSyncBanner cloudEnabled={cloudEnabled} isOnline={syncState.online} />

      {/* ── BANNIÈRE ABONNEMENT ── */}
      <SubscriptionBanner T={T} shopId={shopId} />

      {/* ── CONTENU PRINCIPAL SELON TAB ── */}
      <main style={{ flex:1, overflowY:"auto", padding:12, paddingBottom:84 }}>
        {tab === "rapide" && (
          <VenteRapide T={T} addSale={addSale} flashMsg={flashMsg} />
        )}

        {tab === "catalogue" && (
          <div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
              <div style={{ fontSize:15, fontWeight:800 }}>📦 Catalogue ({filteredProducts.length})</div>
              <button onClick={()=>setShowAddProd(true)} style={{ background:T.accent, border:"none", borderRadius:10, padding:"7px 14px", fontWeight:700, color:T.bg, fontSize:12 }}>
                + Produit
              </button>
            </div>

            <input
              placeholder="🔍 Rechercher un produit..."
              value={searchProd}
              onChange={e=>setSearchProd(e.target.value)}
              style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, color:T.text, marginBottom:8 }}
            />

            <div style={{ display:"flex", gap:4, overflowX:"auto", paddingBottom:6, marginBottom:10 }}>
              {categories.map(c => (
                <button key={c} onClick={()=>setCatFilter(c)}
                  style={{ flex:"0 0 auto", background:catFilter===c?T.accent:T.surface, border:`1px solid ${catFilter===c?T.accent:T.border}`, borderRadius:8, padding:"5px 10px", fontSize:11, fontWeight:600, color:catFilter===c?T.bg:T.text }}>
                  {c === "all" ? "Tous" : c}
                </button>
              ))}
            </div>

            {showAddProd && (
              <div style={{ background:T.surface, borderRadius:16, padding:14, marginBottom:12, border:`1px solid ${T.accent}44` }}>
                <div style={{ fontSize:13, fontWeight:700, marginBottom:8, color:T.accent }}>Nouveau produit</div>
                <input placeholder="Nom du produit *" value={newPName} onChange={e=>setNewPName(e.target.value)}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:8, color:T.text, marginBottom:6 }} />
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, marginBottom:6 }}>
                  <input placeholder="Prix de vente (F) *" value={newPPrice} onChange={e=>setNewPPrice(e.target.value.replace(/\D/g,""))}
                    style={{ background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:8, color:T.text }} />
                  <input placeholder="Stock initial (vide = illimité)" value={newPStock} onChange={e=>setNewPStock(e.target.value.replace(/\D/g,""))}
                    style={{ background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:8, color:T.text }} />
                </div>
                <input placeholder="Catégorie (ex: Boissons, Épicerie...)" value={newPCat} onChange={e=>setNewPCat(e.target.value)}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:8, color:T.text, marginBottom:10 }} />
                <div style={{ display:"flex", gap:6 }}>
                  <button onClick={()=>setShowAddProd(false)} style={{ flex:1, background:T.surface2, border:"none", borderRadius:10, padding:9 }}>Annuler</button>
                  <button onClick={handleCreateProduct} style={{ flex:1, background:T.accent, border:"none", borderRadius:10, padding:9, fontWeight:700, color:T.bg }}>Enregistrer</button>
                </div>
              </div>
            )}

            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(140px, 1fr))", gap:8 }}>
              {filteredProducts.map(p => (
                <div key={p.id} onClick={()=>addToCart(p)}
                  style={{ background:T.surface, borderRadius:12, padding:10, display:"flex", flexDirection:"column", justifyContent:"space-between", minHeight:85, cursor:"pointer", border:`1px solid ${T.border}` }}>
                  <div>
                    <div style={{ fontWeight:700, fontSize:12, marginBottom:2 }}>{p.name}</div>
                    <div style={{ fontSize:9, color:T.textMute }}>{p.category || "Général"}</div>
                  </div>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", marginTop:6 }}>
                    <span style={{ fontWeight:800, color:T.accent, fontSize:12 }}>{fmtPrice(p.price)}</span>
                    <span style={{ fontSize:9, color:p.stock===0?T.red:(p.stock>0&&p.stock<=5?T.orange:T.textMute) }}>
                      {p.stock === -1 || p.stock === undefined ? "∞" : `${p.stock} dispo`}
                    </span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab === "panier" && (
          <div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
              <div style={{ fontSize:15, fontWeight:800 }}>🛒 Panier ({cartCount} article{cartCount>1?"s":""})</div>
              {cart.length > 0 && (
                <button onClick={clearCart} style={{ background:T.btnRed.bg, border:"none", borderRadius:8, padding:"5px 10px", fontSize:11, color:T.red }}>
                  Vider
                </button>
              )}
            </div>

            {cart.length === 0 ? (
              <div style={{ textAlign:"center", padding:"40px 0", color:T.textMute }}>
                <div style={{ fontSize:36, marginBottom:8 }}>🛒</div>
                <div>Le panier est vide</div>
                <button onClick={()=>setTab("catalogue")} style={{ marginTop:12, background:T.accent, border:"none", borderRadius:10, padding:"8px 16px", fontWeight:700, color:T.bg, fontSize:12 }}>
                  Aller au catalogue
                </button>
              </div>
            ) : (
              <div>
                <div style={{ marginBottom:14 }}>
                  {cart.map(c => (
                    <div key={c.id} style={{ background:T.surface, borderRadius:12, padding:12, marginBottom:6, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                      <div>
                        <div style={{ fontWeight:700, fontSize:13 }}>{c.name || c.label}</div>
                        <div style={{ fontSize:11, color:T.accent, fontWeight:600 }}>{fmtPrice(c.price || c.amount)} / u</div>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                        <button onClick={()=>updateCartQty(c.id, -1)} style={{ width:28, height:28, borderRadius:8, background:T.surface2, border:"none", color:T.text, fontWeight:800 }}>-</button>
                        <span style={{ fontWeight:800, fontSize:14, minWidth:20, textAlign:"center" }}>{c.qty}</span>
                        <button onClick={()=>updateCartQty(c.id, 1)} style={{ width:28, height:28, borderRadius:8, background:T.surface2, border:"none", color:T.text, fontWeight:800 }}>+</button>
                        <span style={{ fontWeight:800, color:T.green, minWidth:60, textAlign:"right" }}>{fmtPrice((c.price||c.amount)*c.qty)}</span>
                      </div>
                    </div>
                  ))}
                </div>

                <div style={{ background:T.btnGreen.bg, borderRadius:14, padding:14, marginBottom:14, display:"flex", justifyContent:"space-between", alignItems:"center", border:`1px solid ${T.green}` }}>
                  <span style={{ fontWeight:800, fontSize:14 }}>TOTAL PANIER</span>
                  <span style={{ fontWeight:900, fontSize:22, color:T.green }}>{fmtPrice(cartTotal)}</span>
                </div>

                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
                  <button onClick={()=>validateCart(false)} style={{ background:T.btnBlue.bg, border:`1px solid ${T.blue}44`, borderRadius:12, padding:14, fontWeight:700, color:T.blue }}>
                    ✅ Sans ticket
                  </button>
                  <button onClick={()=>validateCart(true)} style={{ background:T.btnGreen.bg, border:`2px solid ${T.green}`, borderRadius:12, padding:14, fontWeight:800, color:T.green }}>
                    🖨️ Imprimer ticket
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {tab === "ventes" && (
          <div>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
              <div style={{ fontSize:15, fontWeight:800 }}>📜 Historique des ventes</div>
              <div style={{ fontSize:11, color:T.textMute }}>{sales.filter(s=>!s.cancelled).length} vente(s)</div>
            </div>

            {sales.length === 0 ? (
              <div style={{ textAlign:"center", padding:"30px 0", color:T.textMute }}>Aucune vente enregistrée</div>
            ) : (
              sales.slice(0, 40).map(s => (
                <div key={s.id} style={{ background:T.surface, borderRadius:12, padding:12, marginBottom:8, borderLeft:`4px solid ${s.cancelled?T.red:T.green}`, opacity:s.cancelled?0.6:1 }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                    <div>
                      <div style={{ fontWeight:700, fontSize:12 }}>
                        {s.date} · {s.timestamp ? new Date(s.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : ""}
                      </div>
                      <div style={{ fontSize:10, color:T.textMute }}>
                        {(s.items||[]).length} art. {s.caissier ? `· ${s.caissier}` : ""}
                      </div>
                    </div>
                    <div style={{ textAlign:"right" }}>
                      <div style={{ fontWeight:800, fontSize:14, color:s.cancelled?T.red:T.accent }}>
                        {s.cancelled ? "❌ " : ""}{fmtPrice(s.total)}
                      </div>
                    </div>
                  </div>

                  <div style={{ marginTop:6, fontSize:10, color:T.textMute }}>
