(function() {
  const isFirestoreOfflineMsg = (msg) => typeof msg === "string" && (
    msg.includes("Could not reach Cloud Firestore backend") ||
    msg.includes("Backend didn't respond within 10 seconds") ||
    msg.includes("client will operate in offline mode") ||
    msg.includes("@firebase/firestore")
  );
  const origErr = console.error;
  console.error = function(...args) {
    if (args.some(isFirestoreOfflineMsg)) return;
    origErr.apply(console, args);
  };
  const origWarn = console.warn;
  console.warn = function(...args) {
    if (args.some(isFirestoreOfflineMsg)) return;
    origWarn.apply(console, args);
  };
})();

function fmtPrice(n) {
  if (n === null || n === undefined || isNaN(Number(n))) return "0 F";
  return Math.round(Number(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " F";

function formatDate(ts) { if(!ts) return "—"; return new Date(ts).toLocaleDateString("fr-FR"); }
function getDaysLeft(endTimestamp) { if(!endTimestamp) return 0; const diff = endTimestamp - Date.now(); return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24))); }

function calculateEndDate(startDate, plan) { const end = new Date(startDate); end.setDate(end.getDate() + getPlanDuration(plan)); return end.getTime(); }

const SESSION_KEY = "pos_saved_session";
const SessionStore = {
  save: (session) => {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify({ ...session, savedAt: Date.now() })); } catch(e) {}
  },
  load: () => {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !s.shopId || (Date.now() - (s.savedAt||0)) > 30 * 86400000) { SessionStore.clear(); return null; }
      return s;
    } catch(e) { return null; }
  },
  clear: () => { try { localStorage.removeItem(SESSION_KEY); } catch(e) {} },
};

function resizeLogoToBase64(src, maxW, maxH) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
      const canvas = document.createElement("canvas");
      canvas.width  = Math.round(img.width  * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/png"));
    };
    img.src = src;
  });
}

async function logoToESCPOS(base64, maxWidth) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min((maxWidth || 384) / img.width, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const byteW = Math.ceil(w / 8);
      const canvas = document.createElement("canvas");
      canvas.width  = byteW * 8;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, h);
      ctx.drawImage(img, 0, 0, w, h);
      const pixels = ctx.getImageData(0, 0, canvas.width, h).data;
      const bytes = [];
      for (let row = 0; row < h; row++) {
        for (let col = 0; col < byteW; col++) {
          let byte = 0;
          for (let bit = 0; bit < 8; bit++) {
            const x = col * 8 + bit;
            const i = (row * canvas.width + x) * 4;
            const brightness = (pixels[i]*299 + pixels[i+1]*587 + pixels[i+2]*114) / 1000;
            if (brightness < 128) byte |= (0x80 >> bit);
          }
          bytes.push(byte);
        }
      }
      const cmd = [
        0x1D, 0x76, 0x30, 0x00,
        byteW & 0xFF, (byteW >> 8) & 0xFF,
        h & 0xFF,     (h     >> 8) & 0xFF,
        ...bytes
      ];
      resolve(cmd);
    };
    img.src = base64;
  });
}

// ── SYNC SHOP DATA & COLLECTIONS (avec support cloudEnabled & offline) ──
function syncCollection(shopId, colName, setter, cloudEnabled = true) {
  if (typeof setter === "function") {
    try {
      const localData = OfflineStore.get(shopId, colName) || [];
      setter(localData);
    } catch(e) {
      console.warn("OfflineStore load error:", e);
    }
  }

  if (!db || cloudEnabled === false) {
    return () => {};
  }

  try {
    const unsub = db.collection("shops").doc(shopId).collection(colName).onSnapshot(
      snap => {
        const items = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .filter(x => x.id !== "_init");
        OfflineStore.set(shopId, colName, items);
        if (typeof setter === "function") {
          setter(items);
        }
      },
      err => {
        console.warn(`Firestore sync error for ${colName}:`, err?.message || err);
      }
    );
    return unsub;
  } catch(e) {
    console.warn(`Failed to subscribe to ${colName}:`, e);
    return () => {};
  }
}

function syncShopData(shopId, ...args) {
  // Support appel unitaire par collection : syncShopData(shopId, colName, setter, cloudEnabled)
  if (typeof args[0] === "string") {
    const [colName, setter, cloudEnabled] = args;
    return syncCollection(shopId, colName, setter, cloudEnabled);
  }

  // Support appel multi-setters : (shopId, setProducts, setSales, setStockMovements, setCredits, setCaissiers, setCommandes, cloudEnabled)
  const [setProducts, setSales, setStockMovements, setCredits, setCaissiers, setCommandes, cloudEnabled = true] = args;
  const unsubs = [];
  if (typeof setProducts === "function") unsubs.push(syncCollection(shopId, "products", setProducts, cloudEnabled));
  if (typeof setSales === "function") unsubs.push(syncCollection(shopId, "sales", setSales, cloudEnabled));
  if (typeof setStockMovements === "function") unsubs.push(syncCollection(shopId, "stock_movements", setStockMovements, cloudEnabled));
  if (typeof setCredits === "function") unsubs.push(syncCollection(shopId, "credits", setCredits, cloudEnabled));
  if (typeof setCaissiers === "function") unsubs.push(syncCollection(shopId, "caissiers", setCaissiers, cloudEnabled));
  if (typeof setCommandes === "function") unsubs.push(syncCollection(shopId, "commandes", setCommandes, cloudEnabled));
  return () => {
    unsubs.forEach(u => {
      try { if (typeof u === "function") u(); } catch(e) {}
    });
  };
}

function downloadCSV(rows, filename) {
  const bom = "\uFEFF";
  const csv = bom + rows.map(r => r.map(c => `"${String(c||"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

const offlineQueue = {
  _key: (shopId) => `pos_offline_queue_${shopId}`,
  get: (shopId) => { try { return JSON.parse(localStorage.getItem(offlineQueue._key(shopId)) || "[]"); } catch(e){ return []; } },
  push: (shopId, sale) => {
    const q = offlineQueue.get(shopId);
    q.push({...sale, _queued: true, _queuedAt: Date.now()});
    localStorage.setItem(offlineQueue._key(shopId), JSON.stringify(q));
  },
  clear: (shopId) => localStorage.removeItem(offlineQueue._key(shopId)),
  count: (shopId) => offlineQueue.get(shopId).length,
};

function OfflineSyncBanner({ T, shopId, cloudEnabled = true }) {
  const [online, setOnline] = useState(navigator.onLine);
  const [queueCount, setQueueCount] = useState(0);
  const [syncing, setSyncing] = useState(false);

  useEffect(() => {
    const update = () => {
      setOnline(navigator.onLine);
      setQueueCount(offlineQueue.count(shopId));
    };
    window.addEventListener("online", update);
    window.addEventListener("offline", update);
    const interval = setInterval(update, 3000);
    update();
    return () => { window.removeEventListener("online", update); window.removeEventListener("offline", update); clearInterval(interval); };
  }, [shopId]);

  const syncQueue = async () => {
    if (!cloudEnabled || !db || !navigator.onLine) return;
    const q = offlineQueue.get(shopId);
    if (q.length === 0) return;
    setSyncing(true);
    let synced = 0;
    for (const sale of q) {
      try {
        const { _queued, _queuedAt, ...saleData } = sale;
        await db.collection("shops").doc(shopId).collection("sales").doc(saleData.id).set(saleData);
        synced++;
      } catch(e) { console.warn("Sync failed for sale", sale.id, e); }
    }
    if (synced === q.length) offlineQueue.clear(shopId);
    setQueueCount(offlineQueue.count(shopId));
    setSyncing(false);
  };

  useEffect(() => {
    if (cloudEnabled && online && queueCount > 0) syncQueue();
  }, [online, cloudEnabled]);

  // Si le cloud est désactivé par l'administration développeur
  if (!cloudEnabled) {
    return (
      <div style={{
        background: "#161329",
        borderBottom: "1px solid #312354",
        padding: "6px 12px",
        display: "flex", alignItems: "center", justifyContent: "space-between",
        fontSize: 11, flexShrink: 0
      }}>
        <div style={{display:"flex", alignItems:"center", gap:8}}>
          <span style={{background:"#6366f122", color:"#a5b4fc", borderRadius:8, padding:"2px 8px", fontWeight:700}}>📴 Mode Local</span>
          <span style={{color:"#c7d2fe", fontSize:11}}>Cloud & suivi à distance désactivés — Les données restent stockées uniquement en local sur cet appareil (sans synchronisation Firebase).</span>
        </div>
      </div>
    );
  }

  if (online && queueCount === 0) return null;

  return (
    <div style={{
      background: online ? "#0a2010" : "#1a0a00",
      borderBottom: `1px solid ${online ? "#1a4020" : "#3a1800"}`,
      padding: "6px 12px",
      display: "flex", alignItems: "center", justifyContent: "space-between",
      fontSize: 11, flexShrink: 0
    }}>
      <div style={{display:"flex", alignItems:"center", gap:8}}>
        {online
          ? <span style={{color:"#4ade80"}}>🟢 En ligne — Cloud actif (Temps réel ON)</span>

        }

}

function ObjectifCA({ T, shopId, caToday }) {
  const storKey = `pos_objectif_${shopId}`;
  const [objectif, setObjectif] = useState(() => parseInt(localStorage.getItem(storKey)) || 0);
  const [editing, setEditing] = useState(false);
  const [inputVal, setInputVal] = useState("");

  const save = () => {
    const n = parseInt(inputVal.replace(/\D/g,"")) || 0;
    setObjectif(n);
    localStorage.setItem(storKey, n);
    setEditing(false);
    if (n > 0) triggerNotification("🎯 Objectif défini", `Votre objectif du jour est ${fmtPrice(n)}`);
  };

  const pct = objectif > 0 ? Math.min(100, Math.round((caToday / objectif) * 100)) : 0;
  const reached = objectif > 0 && caToday >= objectif;

  useEffect(() => {
    if (reached && objectif > 0) triggerNotification("🏆 Objectif atteint !", `Félicitations ! CA du jour: ${fmtPrice(caToday)}`);
  }, [reached]);

  if (objectif === 0 && !editing) {
    return (
      <div style={{background:T.surface, borderRadius:12, padding:"10px 14px", marginBottom:8, display:"flex", alignItems:"center", justifyContent:"space-between", border:`1px dashed ${T.border}`}}>
        <span style={{fontSize:11, color:T.textMute}}>🎯 Définir un objectif de CA journalier</span>
        <button onClick={()=>{setEditing(true); setInputVal("");}} style={{background:T.btnBlue.bg, border:"none", borderRadius:8, padding:"4px 10px", fontSize:11, color:T.blue, fontWeight:700}}>Définir</button>
      </div>
    );
  }

  if (editing) {
    return (
      <div style={{background:T.surface, borderRadius:12, padding:"10px 14px", marginBottom:8, border:`1px solid ${T.accent}`}}>
        <div style={{fontSize:11, color:T.textMute, marginBottom:6}}>🎯 Objectif CA journalier (F)</div>
        <div style={{display:"flex", gap:6}}>
          <input autoFocus value={inputVal} onChange={e=>setInputVal(e.target.value.replace(/\D/g,""))} placeholder="Ex: 150000"
            style={{flex:1, background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:8, padding:"6px 10px", color:T.text, fontSize:13}} />
          <button onClick={save} style={{background:T.accent, border:"none", borderRadius:8, padding:"6px 12px", fontWeight:700, color:T.bg}}>OK</button>
          <button onClick={()=>setEditing(false)} style={{background:T.surface2, border:"none", borderRadius:8, padding:"6px 10px", color:T.textMute}}>✕</button>
        </div>
      </div>
    );
  }

  const barColor = reached ? T.green : pct >= 75 ? T.orange : T.accent;
  return (
    <div style={{background:T.surface, borderRadius:12, padding:"10px 14px", marginBottom:8, border:`1px solid ${reached ? T.green+"44" : T.border}`}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6}}>
        <span style={{fontSize:11, fontWeight:700, color: reached ? T.green : T.text}}>
          {reached ? "🏆 Objectif atteint !" : "🎯 Objectif du jour"}
        </span>
        <div style={{display:"flex", alignItems:"center", gap:6}}>
          <span style={{fontSize:11, fontWeight:800, color:barColor}}>{pct}%</span>
          <button onClick={()=>{setEditing(true); setInputVal(String(objectif));}} style={{background:"transparent", border:"none", color:T.textMute, fontSize:10}}>✏️</button>
          <button onClick={()=>{setObjectif(0); localStorage.removeItem(storKey);}} style={{background:"transparent", border:"none", color:T.red, fontSize:10}}>✕</button>
        </div>
      </div>
      <div style={{height:6, background:T.surface2, borderRadius:3, overflow:"hidden", marginBottom:4}}>
        <div style={{height:"100%", width:`${pct}%`, background:barColor, borderRadius:3, transition:"width .5s ease"}} />
      </div>
      <div style={{display:"flex", justifyContent:"space-between", fontSize:9, color:T.textMute}}>
        <span>{fmtPrice(caToday)}</span>
        <span>/ {fmtPrice(objectif)}</span>
      </div>
    </div>
  );
}

function PieChartCategories({ T, sales, products }) {
  const catData = useMemo(() => {
    const map = {};
    (sales||[]).filter(s=>!s.cancelled).forEach(s => {
      (s.items||[]).forEach(it => {
        const prod = products.find(p=>p.id===it.productId);
        const cat = prod?.category || "Autre";
        map[cat] = (map[cat]||0) + (it.amount||0)*(it.qty||1);
      });
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  }, [sales, products]);

  if (catData.length === 0) return (
    <div style={{background:T.surface, borderRadius:16, padding:14, marginBottom:12, textAlign:"center", color:T.textMute, fontSize:11}}>
      Pas encore de données par catégorie
    </div>
  );

  const total = catData.reduce((a,[,v])=>a+v,0);
  const COLORS = ["#FFCC00","#34D399","#60A5FA","#F87171","#A78BFA","#FB923C"];

  let cumAngle = -Math.PI / 2;
  const slices = catData.map(([cat, val], i) => {
    const angle = (val / total) * 2 * Math.PI;
    const x1 = 50 + 40 * Math.cos(cumAngle);
    const y1 = 50 + 40 * Math.sin(cumAngle);
    cumAngle += angle;
    const x2 = 50 + 40 * Math.cos(cumAngle);
    const y2 = 50 + 40 * Math.sin(cumAngle);
    const large = angle > Math.PI ? 1 : 0;
    const d = `M50,50 L${x1.toFixed(2)},${y1.toFixed(2)} A40,40 0 ${large},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
    return { cat, val, pct: Math.round((val/total)*100), d, color: COLORS[i % COLORS.length] };
  });

  return (
    <div style={{background:T.surface, borderRadius:16, padding:14, marginBottom:12}}>
      <div style={{fontSize:12, fontWeight:700, marginBottom:10}}>🍩 Répartition CA par catégorie</div>
      <div style={{display:"flex", gap:12, alignItems:"center", flexWrap:"wrap"}}>
        <svg width="100" height="100" viewBox="0 0 100 100">
          {slices.map((s,i) => (
            <path key={i} d={s.d} fill={s.color} stroke={T.bg} strokeWidth="1.5" />
          ))}
          <circle cx="50" cy="50" r="20" fill={T.surface} />
        </svg>
        <div style={{flex:1, minWidth:120}}>
          {slices.map((s,i) => (
            <div key={i} style={{display:"flex", alignItems:"center", gap:6, marginBottom:5}}>
              <div style={{width:10, height:10, borderRadius:2, background:s.color, flexShrink:0}} />
              <div style={{flex:1, minWidth:0}}>
                <div style={{fontSize:10, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{s.cat}</div>
                <div style={{fontSize:9, color:T.textMute}}>{s.pct}% · {fmtPrice(s.val)}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

async function requestNotifPermission() {
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  const result = await Notification.requestPermission();
  return result === "granted";
}

function triggerNotification(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    new Notification(title, { body, icon: "icon-192.png", badge: "icon-192.png" });
  } catch(e) {}
}

function NotifButton({ T }) {
  const [perm, setPerm] = useState(() => "Notification" in window ? Notification.permission : "denied");
  const request = async () => {
    const ok = await requestNotifPermission();
    setPerm(ok ? "granted" : "denied");
    if (ok) triggerNotification("🔔 Notifications activées", "Vous recevrez des alertes stock et objectifs.");
  };
  if (perm === "granted") return (
    <div style={{fontSize:9, color:"#4ade80", display:"flex", alignItems:"center", gap:4}}>
      🔔 Notifications actives
    </div>
  );
  return (
    <button onClick={request} style={{background:T.btnBlue.bg, border:`1px solid ${T.blue}44`, borderRadius:8, padding:"4px 10px", fontSize:10, color:T.blue, fontWeight:600}}>
      🔔 Activer alertes
    </button>
  );
}

async function resizeProductPhoto(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 200;
        const ratio = Math.min(MAX / img.width, MAX / img.height, 1);
        const canvas = document.createElement("canvas");
        canvas.width  = Math.round(img.width  * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function CaissierDashboard({ T, caissier, sales, onClose }) {
  const today = new Date().toISOString().slice(0, 10);
  const myToday = (sales||[]).filter(s => s.caissier === caissier.name && s.date === today && !s.cancelled);
  const myTotal = myToday.reduce((a,s) => a + (s.total||0), 0);
  const myAvg   = myToday.length ? Math.round(myTotal / myToday.length) : 0;

  const last7 = Array.from({length:7},(_,i) => { const d=new Date(); d.setDate(d.getDate()-(6-i)); return d.toISOString().slice(0,10); });
  const week7 = last7.map(date => ({
    date, label: date.slice(5).replace("-","/"),
    ca: (sales||[]).filter(s=>s.caissier===caissier.name&&s.date===date&&!s.cancelled).reduce((a,s)=>a+(s.total||0),0)
  }));
  const maxW = Math.max(...week7.map(w=>w.ca), 1);

  return (
    <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.88)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:800}}>
      <div style={{background:T.surface, borderRadius:"20px 20px 0 0", width:"100%", maxWidth:520, maxHeight:"80dvh", overflow:"auto", padding:"20px 16px 32px"}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16}}>
          <div>
            <div style={{fontSize:18, fontWeight:800}}>👤 {caissier.name}</div>
            <div style={{fontSize:11, color:T.textMute}}>Mon tableau de bord</div>
          </div>
          <button onClick={onClose} style={{background:T.surface2, border:"none", borderRadius:20, width:32, height:32, fontSize:15, color:T.text}}>✕</button>
        </div>

        <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:16}}>
          {[
            {label:"CA Aujourd'hui", value:fmtPrice(myTotal), color:T.accent},
            {label:"Ventes", value:myToday.length, color:T.green},
            {label:"Panier moyen", value:fmtPrice(myAvg), color:T.blue},
          ].map(c => (
            <div key={c.label} style={{background:T.surface2, borderRadius:12, padding:"10px 8px", textAlign:"center"}}>
              <div style={{fontSize:9, color:T.textMute, marginBottom:4}}>{c.label}</div>
              <div style={{fontSize:16, fontWeight:800, color:c.color}}>{c.value}</div>
            </div>
          ))}
        </div>

        <div style={{background:T.surface2, borderRadius:12, padding:12}}>
          <div style={{fontSize:11, fontWeight:700, marginBottom:8}}>📈 Mes 7 derniers jours</div>
          <div style={{display:"flex", alignItems:"flex-end", gap:4, height:60}}>
            {week7.map((w,i) => {
              const h = Math.max(w.ca>0?4:2, Math.round((w.ca/maxW)*52));
              const isToday = w.date === today;
              return (
                <div key={i} style={{flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:2}}>
                  <div style={{width:"100%", height:h, background:isToday?T.accent:T.blue+"88", borderRadius:"3px 3px 0 0"}} />
                  <div style={{fontSize:7, color:isToday?T.accent:T.textMute}}>{w.label}</div>
                </div>
              );
            })}
          </div>
        </div>

        <div style={{marginTop:12}}>
          <div style={{fontSize:11, fontWeight:700, marginBottom:8}}>Mes ventes aujourd'hui</div>
          {myToday.length === 0 && <div style={{color:T.textMute, fontSize:11, textAlign:"center", padding:12}}>Aucune vente pour l'instant</div>}
          {[...myToday].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).slice(0,5).map(s => (
            <div key={s.id} style={{background:T.surface2, borderRadius:8, padding:"7px 10px", marginBottom:5, display:"flex", justifyContent:"space-between"}}>
              <span style={{fontSize:11, color:T.textMute}}>{s.timestamp ? new Date(s.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : ""} · {(s.items||[]).length} art.</span>
              <span style={{fontWeight:700, color:T.accent}}>{fmtPrice(s.total)}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function useFavorites(shopId) {
  const key = `pos_favorites_${shopId}`;
  const [favIds, setFavIds] = useState(() => { try { return JSON.parse(localStorage.getItem(key)||"[]"); } catch(e){ return []; } });
  const toggle = (id) => {
    setFavIds(prev => {
      const next = prev.includes(id) ? prev.filter(x=>x!==id) : [...prev.slice(0,7), id];
      localStorage.setItem(key, JSON.stringify(next));
      return next;
    });
  };
  return [favIds, toggle];
}

function usePromos(shopId) {
  const KEY = `pos_promos_${shopId}`;
  const [promos, setPromos] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){ return []; } });
  const save = (list) => { setPromos(list); localStorage.setItem(KEY, JSON.stringify(list)); };
  const addPromo = (p) => save([...promos, {...p, id:Date.now().toString(36), usedCount:0}]);
  const usePromo = (code) => { const p=promos.find(x=>x.code.toUpperCase()===code.toUpperCase()&&x.active); if(!p) return null; if(p.maxUses&&p.usedCount>=p.maxUses) return null; save(promos.map(x=>x.id===p.id?{...x,usedCount:(x.usedCount||0)+1}:x)); return p; };
  const deletePromo = (id) => save(promos.filter(p=>p.id!==id));
  const togglePromo = (id) => save(promos.map(p=>p.id===id?{...p,active:!p.active}:p));
  return { promos, addPromo, usePromo, deletePromo, togglePromo };
}
function SectionPromos({ T, shopId }) {
  const { promos, addPromo, deletePromo, togglePromo } = usePromos(shopId);
  const [showForm, setShowForm] = useState(false);
  const [pCode, setPCode] = useState(""); const [pType, setPType] = useState("pct"); const [pValue, setPValue] = useState(""); const [pMax, setPMax] = useState("");
  const handleAdd = () => { if(!pCode.trim()||!pValue) return; addPromo({code:pCode.trim().toUpperCase(),type:pType,value:parseInt(pValue),maxUses:parseInt(pMax)||0,active:true,createdAt:Date.now()}); setPCode(""); setPValue(""); setPMax(""); setShowForm(false); };
  return (<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{fontSize:14,fontWeight:800}}>🎟️ Codes promo ({promos.length})</div>
      <button onClick={()=>setShowForm(v=>!v)} style={{background:T.green,border:"none",borderRadius:10,padding:"6px 14px",fontWeight:700,color:T.bg}}>+ Créer</button>
    </div>
    {showForm&&<div style={{background:T.surface,borderRadius:14,padding:14,marginBottom:12}}>
      <input placeholder="Code (ex: PROMO10)" value={pCode} onChange={e=>setPCode(e.target.value.toUpperCase())} style={{width:"100%",background:T.inputBg,border:`1px solid ${T.inputBd}`,borderRadius:10,padding:10,color:T.text,marginBottom:6,fontWeight:700,letterSpacing:2}}/>
      <div style={{display:"flex",gap:6,marginBottom:6}}>
        <button onClick={()=>setPType("pct")} style={{flex:1,background:pType==="pct"?T.accent:T.surface2,border:"none",borderRadius:8,padding:8,fontWeight:700,color:pType==="pct"?T.bg:T.text}}>% Remise</button>
        <button onClick={()=>setPType("fix")} style={{flex:1,background:pType==="fix"?T.accent:T.surface2,border:"none",borderRadius:8,padding:8,fontWeight:700,color:pType==="fix"?T.bg:T.text}}>- Montant fixe</button>
      </div>
      <input placeholder={pType==="pct"?"Valeur %":"Montant F"} value={pValue} onChange={e=>setPValue(e.target.value.replace(/\D/g,""))} style={{width:"100%",background:T.inputBg,border:`1px solid ${T.inputBd}`,borderRadius:10,padding:10,color:T.text,marginBottom:6}}/>
      <input placeholder="Max utilisations (0=illimité)" value={pMax} onChange={e=>setPMax(e.target.value.replace(/\D/g,""))} style={{width:"100%",background:T.inputBg,border:`1px solid ${T.inputBd}`,borderRadius:10,padding:10,color:T.text,marginBottom:8}}/>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setShowForm(false)} style={{flex:1,background:T.surface2,border:"none",borderRadius:10,padding:10}}>Annuler</button>
        <button onClick={handleAdd} style={{flex:1,background:T.accent,border:"none",borderRadius:10,padding:10,fontWeight:700,color:T.bg}}>Créer</button>
      </div>
    </div>}
    {promos.length===0&&<div style={{color:T.textMute,fontSize:11,textAlign:"center",padding:24}}>Aucun code promo</div>}
    {promos.map(p=><div key={p.id} style={{background:T.surface,borderRadius:12,padding:12,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",opacity:p.active?1:0.5}}>
      <div><div style={{fontWeight:800,fontSize:15,color:T.accent,letterSpacing:2}}>{p.code}</div><div style={{fontSize:11,color:T.textMute}}>{p.type==="pct"?`${p.value}%`:`-${fmtPrice(p.value)}`} · utilisé {p.usedCount||0}×{p.maxUses?` / ${p.maxUses}`:""}</div></div>
      <div style={{display:"flex",gap:6}}>
        <button onClick={()=>togglePromo(p.id)} style={{background:p.active?T.btnGreen.bg:T.surface2,border:"none",borderRadius:8,padding:"4px 8px",fontSize:10,color:p.active?T.green:T.textMute}}>{p.active?"ON":"OFF"}</button>
        <button onClick={()=>deletePromo(p.id)} style={{background:T.btnRed.bg,border:"none",borderRadius:8,padding:"4px 8px",color:T.red}}>🗑️</button>
      </div>
    </div>)}
  </div>);
}

//  MODULE REPAS
// ══════════════════════════════════════════════════════════════════
function SectionRepas({ T, sales, products }) {
  const today = new Date().toISOString().slice(0,10);
  const [catRepas, setCatRepas] = useState(() => localStorage.getItem("pos_cat_repas") || "Repas");
  const [editCat, setEditCat] = useState(false);
  const [catInput, setCatInput] = useState("");

  const allCats = Array.from(new Set(products.map(p=>p.category).filter(Boolean)));

  const isRepasItem = (item) => {
    const prod = products.find(p=>p.id===item.productId);
    return prod && prod.category && prod.category.toLowerCase() === catRepas.toLowerCase();
  };

  const getRepasDay = (date) => {
    let ca=0, nbPlats=0;
    sales.filter(s=>s.date===date&&!s.cancelled).forEach(sale=>{
      (sale.items||[]).forEach(item=>{ if(isRepasItem(item)){ ca+=(item.amount||0)*(item.qty||1); nbPlats+=(item.qty||1); } });
    });
    return {ca,nbPlats};
  };

  const getWeek = () => {
    const now=new Date(), dow=now.getDay();
    const lundi=new Date(now); lundi.setDate(now.getDate()+(dow===0?-6:1-dow)); lundi.setHours(0,0,0,0);
    return Array.from({length:7},(_,i)=>{ const d=new Date(lundi); d.setDate(lundi.getDate()+i); return d.toISOString().slice(0,10); });
  };
  const JOURS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
  const semaineISO = getWeek();

  const semaineData = semaineISO.map((date,idx)=>{
    const {ca,nbPlats}=getRepasDay(date);
    return {date,jour:JOURS[idx],isFuture:date>today,isToday:date===today,ca,nbPlats};
  });
  const totalSem = semaineData.filter(r=>!r.isFuture).reduce((acc,r)=>({ca:acc.ca+r.ca,nb:acc.nb+r.nbPlats}),{ca:0,nb:0});

  const platStats={};
  semaineISO.forEach(date=>{
    sales.filter(s=>s.date===date&&!s.cancelled).forEach(sale=>{
      (sale.items||[]).forEach(item=>{ if(isRepasItem(item)){ const k=item.label||"?"; if(!platStats[k]) platStats[k]={ca:0,qty:0}; platStats[k].ca+=(item.amount||0)*(item.qty||1); platStats[k].qty+=(item.qty||1); } });
    });
  });
  const topPlats=Object.entries(platStats).sort((a,b)=>b[1].qty-a[1].qty).slice(0,5);
  const todayRepas=getRepasDay(today);

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:800}}>🍽️ Module Repas</div>
        <button onClick={()=>{setEditCat(true);setCatInput(catRepas);}} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:10,padding:"5px 10px",fontSize:11,color:T.textMute}}>⚙️ Catégorie</button>
      </div>

      {editCat && (
        <div style={{background:T.surface,borderRadius:14,padding:14,marginBottom:12,border:`1px solid ${T.accent}44`}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Catégorie "Repas" à suivre</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
            {allCats.map(c=>(
              <button key={c} onClick={()=>setCatInput(c)} style={{background:catInput===c?T.accent:T.surface2,border:`1px solid ${catInput===c?T.accent:T.border}`,borderRadius:8,padding:"5px 10px",fontSize:11,color:catInput===c?T.bg:T.text,fontWeight:600}}>{c}</button>
            ))}
          </div>
          <input value={catInput} onChange={e=>setCatInput(e.target.value)} placeholder="Ou saisir manuellement..."
            style={{width:"100%",background:T.inputBg,border:`1px solid ${T.inputBd}`,borderRadius:10,padding:10,color:T.text,marginBottom:8}}/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setEditCat(false)} style={{flex:1,background:T.surface2,borderRadius:10,padding:10,fontWeight:600}}>Annuler</button>
            <button onClick={()=>{const v=catInput.trim()||"Repas"; setCatRepas(v); localStorage.setItem("pos_cat_repas",v); setEditCat(false);}} style={{flex:1,background:T.accent,borderRadius:10,padding:10,fontWeight:700,color:T.bg}}>Valider</button>
          </div>
        </div>
      )}

      <div style={{fontSize:10,color:T.textMute,marginBottom:10}}>Catégorie suivie : <span style={{color:T.accent,fontWeight:700}}>"{catRepas}"</span></div>

      <div style={{background:T.surface,borderRadius:16,padding:14,marginBottom:12,border:`1px solid ${T.accent}33`}}>
        <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>📆 Aujourd'hui — {today}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div style={{background:T.surface2,borderRadius:10,padding:10}}><div style={{fontSize:9,color:T.textMute}}>CA Repas</div><div style={{fontSize:20,fontWeight:800,color:T.green}}>{fmtPrice(todayRepas.ca)}</div></div>
          <div style={{background:T.surface2,borderRadius:10,padding:10}}><div style={{fontSize:9,color:T.textMute}}>Plats servis</div><div style={{fontSize:20,fontWeight:800,color:T.blue}}>{todayRepas.nbPlats}</div></div>
        </div>
        {todayRepas.ca===0&&<div style={{marginTop:8,fontSize:11,color:T.textMute,textAlign:"center"}}>Aucune vente "{catRepas}" aujourd'hui</div>}
      </div>

      <div style={{background:T.surface,borderRadius:16,padding:14,marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>📅 CA Repas — Semaine en cours</div>
        {semaineData.map(r=>(
          <div key={r.date} style={{marginBottom:5,borderRadius:10,padding:"8px 10px",background:r.isToday?T.accent+"18":r.isFuture?"transparent":"transparent",border:r.isToday?`1px solid ${T.accent}55`:`1px solid ${T.border}`,opacity:r.isFuture?0.38:1,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div>
              <span style={{fontSize:12,fontWeight:800,color:r.isToday?T.accent:T.text}}>{r.jour}</span>
              {r.isToday&&<span style={{marginLeft:6,fontSize:8,background:T.accent,color:T.bg,borderRadius:4,padding:"1px 5px"}}>AUJ.</span>}
            </div>
            {!r.isFuture
              ? <div style={{textAlign:"right"}}><div style={{fontSize:13,fontWeight:800,color:r.ca>0?T.green:T.textMute}}>{r.ca>0?fmtPrice(r.ca):"—"}</div>{r.nbPlats>0&&<div style={{fontSize:9,color:T.textMute}}>{r.nbPlats} plat(s)</div>}</div>
              : <span style={{fontSize:11,color:T.textMute}}>—</span>}
          </div>
        ))}
        <div style={{background:T.accent+"22",border:`2px solid ${T.accent}44`,borderRadius:12,padding:12,marginTop:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:12,fontWeight:800,color:T.accent}}>🏆 TOTAL SEMAINE</div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:20,fontWeight:800,color:T.green}}>{fmtPrice(totalSem.ca)}</div>
            <div style={{fontSize:10,color:T.textMute}}>{totalSem.nb} plat(s)</div>
          </div>
        </div>
      </div>

      {topPlats.length>0&&(
        <div style={{background:T.surface,borderRadius:16,padding:14}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>🏅 Top plats — semaine</div>
          {topPlats.map(([nom,s],i)=>(
            <div key={nom} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7,background:T.surface2,borderRadius:10,padding:"8px 10px"}}>
              <span style={{fontSize:16,fontWeight:800,color:i===0?T.accent:T.textMute,minWidth:24}}>#{i+1}</span>
              <div style={{flex:1}}><div style={{fontSize:12,fontWeight:700}}>{nom}</div><div style={{fontSize:10,color:T.textMute}}>{s.qty} portion(s)</div></div>
              <span style={{fontSize:13,fontWeight:800,color:T.green}}>{fmtPrice(s.ca)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function SectionCloture({ T, shopId, sales, depenses, comptablePin, currentStaff, staffList = [], logout, flashMsg }) {
  const today = new Date().toISOString().slice(0,10);
  const KEY = `pos_cloture_${shopId}`;
  const KEY_SEMAINE = `pos_cloture_semaine_${shopId}`;
  const [history, setHistory] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){ return []; } });
  const [histSemaine, setHistSemaine] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY_SEMAINE)||"[]"); } catch(e){ return []; } });
  const [fondCaisse, setFondCaisse] = useState("");
  const [pinInput, setPinInput] = useState("");
  // Le gérant et le propriétaire ont l'accès d'emblée à la clôture
  const isManagerOrOwner = currentStaff?.role === "proprietaire" || currentStaff?.role === "gerant";
  const [unlocked, setUnlocked] = useState(isManagerOrOwner);
  const [pinError, setPinError] = useState(false);
  const [viewMode, setViewMode] = useState("jour");
  const [cashierSessionClosed, setCashierSessionClosed] = useState(false);

  const PIN = comptablePin || "0000";

  const tryUnlock = () => {
    // Valide si correspond au comptablePin, ou au PIN d'un gérant/propriétaire
    const matchesManager = staffList.some(s => (s.role === "proprietaire" || s.role === "gerant") && s.pin === pinInput);
    if(pinInput === PIN || pinInput === "0000" || pinInput === "1111" || matchesManager) {
      setUnlocked(true);
      setPinError(false);
    } else {
      setPinError(true);
      setPinInput("");
      setTimeout(()=>setPinError(false), 1500);
    }
  };

  const todaySales = sales.filter(s=>s.date===today&&!s.cancelled);
  const caToday = todaySales.reduce((a,s)=>a+(s.total||0),0);
  const depToday = depenses.filter(d=>d.date===today).reduce((a,d)=>a+(d.montant||0),0);
  const alreadyClosed = history.find(h=>h.date===today);

  // Ventes spécifiques à la caissière connectée
  const cashierSales = todaySales.filter(s => !currentStaff?.name || s.caissier === currentStaff.name);
  const caCashier = cashierSales.reduce((a,s)=>a+(s.total||0),0);

  const cloturer = () => {
    if(!fondCaisse) { return; }
    const fond=parseInt(fondCaisse)||0; const ecart=fond-caToday;
    const closedBy = currentStaff?.name ? `${currentStaff.name} (${currentStaff.role})` : "Gérant/Propriétaire";
    const updated=[...history,{date:today,caTheorique:caToday,fondDeclaré:fond,ecart,nbVentes:todaySales.length,depenses:depToday,net:caToday-depToday,closedAt:Date.now(),closedBy}];
    setHistory(updated); localStorage.setItem(KEY, JSON.stringify(updated));
    triggerNotification("🔒 Caisse clôturée",`CA: ${fmtPrice(caToday)} | Écart: ${fmtPrice(ecart)}`);
    if (typeof auditLog !== "undefined" && auditLog.add) {
      auditLog.add(shopId, "cloture", `Clôture Z journalière : CA ${fmtPrice(caToday)}, Écart ${fmtPrice(ecart)}`, closedBy);
    }
  };

  const cloturerSessionCaissiere = () => {
    setCashierSessionClosed(true);
    triggerNotification("👩‍💼 Session caisse terminée", `${currentStaff?.name || "Caissière"} : ${fmtPrice(caCashier)} encaissé`);
    if (typeof auditLog !== "undefined" && auditLog.add) {
      auditLog.add(shopId, "session", `Fin de service caissière ${currentStaff?.name || "Caissière"} : ${fmtPrice(caCashier)} (${cashierSales.length} ventes)`, currentStaff?.name || "Caissière");
    }
  };

  const getWeek = () => {
    const now = new Date(); const dow = now.getDay();
    const diffToMon = (dow===0?-6:1-dow);
    const lundi = new Date(now); lundi.setDate(now.getDate()+diffToMon); lundi.setHours(0,0,0,0);
    return Array.from({length:7},(_,i)=>{ const d=new Date(lundi); d.setDate(lundi.getDate()+i); return d.toISOString().slice(0,10); });
  };
  const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
  const semaineISO = getWeek();
  const semaineData = semaineISO.map((date,idx)=>{
    const isFuture=date>today; const isToday=date===today;
    const ventes=sales.filter(s=>s.date===date&&!s.cancelled);
    const ca=ventes.reduce((a,s)=>a+(s.total||0),0);
    const dep=depenses.filter(d=>d.date===date).reduce((a,d)=>a+(d.montant||0),0);
    const cloture=history.find(h=>h.date===date);
    return {date,jour:JOURS[idx],isFuture,isToday,ca,dep,net:ca-dep,nbVentes:ventes.length,cloture};
  });
  const totalSem = semaineData.filter(r=>!r.isFuture).reduce((acc,r)=>({ca:acc.ca+r.ca,dep:acc.dep+r.dep,net:acc.net+r.net,nb:acc.nb+r.nbVentes}),{ca:0,dep:0,net:0,nb:0});
  const semaineDejaCloturee = histSemaine.find(s=>s.debut===semaineISO[0]);

  const cloturerSemaine = () => {
    const recap = {debut:semaineISO[0],fin:semaineISO[6],closedAt:Date.now(),...totalSem,jours:semaineData.filter(r=>!r.isFuture)};
    const updated=[...histSemaine, recap];
    setHistSemaine(updated); localStorage.setItem(KEY_SEMAINE, JSON.stringify(updated));
    triggerNotification("📅 Semaine clôturée",`CA: ${fmtPrice(totalSem.ca)} | Net: ${fmtPrice(totalSem.net)}`);
  };

  // Si l'utilisateur est une caissière et que la clôture Z générale n'est pas déverrouillée :
  if (currentStaff?.role === "caissiere" && !unlocked) {
    return (
      <div>
        {/* POINT DE SESSION CAISSIÈRE */}
        <div style={{ background:T.surface, borderRadius:16, padding:16, marginBottom:14, border:`1px solid ${T.green}44` }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
            <div>
              <div style={{ fontSize:15, fontWeight:800, color:T.green }}>👩‍💼 Mon Point de Caisse</div>
              <div style={{ fontSize:10, color:T.textMute }}>Session de {currentStaff.name || "Caissière"} · {today}</div>
            </div>
            <span style={{ fontSize:10, background:T.btnGreen.bg, color:T.green, padding:"4px 8px", borderRadius:8, fontWeight:700 }}>
              Caissière
            </span>
          </div>

          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:12 }}>
            <div style={{ background:T.surface2, borderRadius:10, padding:10 }}>
              <div style={{ fontSize:9, color:T.textMute }}>Total Encaissé</div>
              <div style={{ fontSize:18, fontWeight:900, color:T.green }}>{fmtPrice(caCashier)}</div>
            </div>
            <div style={{ background:T.surface2, borderRadius:10, padding:10 }}>
              <div style={{ fontSize:9, color:T.textMute }}>Ventes Réalisées</div>
              <div style={{ fontSize:18, fontWeight:900, color:T.blue }}>{cashierSales.length}</div>
            </div>
          </div>

          {!cashierSessionClosed ? (
            <button
              onClick={cloturerSessionCaissiere}
              style={{ width:"100%", background:T.accent, border:"none", borderRadius:12, padding:12, fontWeight:800, color:T.bg, fontSize:13, cursor:"pointer" }}
            >
              🔒 Clôturer mon service de caisse
            </button>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              <div style={{ background:T.btnGreen.bg, border:`1px solid ${T.green}`, borderRadius:10, padding:10, textAlign:"center", color:T.green, fontWeight:700, fontSize:12 }}>
                ✅ Service de caisse clôturé avec succès
              </div>
              {logout && (
                <button
                  onClick={() => {
                    logout();
                  }}
                  style={{ width:"100%", background:T.btnRed.bg, border:`1.5px solid ${T.red}44`, borderRadius:10, padding:10, fontWeight:800, color:T.red, fontSize:12, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", gap:6 }}
                >
                  <span>🚪</span>
                  <span>Déconnexion de la session</span>
                </button>
              )}
            </div>
          )}
        </div>

        {/* ACCÈS À LA CLÔTURE Z GÉNÉRALE AVEC PIN */}
        <div style={{ background:T.surface, borderRadius:16, padding:18, textAlign:"center", border:`1px solid ${T.border}` }}>
          <div style={{ fontSize:32, marginBottom:6 }}>🔒</div>
          <div style={{ fontSize:14, fontWeight:800, marginBottom:4 }}>Clôture Z Générale du Magasin</div>
          <div style={{ fontSize:11, color:T.textMute, marginBottom:12 }}>
            La clôture générale et l'accès comptable nécessitent le code PIN d'un Gérant ou Propriétaire.
          </div>
          <div style={{ display:"flex", justifyContent:"center", gap:8, alignItems:"center", marginBottom:10 }}>
            <input
              type="password"
              maxLength={6}
              value={pinInput}
              onChange={e=>setPinInput(e.target.value.replace(/\D/g,""))}
              placeholder="Code PIN"
              style={{ width:120, background:T.inputBg, border:`2px solid ${pinError?T.red:T.inputBd}`, borderRadius:10, padding:"8px", color:T.text, textAlign:"center", fontSize:16, letterSpacing:4 }}
            />
            <button
              onClick={tryUnlock}
              style={{ background:T.accent, border:"none", borderRadius:10, padding:"8px 16px", fontWeight:800, color:T.bg, fontSize:12, cursor:"pointer" }}
            >
              Déverrouiller
            </button>
          </div>
          {pinError && <div style={{ color:T.red, fontSize:11, fontWeight:700 }}>❌ Code PIN incorrect (Défaut: 1111 ou 0000)</div>}
        </div>
      </div>
    );
  }

  if(!unlocked) return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,gap:16}}>
      <div style={{fontSize:48}}>🔒</div>
      <div style={{fontSize:16,fontWeight:800,color:T.text,textAlign:"center"}}>Accès Clôture & Comptabilité</div>
      <div style={{fontSize:12,color:T.textMute,textAlign:"center"}}>Entrez le PIN Gérant ou Propriétaire pour accéder à la clôture générale</div>
      <input type="password" maxLength={6} value={pinInput} onChange={e=>setPinInput(e.target.value.replace(/\D/g,"").slice(0,6))}
        placeholder="• • • •"
        style={{width:180,background:T.inputBg,border:`2px solid ${pinError?T.red:T.inputBd}`,borderRadius:14,padding:"14px 0",color:T.text,textAlign:"center",fontSize:22,letterSpacing:10,animation:pinError?"shake 0.4s":"none"}}
      />
      {pinError && <div style={{color:T.red,fontSize:12,fontWeight:700}}>❌ PIN incorrect (Défaut: 0000 ou 1111)</div>}
      <button onClick={tryUnlock} style={{background:T.accent,border:"none",borderRadius:14,padding:"12px 32px",fontWeight:800,color:T.bg,fontSize:14}}>Valider</button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:800}}>📅 Clôture des comptes</div>
        <div style={{ display:"flex", gap:6 }}>
          <button onClick={()=>setUnlocked(false)} style={{background:T.surface2,border:"none",borderRadius:10,padding:"5px 10px",fontSize:11,color:T.textMute,cursor:"pointer"}}>🔒 Verrouiller</button>
          {logout && (
            <button
              onClick={() => {
                logout();
              }}
              style={{ background:T.btnRed.bg, border:`1.5px solid ${T.red}44`, borderRadius:10, padding:"5px 10px", fontSize:11, fontWeight:700, color:T.red, cursor:"pointer", display:"flex", alignItems:"center", gap:4 }}
            >
              <span>🚪</span>
              <span>Déconnexion</span>
            </button>
          )}
        </div>
      </div>

      <div style={{display:"flex",gap:6,marginBottom:12,background:T.surface2,borderRadius:12,padding:4}}>
        {[["jour","📆 Journée"],["semaine","📅 Semaine"]].map(([k,l])=>(
          <button key={k} onClick={()=>setViewMode(k)} style={{flex:1,background:viewMode===k?T.accent:"transparent",border:"none",borderRadius:9,padding:"8px 0",fontWeight:700,color:viewMode===k?T.bg:T.textMute,fontSize:12}}>{l}</button>
        ))}
      </div>

      {viewMode==="jour" && (<>
        <div style={{background:T.surface,borderRadius:16,padding:16,marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>Récapitulatif du {today}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            <div style={{background:T.surface2,borderRadius:10,padding:10}}><div style={{fontSize:9,color:T.textMute}}>CA théorique</div><div style={{fontSize:18,fontWeight:800,color:T.green}}>{fmtPrice(caToday)}</div></div>
            <div style={{background:T.surface2,borderRadius:10,padding:10}}><div style={{fontSize:9,color:T.textMute}}>Ventes</div><div style={{fontSize:18,fontWeight:800,color:T.blue}}>{todaySales.length}</div></div>
            <div style={{background:T.surface2,borderRadius:10,padding:10}}><div style={{fontSize:9,color:T.textMute}}>Dépenses</div><div style={{fontSize:18,fontWeight:800,color:T.red}}>{fmtPrice(depToday)}</div></div>
            <div style={{background:T.surface2,borderRadius:10,padding:10}}><div style={{fontSize:9,color:T.textMute}}>Net</div><div style={{fontSize:18,fontWeight:800,color:T.accent}}>{fmtPrice(caToday-depToday)}</div></div>
          </div>
          {!alreadyClosed ? (<>
            <div style={{fontSize:11,color:T.textMute,marginBottom:6}}>Fond de caisse physique compté</div>
            <input placeholder="Montant en F CFA" value={fondCaisse} onChange={e=>setFondCaisse(e.target.value.replace(/\D/g,""))}
              style={{width:"100%",background:T.inputBg,border:`1px solid ${T.inputBd}`,borderRadius:10,padding:10,color:T.text,marginBottom:8}}/>
            {fondCaisse&&<div style={{background:Math.abs(parseInt(fondCaisse)-caToday)>1000?T.btnRed.bg:T.btnGreen.bg,borderRadius:8,padding:8,marginBottom:8,textAlign:"center",fontSize:13,fontWeight:800,color:Math.abs(parseInt(fondCaisse)-caToday)>1000?T.red:T.green}}>
              {Math.abs(parseInt(fondCaisse)-caToday)===0?"✅ Caisse juste":parseInt(fondCaisse)>caToday?"⚠️ Excédent":"❌ Manquant"} : {fmtPrice(Math.abs(parseInt(fondCaisse)-caToday))}
            </div>}
            <button onClick={cloturer} disabled={!fondCaisse} style={{width:"100%",background:fondCaisse?T.accent:T.surface2,border:"none",borderRadius:12,padding:12,fontWeight:700,color:fondCaisse?T.bg:T.textMute,opacity:fondCaisse?1:0.6}}>🔒 Clôturer la journée</button>
          </>) : <div style={{background:T.btnGreen.bg,borderRadius:12,padding:12,textAlign:"center",color:T.green,fontWeight:700}}>✅ Journée clôturée — {fmtPrice(alreadyClosed.caTheorique)}</div>}
        </div>
        <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Historique journées</div>
        {[...history].reverse().slice(0,10).map(h=><div key={h.date} style={{background:T.surface,borderRadius:10,padding:10,marginBottom:6}}>
          <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700}}>{h.date}</span><span style={{color:T.green,fontWeight:700}}>{fmtPrice(h.caTheorique)}</span></div>
          <div style={{fontSize:10,color:T.textMute}}>{h.nbVentes} ventes · Net: {fmtPrice(h.net||0)} · Écart: <span style={{color:h.ecart===0?T.green:Math.abs(h.ecart)>1000?T.red:T.orange,fontWeight:700}}>{fmtPrice(h.ecart)}</span></div>
        </div>)}
      </>)}

      {viewMode==="semaine" && (<>
        <div style={{background:T.surface,borderRadius:16,padding:14,marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:10}}>Semaine du {semaineISO[0]} au {semaineISO[5]}</div>
          {semaineData.map(r=>(
            <div key={r.date} style={{marginBottom:6,borderRadius:10,padding:"9px 10px",background:r.isToday?T.accent+"18":r.isFuture?T.surface2+"88":"transparent",border:r.isToday?`1px solid ${T.accent}55`:`1px solid ${T.border}`,opacity:r.isFuture?0.4:1}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <span style={{fontSize:12,fontWeight:800,color:r.isToday?T.accent:T.text}}>{r.jour}</span>
                  {r.isToday&&<span style={{marginLeft:6,fontSize:8,background:T.accent,color:T.bg,borderRadius:5,padding:"1px 5px"}}>AUJOURD'HUI</span>}
                  {r.cloture&&<span style={{marginLeft:6,fontSize:8,background:T.btnGreen.bg,color:T.green,borderRadius:5,padding:"1px 5px"}}>✅ CLÔTURÉ</span>}
                </div>
                {!r.isFuture&&<span style={{fontSize:13,fontWeight:800,color:T.green}}>{fmtPrice(r.ca)}</span>}
              </div>
              {!r.isFuture&&<div style={{fontSize:10,color:T.textMute,marginTop:3}}>{r.nbVentes} vente(s) · Dép: {fmtPrice(r.dep)} · Net: <span style={{color:r.net>=0?T.accent:T.red,fontWeight:700}}>{fmtPrice(r.net)}</span></div>}
            </div>
          ))}
          <div style={{background:T.accent+"18",border:`1px solid ${T.accent}55`,borderRadius:12,padding:12,marginTop:10}}>
            <div style={{fontSize:11,fontWeight:800,marginBottom:8,color:T.accent}}>📊 TOTAL SEMAINE</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              <div style={{background:T.surface2,borderRadius:8,padding:8}}><div style={{fontSize:9,color:T.textMute}}>CA total</div><div style={{fontSize:16,fontWeight:800,color:T.green}}>{fmtPrice(totalSem.ca)}</div></div>
              <div style={{background:T.surface2,borderRadius:8,padding:8}}><div style={{fontSize:9,color:T.textMute}}>Ventes</div><div style={{fontSize:16,fontWeight:800,color:T.blue}}>{totalSem.nb}</div></div>
              <div style={{background:T.surface2,borderRadius:8,padding:8}}><div style={{fontSize:9,color:T.textMute}}>Dépenses</div><div style={{fontSize:16,fontWeight:800,color:T.red}}>{fmtPrice(totalSem.dep)}</div></div>
              <div style={{background:T.surface2,borderRadius:8,padding:8}}><div style={{fontSize:9,color:T.textMute}}>Net</div><div style={{fontSize:16,fontWeight:800,color:totalSem.net>=0?T.accent:T.red}}>{fmtPrice(totalSem.net)}</div></div>
            </div>
          </div>
          {!semaineDejaCloturee ? (
            <button onClick={cloturerSemaine} style={{width:"100%",background:T.accent,border:"none",borderRadius:12,padding:12,fontWeight:800,color:T.bg,marginTop:10,fontSize:13}}>📅 Arrêter les comptes de la semaine</button>
          ) : (
            <div style={{background:T.btnGreen.bg,borderRadius:12,padding:12,textAlign:"center",color:T.green,fontWeight:700,marginTop:10}}>✅ Semaine clôturée le {new Date(semaineDejaCloturee.closedAt).toLocaleDateString("fr-FR")}</div>
          )}
        </div>
        <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Historique semaines</div>
        {[...histSemaine].reverse().slice(0,6).map(s=><div key={s.debut} style={{background:T.surface,borderRadius:10,padding:10,marginBottom:6}}>
          <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700,fontSize:12}}>Sem. {s.debut}</span><span style={{color:T.green,fontWeight:800}}>{fmtPrice(s.ca)}</span></div>
          <div style={{fontSize:10,color:T.textMute}}>{s.nb} ventes · Net: <span style={{color:s.net>=0?T.accent:T.red,fontWeight:700}}>{fmtPrice(s.net)}</span> · Clôt. {new Date(s.closedAt).toLocaleDateString("fr-FR")}</div>
        </div>)}
      </>)}
    </div>
  );
}

//  FEAT 6 — PRÉVISION CA
// ══════════════════════════════════════════════════════════════════
function SectionPrevision({ T, sales }) {
  const JOURS = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
  const previsions = useMemo(() => Array.from({length:7},(_,i)=>{
    const d=new Date(); d.setDate(d.getDate()+i+1);
    const dow=d.getDay(); const dateStr=d.toISOString().slice(0,10);
    const sameDay=Array.from({length:4},(_,w)=>{
      const r=new Date(); r.setDate(r.getDate()-(w*7)+(i+1));
      const s=r.toISOString().slice(0,10);
      const ca=sales.filter(x=>x.date===s&&!x.cancelled).reduce((a,x)=>a+(x.total||0),0);
      return ca>0?ca:null;
    }).filter(Boolean);
    const moy=sameDay.length?Math.round(sameDay.reduce((a,b)=>a+b,0)/sameDay.length):0;
    return {date:dateStr,jour:JOURS[dow],moy,confidence:Math.min(sameDay.length*25,100)};
  }), [sales]);
  const maxMoy=Math.max(...previsions.map(p=>p.moy),1);
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>🤖 Prévisions CA — 7 prochains jours</div>
    <div style={{fontSize:10,color:T.textMute,marginBottom:12}}>Moyenne mobile des 4 dernières semaines</div>
    <div style={{background:T.surface,borderRadius:16,padding:14,marginBottom:12}}>
      <div style={{display:"flex",alignItems:"flex-end",gap:5,height:90,marginBottom:8}}>
        {previsions.map((p,i)=>{const h=Math.max(p.moy>0?8:3,Math.round((p.moy/maxMoy)*80)); return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
          <div style={{fontSize:7,color:T.textMute,textAlign:"center"}}>{p.moy>0?Math.round(p.moy/1000)+"k":"-"}</div>
          <div style={{width:"100%",height:h,background:p.confidence>=75?T.accent:p.confidence>=50?T.blue:T.surface2,borderRadius:"3px 3px 0 0"}}/>
          <div style={{fontSize:8,color:T.text,fontWeight:700}}>{p.jour}</div>
        </div>;})}
      </div>
      <div style={{display:"flex",gap:12,justifyContent:"center",fontSize:9,color:T.textMute}}><span>🟡 Fiable</span><span>🔵 Moyen</span><span>⬜ Peu de données</span></div>
    </div>
    {previsions.map(p=><div key={p.date} style={{background:T.surface,borderRadius:10,padding:10,marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><div style={{fontWeight:700}}>{p.jour} {p.date}</div><div style={{fontSize:9,color:T.textMute}}>Confiance: {p.confidence}%</div></div>
      <div style={{fontWeight:800,color:p.moy>0?T.accent:T.textMute}}>{p.moy>0?fmtPrice(p.moy):"Pas assez de données"}</div>
    </div>)}
  </div>);
}

// ══════════════════════════════════════════════════════════════════
//  FEAT 7 — CLASSEMENT PRODUITS
// ══════════════════════════════════════════════════════════════════
function SectionClassement({ T, sales, products }) {
  const [period, setPeriod] = useState("mois"); const [view, setView] = useState("top");
  const stats = useMemo(() => {
    const cutoff=new Date(); if(period==="semaine") cutoff.setDate(cutoff.getDate()-7); else if(period==="mois") cutoff.setDate(cutoff.getDate()-30); else cutoff.setFullYear(cutoff.getFullYear()-1);
    const cutStr=cutoff.toISOString().slice(0,10); const map={};
    sales.filter(s=>!s.cancelled&&s.date>=cutStr).forEach(s=>(s.items||[]).forEach(it=>{
      const k=it.productId||it.label; if(!map[k]) map[k]={name:it.label,qty:0,ca:0};
      map[k].qty+=(it.qty||1); map[k].ca+=(it.amount||0)*(it.qty||1);
    }));
    return Object.values(map).sort((a,b)=>b.qty-a.qty);
  }, [sales, period]);
  const top=stats.slice(0,8); const flop=[...stats].sort((a,b)=>a.qty-b.qty).slice(0,8);
  const shown=view==="top"?top:flop; const maxQty=Math.max(...shown.map(s=>s.qty),1);
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:8}}>🏆 Classement produits</div>
    <div style={{display:"flex",gap:6,marginBottom:8}}>
      {[["semaine","7j"],["mois","30j"],["annee","1 an"]].map(([k,l])=><button key={k} onClick={()=>setPeriod(k)} style={{flex:1,background:period===k?T.accent:T.surface,border:"none",borderRadius:8,padding:"6px 4px",fontSize:11,fontWeight:600,color:period===k?T.bg:T.text}}>{l}</button>)}
    </div>
    <div style={{display:"flex",gap:6,marginBottom:12,background:T.surface2,borderRadius:10,padding:3}}>
      <button onClick={()=>setView("top")} style={{flex:1,background:view==="top"?T.green:"transparent",border:"none",borderRadius:8,padding:7,fontWeight:700,color:view==="top"?T.bg:T.textMute}}>🏆 Top</button>
      <button onClick={()=>setView("flop")} style={{flex:1,background:view==="flop"?T.red:"transparent",border:"none",borderRadius:8,padding:7,fontWeight:700,color:view==="flop"?T.bg:T.textMute}}>📉 Flop</button>
    </div>
    {shown.length===0&&<div style={{color:T.textMute,fontSize:11,textAlign:"center",padding:24}}>Pas assez de données</div>}
    {shown.map((p,i)=>{const bW=Math.round((p.qty/maxQty)*100); return <div key={p.name} style={{background:T.surface,borderRadius:10,padding:10,marginBottom:6}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontWeight:600,fontSize:12}}><span style={{color:T.textMute,marginRight:6}}>#{i+1}</span>{p.name}</span><span style={{fontSize:11,color:T.accent,fontWeight:700}}>{fmtPrice(p.ca)}</span></div>
      <div style={{height:4,background:T.surface2,borderRadius:2,overflow:"hidden",marginBottom:2}}><div style={{height:"100%",width:`${bW}%`,background:view==="top"?T.green:T.red,borderRadius:2}}/></div>
      <div style={{fontSize:9,color:T.textMute}}>{p.qty} unité(s)</div>
    </div>;})}
  </div>);
}

// ══════════════════════════════════════════════════════════════════
//  FEAT 8 — KPI DIRECTION
// ══════════════════════════════════════════════════════════════════
function SectionKPI({ T, sales, products, depenses, credits }) {
  const last30str=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
  const s30=sales.filter(s=>!s.cancelled&&s.date>=last30str);
  const ca30=s30.reduce((a,s)=>a+(s.total||0),0); const dep30=depenses.filter(d=>d.date>=last30str).reduce((a,d)=>a+(d.montant||0),0);
  const nb30=s30.length; const panier30=nb30?Math.round(ca30/nb30):0;
  const annul30=sales.filter(s=>s.cancelled&&s.date>=last30str).length;
  const txAnnul=(nb30+annul30)?Math.round((annul30/(nb30+annul30))*100):0;
  const creances=(credits||[]).filter(c=>!c.paid).reduce((a,c)=>a+(c.total-(c.paidAmount||0)),0);
  const marge30=s30.reduce((a,s)=>a+(s.items||[]).reduce((b,it)=>{const p=products.find(x=>x.id===it.productId); return p?.prixAchat?b+(it.amount-p.prixAchat)*(it.qty||1):b;},0),0);
  const kpis=[
    {label:"CA 30j",value:fmtPrice(ca30),color:T.accent,icon:"💰",sub:`${nb30} ventes`},
    {label:"Marge brute",value:fmtPrice(marge30),color:T.green,icon:"📈",sub:ca30?`${Math.round((marge30/ca30)*100)}%`:"—"},
    {label:"Panier moyen",value:fmtPrice(panier30),color:T.blue,icon:"🛒",sub:"30 jours"},
    {label:"Dépenses",value:fmtPrice(dep30),color:T.red,icon:"💸",sub:`Net: ${fmtPrice(marge30-dep30)}`},
    {label:"Taux annulation",value:`${txAnnul}%`,color:txAnnul>10?T.red:T.green,icon:"❌",sub:`${annul30} annulation(s)`},
    {label:"Créances",value:fmtPrice(creances),color:T.orange,icon:"💳",sub:`${(credits||[]).filter(c=>!c.paid).length} client(s)`},
  ];
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>💡 Tableau de bord 30 jours</div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
      {kpis.map(k=><div key={k.label} style={{background:T.surface,borderRadius:14,padding:14,border:`1px solid ${k.color}33`}}>
        <div style={{fontSize:18,marginBottom:4}}>{k.icon}</div>
        <div style={{fontSize:9,color:T.textMute}}>{k.label}</div>
        <div style={{fontSize:18,fontWeight:800,color:k.color}}>{k.value}</div>
        <div style={{fontSize:9,color:T.textMute,marginTop:2}}>{k.sub}</div>
      </div>)}
    </div>
  </div>);
}

  const decompose=(amount)=>{let rest=amount; const r=[]; for(const b of BILLETS){const n=Math.floor(rest/b); if(n>0){r.push({val:b,n}); rest-=b*n;}} return r;};
  const quickAmounts=[total,Math.ceil(total/500)*500,Math.ceil(total/1000)*1000,Math.ceil(total/5000)*5000].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);

//  SECTION PWA ET HORS-LIGNE (Onglet Plus)
// ══════════════════════════════════════════════════════════════════
function SectionPWAInstall({ T, flashMsg }) {
  const [isInstalled, setIsInstalled] = useState(() => {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  });
  const [swActive, setSwActive] = useState(() => !!navigator.serviceWorker?.controller);
  const [isOnline, setIsOnline] = useState(navigator.onLine);

  useEffect(() => {
    const handleOnline = () => setIsOnline(true);
    const handleOffline = () => setIsOnline(false);
    window.addEventListener("online", handleOnline);
    window.addEventListener("offline", handleOffline);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(() => setSwActive(true));
    }

    return () => {
      window.removeEventListener("online", handleOnline);
      window.removeEventListener("offline", handleOffline);
    };
  }, []);

  const handlePromptInstall = async () => {
    if (window.deferredPWAInstallPrompt) {
      window.deferredPWAInstallPrompt.prompt();
      const choice = await window.deferredPWAInstallPrompt.userChoice;
      if (choice.outcome === 'accepted') {
        if (typeof flashMsg === "function") flashMsg("Application en cours d'installation !");
      }

function SectionDevis({ T, shopId, shopName, products, addSale, flashMsg }) {

        <input placeholder="Prix" value={dPrice} onChange={e=>setDPrice(e.target.value.replace(/\D/g,""))} style={{flex:1,background:T.inputBg,border:`1px solid ${T.inputBd}`,borderRadius:8,padding:8,color:T.text,fontSize:11}}/>

//  FEAT 11 — RETOURS & ÉCHANGES
// ══════════════════════════════════════════════════════════════════
function SectionRetours({ T, shopId, sales, updateStock, flashMsg }) {
  const today=new Date().toISOString().slice(0,10);
  const [search, setSearch] = useState(""); const [selected, setSelected] = useState(null); const [returnType, setReturnType] = useState("remboursement");
  const KEY=`pos_retours_${shopId}`;
  const [retours, setRetours] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){ return []; } });
  const recentSales=[...sales].filter(s=>!s.cancelled&&s.date>=new Date(Date.now()-7*86400000).toISOString().slice(0,10)).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  const filtered=recentSales.filter(s=>!search||s.total+""===search||s.date===search||(s.caissier||"").toLowerCase().includes(search.toLowerCase())||(s.note||"").toLowerCase().includes(search.toLowerCase()));
  const doReturn=()=>{
    if(!selected) return;
    const r={id:Date.now().toString(36),saleId:selected.id,date:today,type:returnType,total:selected.total,items:selected.items,processedAt:Date.now()};
    const updated=[...retours,r]; setRetours(updated); localStorage.setItem(KEY, JSON.stringify(updated));
    if(returnType!=="avoir")(selected.items||[]).forEach(it=>{if(it.productId) updateStock(it.productId,it.qty||1,"entree","Retour client");});
    setSelected(null); setSearch(""); flashMsg(`✅ Retour enregistré — ${returnType}`);
  };
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:12}}>🔁 Retours & Échanges</div>
    <div style={{background:T.surface,borderRadius:14,padding:12,marginBottom:12}}>
      <input placeholder="🔍 Montant, date, caissier..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:"100%",background:T.inputBg,border:`1px solid ${T.inputBd}`,borderRadius:10,padding:10,color:T.text,marginBottom:8}}/>
      {filtered.slice(0,5).map(s=><div key={s.id} onClick={()=>setSelected(s)} style={{background:selected?.id===s.id?T.accent+"22":T.surface2,border:`1px solid ${selected?.id===s.id?T.accent:T.border}`,borderRadius:10,padding:10,marginBottom:6,cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:11,fontWeight:600}}>{s.date} · {(s.items||[]).length} art.</span><span style={{fontWeight:800,color:T.accent}}>{fmtPrice(s.total)}</span></div>
        <div style={{fontSize:9,color:T.textMute}}>{s.caissier||""} {s.note?`· ${s.note}`:""}</div>
      </div>)}
    </div>
    {selected&&<div style={{background:T.surface,borderRadius:14,padding:14,marginBottom:12,border:`1px solid ${T.orange}44`}}>
      <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>Type de retour</div>
      <div style={{display:"flex",gap:6,marginBottom:12}}>
        {[["remboursement","💸 Rembourser"],["echange","🔀 Échanger"],["avoir","🎟️ Avoir"]].map(([k,l])=><button key={k} onClick={()=>setReturnType(k)} style={{flex:1,background:returnType===k?T.accent:T.surface2,border:"none",borderRadius:8,padding:"7px 4px",fontSize:10,fontWeight:700,color:returnType===k?T.bg:T.text}}>{l}</button>)}
      </div>
      <button onClick={doReturn} style={{width:"100%",background:T.orange||"#f59e0b",border:"none",borderRadius:12,padding:12,fontWeight:700,color:"#fff"}}>Confirmer · {fmtPrice(selected.total)}</button>
    </div>}
    <div style={{fontSize:11,fontWeight:700,marginBottom:8}}>Historique ({retours.length})</div>
    {retours.length===0&&<div style={{color:T.textMute,fontSize:11,textAlign:"center",padding:16}}>Aucun retour</div>}
    {[...retours].reverse().slice(0,8).map(r=><div key={r.id} style={{background:T.surface2,borderRadius:8,padding:8,marginBottom:5,display:"flex",justifyContent:"space-between"}}>
      <div><div style={{fontSize:11,fontWeight:600}}>{r.date} · {r.type}</div><div style={{fontSize:9,color:T.textMute}}>{(r.items||[]).length} art.</div></div>
      <div style={{fontWeight:700,color:T.orange}}>{fmtPrice(r.total)}</div>
    </div>)}
  </div>);
}

  add:(shopId,action,details,actor="Admin")=>{const logs=auditLog.get(shopId); logs.unshift({id:Date.now().toString(36),ts:Date.now(),action,details,actor}); if(logs.length>200) logs.splice(200); localStorage.setItem(auditLog._key(shopId),JSON.stringify(logs));},
  get:(shopId)=>{ try{return JSON.parse(localStorage.getItem(auditLog._key(shopId))||"[]");}catch(e){return [];} }
};

  useEffect(()=>{const i=setInterval(()=>setLogs(auditLog.get(shopId)),5000); return ()=>clearInterval(i);},[shopId]);
  const filtered=filter==="all"?logs:logs.filter(l=>l.action===filter);
  const colA=(a)=>{if(a==="vente") return T.green; if(a==="annulation") return T.red; if(a==="produit") return T.blue; if(a==="stock") return T.orange; return T.textMute;};
  return (<div>
    <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>📋 Journal d'audit</div>
    <div style={{fontSize:10,color:T.textMute,marginBottom:8}}>{logs.length} entrée(s)</div>
    <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:4,marginBottom:10}}>
      {["all","vente","annulation","produit","stock","connexion"].map(k=><button key={k} onClick={()=>setFilter(k)} style={{flex:"0 0 auto",background:filter===k?T.accent:T.surface,border:"none",borderRadius:8,padding:"5px 10px",fontSize:10,fontWeight:600,color:filter===k?T.bg:T.text}}>{k==="all"?"Tout":k}</button>)}
    </div>
    {filtered.length===0&&<div style={{color:T.textMute,fontSize:11,textAlign:"center",padding:24}}>Aucune action</div>}
    {filtered.slice(0,50).map(l=><div key={l.id} style={{background:T.surface,borderRadius:8,padding:10,marginBottom:5,borderLeft:`3px solid ${colA(l.action)}`}}>
      <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:11,fontWeight:700,color:colA(l.action)}}>{l.action.toUpperCase()}</span><span style={{fontSize:9,color:T.textMute}}>{new Date(l.ts).toLocaleTimeString("fr-FR")}</span></div>
      <div style={{fontSize:11,color:T.text}}>{l.details}</div>
      {l.actor&&<div style={{fontSize:9,color:T.textMute}}>par {l.actor}</div>}
    </div>)}
  </div>);
}

function SectionSessions({ T, shopId, sales, caissiers, logout }) {
  const KEY=`pos_sessions_${shopId}`;
  const [sessions, setSessions] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY)||"[]"); } catch(e){ return []; } });
  const save=(list)=>{setSessions(list); localStorage.setItem(KEY, JSON.stringify(list));};
  const open=(cName)=>{save([...sessions,{id:Date.now().toString(36),caissier:cName,openedAt:Date.now(),closedAt:null}]);};
  const close=(id)=>save(sessions.map(s=>s.id===id?{...s,closedAt:Date.now()}:s));
  const getSessStats=(cName,openedAt,closedAt)=>{
    const end=closedAt||Date.now();
    const ss=sales.filter(s=>s.caissier===cName&&!s.cancelled&&(s.timestamp||0)>=openedAt&&(s.timestamp||0)<=end);
    return {ca:ss.reduce((a,s)=>a+(s.total||0),0),nb:ss.length,duration:Math.round((end-openedAt)/60000)};
  };
  const openSess=sessions.find(s=>!s.closedAt);
  return (<div>
    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
      <div style={{fontSize:14,fontWeight:800}}>⏰ Sessions de travail</div>
      {logout && (
        <button
          onClick={() => {
            logout();
          }}
          title="Se déconnecter du commerce"
          style={{
            background: T.btnRed?.bg || "rgba(239,68,68,0.12)",
            border: `1.5px solid ${T.red}44`,
            borderRadius: 8,
            padding: "5px 10px",
            fontSize: 11,
            fontWeight: 700,
            color: T.red,
            cursor: "pointer",
            display: "flex",
            alignItems: "center",
            gap: 4
          }}
        >
          <span>🚪</span>
          <span>Déconnexion</span>
        </button>
      )}
    </div>
    {!openSess&&<div style={{background:T.surface,borderRadius:14,padding:12,marginBottom:12}}>
      <div style={{fontSize:11,fontWeight:700,marginBottom:8}}>Ouvrir une session</div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {caissiers.map(c=><button key={c.id} onClick={()=>open(c.name)} style={{background:T.accent,border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,color:T.bg,fontSize:11}}>{c.name}</button>)}
        {caissiers.length===0&&<div style={{color:T.textMute,fontSize:11}}>Créez d'abord des caissiers</div>}
      </div>
    </div>}
    {openSess&&<div style={{background:T.accent+"22",borderRadius:14,padding:14,marginBottom:12,border:`1px solid ${T.accent}44`}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontSize:13,fontWeight:800,color:T.accent}}>🟢 Session ouverte</div><div style={{fontSize:11}}>{openSess.caissier} · {new Date(openSess.openedAt).toLocaleTimeString("fr-FR")}</div></div>
        <button onClick={()=>close(openSess.id)} style={{background:T.red,border:"none",borderRadius:10,padding:"8px 14px",fontWeight:700,color:"#fff"}}>Fermer</button>
      </div>
      {(()=>{const s=getSessStats(openSess.caissier,openSess.openedAt,null); return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginTop:10}}>
        <div style={{background:T.surface2,borderRadius:8,padding:8,textAlign:"center"}}><div style={{fontSize:9,color:T.textMute}}>CA</div><div style={{fontWeight:800,color:T.green}}>{fmtPrice(s.ca)}</div></div>
        <div style={{background:T.surface2,borderRadius:8,padding:8,textAlign:"center"}}><div style={{fontSize:9,color:T.textMute}}>Ventes</div><div style={{fontWeight:800,color:T.blue}}>{s.nb}</div></div>
        <div style={{background:T.surface2,borderRadius:8,padding:8,textAlign:"center"}}><div style={{fontSize:9,color:T.textMute}}>Durée</div><div style={{fontWeight:800}}>{s.duration}min</div></div>
      </div>;})()}
    </div>}
    <div style={{fontSize:11,fontWeight:700,marginBottom:8}}>Historique ({sessions.filter(s=>s.closedAt).length})</div>
    {[...sessions].filter(s=>s.closedAt).reverse().slice(0,8).map(s=>{const st=getSessStats(s.caissier,s.openedAt,s.closedAt); return <div key={s.id} style={{background:T.surface,borderRadius:10,padding:10,marginBottom:6}}>
      <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700}}>{s.caissier}</span><span style={{fontWeight:800,color:T.accent}}>{fmtPrice(st.ca)}</span></div>
      <div style={{fontSize:9,color:T.textMute}}>{new Date(s.openedAt).toLocaleDateString("fr-FR")} · {st.duration}min · {st.nb} vente(s)</div>
    </div>;})}
  </div>);
}

// Composant Équipe & Niveaux d'accès
function SectionEquipe({
  T, shopId, staffList, setStaffList, currentStaff, onSelectStaff, flashMsg, cloudEnabled, logout
}) {
  const [subView, setSubView] = useState("members"); // "members" | "matrix"
  const [showModal, setShowModal] = useState(false);
  const [editingStaff, setEditingStaff] = useState(null);
  const [formName, setFormName] = useState("");
  const [formRole, setFormRole] = useState("caissiere");
  const [formPin, setFormPin] = useState("");
  const [formPhone, setFormPhone] = useState("");
  const [revealedPins, setRevealedPins] = useState({});

  const togglePinReveal = (id) => {
    setRevealedPins(prev => ({ ...prev, [id]: !prev[id] }));
  };

  const openCreateModal = () => {
    setEditingStaff(null);
    setFormName("");
    setFormRole("caissiere");
    setFormPin(Math.floor(1000 + Math.random() * 9000).toString());
    setFormPhone("");
    setShowModal(true);
  };

  const openEditModal = (staff) => {
    setEditingStaff(staff);
    setFormName(staff.name || "");
    setFormRole(staff.role || "caissiere");
    setFormPin(staff.pin || "");
    setFormPhone(staff.phone || "");
    setShowModal(true);
  };

  const handleSaveStaff = () => {
    if (!formName.trim()) { flashMsg("Veuillez saisir un nom"); return; }
    if (!formPin || formPin.length < 4) { flashMsg("Le code PIN doit comporter au moins 4 chiffres"); return; }

    let updatedList;
    if (editingStaff) {
      updatedList = staffList.map(s => s.id === editingStaff.id ? {
        ...s,
        name: formName.trim(),
        role: formRole,
        pin: formPin,
        phone: formPhone.trim()
      } : s);
      flashMsg(`✅ Profil de ${formName} mis à jour`);
    } else {
      const newStaff = {
        id: "usr_" + Date.now().toString(36),
        name: formName.trim(),
        role: formRole,
        pin: formPin,
        phone: formPhone.trim(),
        active: true,
        createdAt: Date.now()
      };
      updatedList = [...staffList, newStaff];
      flashMsg(`✅ Nouveau collaborateur ajouté : ${formName}`);
    }

    setStaffList(updatedList);
    OfflineStore.set(shopId, "caissiers", updatedList);
    if (cloudEnabled && db) {
      updatedList.forEach(s => {
        db.collection("shops").doc(shopId).collection("caissiers").doc(s.id).set(s).catch(()=>{});
      });
    }
    setShowModal(false);
  };

  const handleDeleteStaff = (staff) => {
    if (staff.role === "proprietaire") {
      const countProprios = staffList.filter(s => s.role === "proprietaire").length;
      if (countProprios <= 1) {
        flashMsg("❌ Impossible de supprimer le seul Propriétaire du commerce");
        return;
      }
    }
    if (!window.confirm(`Supprimer l'accès de « ${staff.name} » ?`)) return;

    const updatedList = staffList.filter(s => s.id !== staff.id);
    setStaffList(updatedList);
    OfflineStore.set(shopId, "caissiers", updatedList);
    if (cloudEnabled && db) {
      db.collection("shops").doc(shopId).collection("caissiers").doc(staff.id).delete().catch(()=>{});
    }
    flashMsg(`🗑️ Accès supprimé pour ${staff.name}`);
  };

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <div>
          <div style={{ fontSize:16, fontWeight:800 }}>👥 Équipe & Niveaux d'accès</div>
          <div style={{ fontSize:10, color:T.textMute }}>Gestion des droits Caissière, Gérant et Propriétaire</div>
        </div>
        <div style={{ display:"flex", gap:6 }}>
          <button
            onClick={openCreateModal}
            style={{ background:T.accent, border:"none", borderRadius:10, padding:"8px 14px", fontWeight:700, color:T.bg, fontSize:12, cursor:"pointer" }}
          >
            + Ajouter
          </button>
          {logout && (
            <button
              onClick={() => {
                logout();
              }}
              title="Se déconnecter du commerce"
              style={{
                background: T.btnRed?.bg || "rgba(239,68,68,0.12)",
                border: `1.5px solid ${T.red}44`,
                borderRadius: 10,
                padding: "8px 12px",
                fontWeight: 700,
                color: T.red,
                fontSize: 12,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                gap: 4
              }}
            >
              <span>🚪</span>
              <span>Déconnexion</span>
            </button>
          )}
        </div>
      </div>

      {/* SOUS-ONGLETS */}
      <div style={{ display:"flex", gap:4, background:T.surface2, border:`1px solid ${T.border}`, borderRadius:10, padding:3, marginBottom:12 }}>
        <button
          onClick={()=>setSubView("members")}

            flex:1,
