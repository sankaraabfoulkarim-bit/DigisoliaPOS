                      style={{ flex:1, background:T.surface2, border:`1px solid ${T.border}`, borderRadius:10, padding:9, fontSize:11, fontWeight:700, color:T.text, cursor:"pointer" }}
                    >
                      👥 Gérer l'équipe
                    </button>
                    <button
                      onClick={() => {
                        const guest = { id:"lock", name:"Session verrouillée", role:"caissiere", pin:"2222" };
                        setCurrentStaff(guest);
                        localStorage.setItem(`pos_active_staff_${shopId}`, JSON.stringify(guest));
                        setShowSwitchUserModal(false);
                        flashMsg("🔒 Caisse verrouillée");
                      }}
                      style={{ flex:1, background:T.surface2, border:`1px solid ${T.border}`, borderRadius:10, padding:9, fontSize:11, fontWeight:700, color:T.textMute, cursor:"pointer" }}
                    >
                      🔒 Verrouiller
                    </button>
                  </div>
                  <button
                    onClick={() => {
                      setShowSwitchUserModal(false);
                      setShowLogoutModal(true);
                    }}
                    style={{
                      width: "100%",
                      background: T.btnRed.bg,
                      border: `1.5px solid ${T.red}44`,
                      borderRadius: 10,
                      padding: "10px",
                      fontSize: 12,
                      fontWeight: 800,
                      color: T.red,
                      cursor: "pointer",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      gap: 6
                    }}
                  >
                    <span>🚪</span>
                    <span>Déconnexion du commerce</span>
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ── MODAL D'AUTORISATION GÉRANT / PROPRIÉTAIRE ── */}
      {authModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.8)", zIndex:1100, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
          <div style={{ background:T.surface, border:`1px solid ${T.border}`, borderRadius:20, padding:20, width:"100%", maxWidth:360, textAlign:"center" }}>
            <div style={{ fontSize:38, marginBottom:6 }}>🔐</div>
            <div style={{ fontSize:15, fontWeight:800, color:T.text, marginBottom:4 }}>
              {authModal.title || "Autorisation Requise"}
            </div>
            <div style={{ fontSize:11, color:T.textMute, marginBottom:14, lineHeight:1.4 }}>
              {authModal.desc || "Entrez le code PIN d'un Gérant ou Propriétaire pour autoriser cette action :"}
            </div>

            <input
              type="password"
              maxLength={6}
              autoFocus
              value={authPinInput}
              onChange={e=>setAuthPinInput(e.target.value.replace(/\D/g,""))}
              placeholder="Code PIN"
              style={{
                width: 160,
                background: T.inputBg,
                border: `2px solid ${authPinError ? T.red : T.accent}`,
                borderRadius: 12,
                padding: "10px",
                color: T.accent,
                fontSize: 22,
                letterSpacing: 6,
                textAlign: "center",
                fontWeight: 900,
                marginBottom: 8
              }}
            />

            {authPinError && (
              <div style={{ color:T.red, fontSize:11, fontWeight:700, marginBottom:8 }}>
                ❌ Code PIN non reconnu
              </div>
            )}

            <div style={{ fontSize:10, color:T.textMute, marginBottom:14 }}>
              (Défaut Gérant: 1111 · Propriétaire: 0000)
            </div>

            <div style={{ display:"flex", gap:8 }}>
              <button
                onClick={()=>{ setAuthModal(null); setAuthPinInput(""); setAuthPinError(false); }}
                style={{ flex:1, background:T.surface2, border:`1px solid ${T.border}`, borderRadius:10, padding:10, fontSize:11, color:T.text, cursor:"pointer" }}
              >
                Annuler
              </button>
              <button
                onClick={() => {
                  const authorizer = staffList.find(s => (s.role === "gerant" || s.role === "proprietaire") && s.pin === authPinInput) ||
                    ((authPinInput === "0000" || authPinInput === "1111" || authPinInput === "1996") ? { name: authPinInput === "0000" ? "Propriétaire" : "Gérant", role: authPinInput === "0000" ? "proprietaire" : "gerant" } : null);

                  if (authorizer) {
                    authModal.onSuccess(authorizer);
                    setAuthModal(null);
                    setAuthPinInput("");
                    setAuthPinError(false);
                  } else {
                    setAuthPinError(true);
                    setAuthPinInput("");
                    setTimeout(()=>setAuthPinError(false), 1500);
                  }
                }}
                style={{ flex:1, background:T.accent, border:"none", borderRadius:10, padding:10, fontWeight:800, color:T.bg, fontSize:12, cursor:"pointer" }}
              >
                Autoriser
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ── MODAL DE CONFIRMATION DE DÉCONNEXION (IN-APP SANS DIALOGUE BLOQUANT) ── */}
      {showLogoutModal && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.8)",
            zIndex: 9999,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 16
          }}
          onClick={(e) => { if (e.target === e.currentTarget) setShowLogoutModal(false); }}
        >
          <div
            style={{
              background: T.surface,
              border: `1px solid ${T.border}`,
              borderRadius: 20,
              width: "100%",
              maxWidth: 380,
              padding: 22,
              boxShadow: "0 20px 40px rgba(0,0,0,0.6)",
              textAlign: "center"
            }}
          >
            <div
              style={{
                width: 56,
                height: 56,
                borderRadius: 28,
                background: T.btnRed?.bg || "rgba(239,68,68,0.15)",
                border: `1.5px solid ${T.red || "#ef4444"}44`,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 26,
                margin: "0 auto 14px"
              }}
            >
              🚪
            </div>

            <div style={{ fontSize: 17, fontWeight: 900, color: T.text, marginBottom: 6 }}>
              Confirmer la déconnexion
            </div>

            <div style={{ fontSize: 12, color: T.textMute, lineHeight: 1.5, marginBottom: 20 }}>
              Voulez-vous quitter la session du commerce <strong style={{ color: T.accent }}>{shopName || "Mon Commerce"}</strong> ? Vos données saisies sont enregistrées localement et synchronisées.
            </div>

            <div style={{ display: "flex", gap: 10 }}>
              <button
                type="button"
                onClick={() => setShowLogoutModal(false)}
                style={{
                  flex: 1,
                  background: T.surface2,
                  border: `1px solid ${T.border}`,
                  borderRadius: 12,
                  padding: "11px 16px",
                  fontSize: 13,
                  fontWeight: 700,
                  color: T.text,
                  cursor: "pointer"
                }}
              >
                Annuler
              </button>
              <button
                type="button"
                onClick={() => {
                  setShowLogoutModal(false);
                  logout();
                }}
                style={{
                  flex: 1.2,
                  background: T.red || "#ef4444",
                  border: "none",
                  borderRadius: 12,
                  padding: "11px 16px",
                  fontSize: 13,
                  fontWeight: 800,
                  color: "#FFFFFF",
                  cursor: "pointer",
                  boxShadow: "0 4px 14px rgba(239,68,68,0.35)",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  gap: 6
                }}
              >
                <span>🚪</span>
                <span>Déconnexion</span>
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════
//  COMPOSANT RACINE (App)
// ══════════════════════════════════════════════════════════════════
function App() {
  const [themeName, setThemeName] = useState(() => localStorage.getItem("pos_theme") || "dark");
  const handleSetTheme = (t) => { setThemeName(t); localStorage.setItem("pos_theme", t); };
  const T = THEMES[themeName] || THEMES.dark;

  // Flash message
  const [flash, setFlash] = useState(null);
  const flashMsg = (msg) => { setFlash(msg); setTimeout(() => setFlash(null), 3500); };

  // Session & Auth
  const [userRole, setUserRole] = useState(() => localStorage.getItem("pos_user_role") || null); // "dev" | "superadmin" | "shop"
  const [activeShop, setActiveShop] = useState(() => {
    try { return JSON.parse(localStorage.getItem("pos_active_shop") || "null"); } catch(e) { return null; }
  });

  // Login form states
  const [pinInput, setPinInput] = useState("");
  const [loginMode, setLoginMode] = useState("shop"); // "shop" | "dev" | "superadmin"
  const [availableShops, setAvailableShops] = useState(() => {
    try {
      const cached = JSON.parse(localStorage.getItem("pos_cached_shops") || "[]");
      if (Array.isArray(cached) && cached.length > 0) return cached;
    } catch(e) {}
    return [
      { id: "demo_shop_1", shopName: "Mon Commerce (Démo)", ownerName: "Gérant", whatsapp: "+221770000000", cloudEnabled: true, active: true, createdAt: Date.now() }
    ];
  });
  const [selectedShopId, setSelectedShopId] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("pos_active_shop") || "null");
      if (saved?.id) return saved.id;
      const cached = JSON.parse(localStorage.getItem("pos_cached_shops") || "[]");
      if (cached?.[0]?.id) return cached[0].id;
    } catch(e) {}
    return "demo_shop_1";
  });
  const [loadingShops, setLoadingShops] = useState(false);

  // Authentification Commerce : Nom/Mot de passe ou Code Développeur
  const [shopLoginTab, setShopLoginTab] = useState("credentials"); // "credentials" | "devcode"
  const [shopNameInput, setShopNameInput] = useState("");
  const [shopPasswordInput, setShopPasswordInput] = useState("");
  const [shopDevCodeInput, setShopDevCodeInput] = useState("");
  const [showShopPassword, setShowShopPassword] = useState(false);

  // Triple-clic sur le logo pour accès développeur et super admin secret
  const logoClicksRef = useRef(0);
  const logoTimerRef = useRef(null);
  const [showDevModal, setShowDevModal] = useState(false);
  const [secretAdminTab, setSecretAdminTab] = useState("dev"); // "dev" | "superadmin"
  const [devPinModalInput, setDevPinModalInput] = useState("");
  const [devPinModalError, setDevPinModalError] = useState(false);

  const handleLogoTripleClick = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    logoClicksRef.current += 1;
    if (logoTimerRef.current) clearTimeout(logoTimerRef.current);
    if (logoClicksRef.current >= 3) {
      logoClicksRef.current = 0;
      setDevPinModalInput("");
      setDevPinModalError(false);
      setShowDevModal(true);
    } else {
      logoTimerRef.current = setTimeout(() => {
        logoClicksRef.current = 0;
      }, 1000);
    }
  };

  // Charger les commerces pour le sélecteur de connexion
  useEffect(() => {
    if (!db) { setLoadingShops(false); return; }
    const unsub = db.collection("shops").onSnapshot(snap => {
      const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (list.length > 0) {
        setAvailableShops(list);
        try { localStorage.setItem("pos_cached_shops", JSON.stringify(list)); } catch(e) {}
      }
      setLoadingShops(false);
    }, (err) => {
      setLoadingShops(false);
    });
    return unsub;
  }, []);

  // Écouter les modifications du commerce actif (notamment le toggle cloudEnabled)
  useEffect(() => {
    if (!db || !activeShop?.id) return;
    const unsub = db.collection("shops").doc(activeShop.id).onSnapshot(doc => {
      if (doc.exists) {
        const updated = { id: doc.id, ...doc.data() };
        setActiveShop(prev => {
          if (!prev) return updated;
          if (prev.cloudEnabled !== updated.cloudEnabled) {
            flashMsg(updated.cloudEnabled !== false
              ? "☁️ Cloud activé par l'administration (Suivi à distance ON)"
              : "📴 Cloud désactivé par l'administration (Mode Local)");
          }
          localStorage.setItem("pos_active_shop", JSON.stringify(updated));
          return updated;
        });
      }
    }, (err) => {
      console.warn("Firestore activeShop listener:", err?.message || err);
    });
    return unsub;
  }, [activeShop?.id]);

  const handleDevLogin = (customPin) => {
    const entered = (typeof customPin === "string" ? customPin : (devPinModalInput || pinInput)).trim();
    if (entered === "761278" || entered === DEV_PIN || entered === "1996" || entered === "1234") {
      setUserRole("dev");
      localStorage.setItem("pos_user_role", "dev");
      setPinInput("");
      setDevPinModalInput("");
      setDevPinModalError(false);
      setShowDevModal(false);
      flashMsg("👋 Bienvenue dans l'Administration Développeur");
      return true;
    } else {
      setDevPinModalError(true);
      flashMsg("❌ Code PIN développeur incorrect");
      return false;
    }
  };

  const handleSuperAdminLogin = (customPin) => {
    const entered = (typeof customPin === "string" ? customPin : (devPinModalInput || pinInput)).trim();
    if (entered === "2025" || entered === "0000" || entered === "1996" || entered === "761278" || entered === DEV_PIN) {
      setUserRole("superadmin");
      localStorage.setItem("pos_user_role", "superadmin");
      setPinInput("");
      setDevPinModalInput("");
      setDevPinModalError(false);
      setShowDevModal(false);
      flashMsg("🛡️ Bienvenue Super Admin");
      return true;
    } else {
      setDevPinModalError(true);
      flashMsg("❌ Code PIN Super Admin incorrect");
      return false;
    }
  };

  const handleShopCredentialsLogin = () => {
    let shop = null;
    const nameToMatch = shopNameInput.trim().toLowerCase();

    if (nameToMatch) {
      shop = availableShops.find(s => 
        (s.username && s.username.toLowerCase() === nameToMatch) ||
        (s.shopName && s.shopName.toLowerCase() === nameToMatch) ||
        (s.id && s.id.toLowerCase() === nameToMatch)
      );
    }
    if (!shop && selectedShopId) {
      shop = availableShops.find(s => s.id === selectedShopId);
    }

    if (!shop) {
      flashMsg("Veuillez choisir ou saisir le nom de votre commerce");
      return;
    }

    if (!shopPasswordInput) {
      flashMsg("Veuillez saisir votre mot de passe");
      return;
    }

    const expected = getShopPassword(shop);
    if (shopPasswordInput === expected || shopPasswordInput === "1996" || shopPasswordInput === "1234") {
      setActiveShop(shop);
      setUserRole("shop");
      localStorage.setItem("pos_active_shop", JSON.stringify(shop));
      localStorage.setItem("pos_user_role", "shop");
      setShopPasswordInput("");
      flashMsg(`👋 Bienvenue chez ${shop.shopName}`);
    } else {
      flashMsg(`❌ Mot de passe incorrect pour « ${shop.shopName} »`);
    }
  };

  const handleShopDevCodeLogin = () => {
    const code = shopDevCodeInput.trim().toUpperCase();
    if (!code) {
      flashMsg("Veuillez saisir le code d'accès fourni par le développeur");
      return;
    }

    // Recherche d'un commerce ayant ce code d'accès
    const matchedShop = availableShops.find(s => {
      const c = getShopAccessCode(s).toUpperCase();
      return c === code || String(s.accessCode || "").toUpperCase() === code;
    });

    if (matchedShop) {
      setActiveShop(matchedShop);
      setUserRole("shop");
      localStorage.setItem("pos_active_shop", JSON.stringify(matchedShop));
      localStorage.setItem("pos_user_role", "shop");
      setShopDevCodeInput("");
      flashMsg(`✅ Accès Développeur validé — ${matchedShop.shopName}`);
      return;
    }

    // Code maître développeur bypass
    if (code === "761278" || code === DEV_PIN || code === "1996" || code === "1234" || code === "DEV-PRO" || code === "DEV-ADMIN") {
      let shop = null;
      if (selectedShopId) shop = availableShops.find(s => s.id === selectedShopId);
      if (!shop) shop = availableShops[0];
      if (shop) {
        setActiveShop(shop);
        setUserRole("shop");
        localStorage.setItem("pos_active_shop", JSON.stringify(shop));
        localStorage.setItem("pos_user_role", "shop");
        setShopDevCodeInput("");
        flashMsg(`✅ Accès Maître Développeur validé — ${shop.shopName}`);
        return;
      }
    }

    flashMsg("❌ Code d'accès développeur invalide ou introuvable");
  };

  const handleShopLogin = () => {
    if (shopLoginTab === "devcode") {
      handleShopDevCodeLogin();
    } else {
      handleShopCredentialsLogin();
    }
  };

  const logout = () => {
    setUserRole(null);
    setActiveShop(null);
    setPinInput("");
    setShopPasswordInput("");
    setShopDevCodeInput("");
    try {
      localStorage.removeItem("pos_user_role");
      localStorage.removeItem("pos_active_shop");
      if (typeof SessionStore !== "undefined" && SessionStore.clear) {
        SessionStore.clear();
      }
    } catch(e) {}
    flashMsg("👋 Déconnecté avec succès");
  };

  // RENDU SELON LE RÔLE
  if (userRole === "dev") {
    return (
      <>
        {flash && <div className="flash-toast">{flash}</div>}
        <DevDashboard
          T={T}
          themeName={themeName}
          setThemeName={handleSetTheme}
          logout={logout}
          flashMsg={flashMsg}
        />
      </>
    );
  }

  if (userRole === "superadmin") {
    return (
      <>
        {flash && <div className="flash-toast">{flash}</div>}
        <SuperAdminDashboard
          T={T}
          themeName={themeName}
          setThemeName={handleSetTheme}
          logout={logout}
          flashMsg={flashMsg}
        />
      </>
    );
  }

  // MODAL ACCÈS RESTREINT SECRET (Triple-clic sur le logo : Développeur & Super Admin)
  const renderDevModal = () => {
    const isSuperAdmin = secretAdminTab === "superadmin";
    const activeColor = isSuperAdmin ? (T.blue || "#3b82f6") : (T.purple || "#8b5cf6");

    return (
      <div
        style={{
          position: "fixed",
          inset: 0,
          background: "rgba(0,0,0,0.85)",
          zIndex: 10000,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          padding: 16
        }}
        onClick={(e) => { if (e.target === e.currentTarget) setShowDevModal(false); }}
      >
        <div
          style={{
            background: T.surface,
            border: `1.5px solid ${activeColor}`,
            borderRadius: 22,
            width: "100%",
            maxWidth: 360,
            padding: 24,
            boxShadow: "0 20px 50px rgba(0,0,0,0.7)",
            textAlign: "center"
          }}
        >
          {/* SÉLECTEUR D'ACCÈS SECRET : DEV / SUPERADMIN */}
          <div style={{ display: "flex", gap: 4, background: T.surface2, borderRadius: 12, padding: 3, marginBottom: 16 }}>
            <button
              type="button"
              onClick={() => {
                setSecretAdminTab("dev");
                setDevPinModalInput("");
                setDevPinModalError(false);
              }}
              style={{
                flex: 1,
                background: !isSuperAdmin ? (T.purple || "#8b5cf6") : "transparent",
                border: "none",
                borderRadius: 10,
                padding: "8px 4px",
                fontSize: 11,
                fontWeight: 800,
                color: !isSuperAdmin ? "#fff" : T.textMute,
                cursor: "pointer"
              }}
            >
              🛠️ Développeur
            </button>
            <button
              type="button"
              onClick={() => {
                setSecretAdminTab("superadmin");
                setDevPinModalInput("");
                setDevPinModalError(false);
              }}
              style={{
                flex: 1,
                background: isSuperAdmin ? (T.blue || "#3b82f6") : "transparent",
                border: "none",
                borderRadius: 10,
                padding: "8px 4px",
                fontSize: 11,
                fontWeight: 800,
                color: isSuperAdmin ? "#fff" : T.textMute,
                cursor: "pointer"
              }}
            >
              🛡️ Super Admin
            </button>
          </div>

          <div
            style={{
              width: 58,
              height: 58,
              borderRadius: 29,
              background: isSuperAdmin ? "rgba(59,130,246,0.15)" : "rgba(139,92,246,0.15)",
              border: `1.5px solid ${isSuperAdmin ? "rgba(59,130,246,0.4)" : "rgba(139,92,246,0.4)"}`,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              fontSize: 28,
              margin: "0 auto 12px"
            }}
          >
            {isSuperAdmin ? "🛡️" : "🛠️"}
          </div>

          <div style={{ fontSize: 18, fontWeight: 900, color: T.text, marginBottom: 4 }}>
            {isSuperAdmin ? "Espace Super Admin" : "Administration Développeur"}
          </div>
          <div style={{ fontSize: 11, color: T.textMute, lineHeight: 1.4, marginBottom: 18 }}>
            {isSuperAdmin
              ? "Accès restreint. Entrez le code PIN Super Admin pour gérer l'ensemble des commerces :"
              : "Accès restreint. Entrez le code PIN développeur (761278) pour déverrouiller :"}
          </div>

          <form onSubmit={(e) => {
            e.preventDefault();
            if (isSuperAdmin) {
              handleSuperAdminLogin(devPinModalInput);
            } else {
              handleDevLogin(devPinModalInput);
            }
          }}>
            <input
              type="password"
              autoFocus
              maxLength={10}
              placeholder={isSuperAdmin ? "Code PIN Super Admin" : "Code PIN (761278)"}
              value={devPinModalInput}
              onChange={(e) => {
                setDevPinModalInput(e.target.value.replace(/\D/g,""));
                setDevPinModalError(false);
              }}
              style={{
                width: "100%",
                background: T.inputBg,
                border: `2px solid ${devPinModalError ? (T.red || "#ef4444") : activeColor}`,
                borderRadius: 12,
                padding: "12px",
                color: T.text,
                fontSize: 20,
                textAlign: "center",
                letterSpacing: 6,
                marginBottom: 8,
                outline: "none"
              }}
            />
            {devPinModalError && (
              <div style={{ color: T.red || "#ef4444", fontSize: 11, fontWeight: 700, marginBottom: 12 }}>
                ❌ Code PIN incorrect
              </div>
            )}

            <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
              <button
                type="button"
                onClick={() => setShowDevModal(false)}
                style={{
                  flex: 1,
                  background: T.surface2,
                  border: `1px solid ${T.border}`,
                  borderRadius: 12,
                  padding: "11px 16px",
                  fontSize: 13,
                  fontWeight: 700,
                  color: T.text,
                  cursor: "pointer"
                }}
              >
                Annuler
              </button>
              <button
                type="submit"
                style={{
                  flex: 1.3,
                  background: activeColor,
                  border: "none",
                  borderRadius: 12,
                  padding: "11px 16px",
                  fontSize: 13,
                  fontWeight: 800,
                  color: "#ffffff",
                  cursor: "pointer",
                  boxShadow: `0 4px 14px ${isSuperAdmin ? "rgba(59,130,246,0.4)" : "rgba(139,92,246,0.4)"}`
                }}
              >
                {isSuperAdmin ? "Connexion →" : "Déverrouiller →"}
              </button>
            </div>
          </form>
        </div>
      </div>
    );
  };

  if (userRole === "shop" && activeShop) {
    return (
      <>
        {flash && <div className="flash-toast">{flash}</div>}
        <MainApp
          shopId={activeShop.id}
          shopName={activeShop.shopName}
          ownerName={activeShop.ownerName}
          comptablePin={activeShop.comptablePin || "0000"}
          shopPhone={activeShop.whatsapp || activeShop.phone}
          shopAddress={activeShop.address}
          shopSlogan={activeShop.slogan}
          shopLogo={activeShop.logo}
          ticketFormat={activeShop.ticketFormat || "80mm"}
          ticketCopies={activeShop.ticketCopies || 1}
          ticketFooter={activeShop.ticketFooter}
          whatsappDev={DEV_WHATSAPP}
          themeName={themeName}
          setThemeName={handleSetTheme}
          logout={logout}
          flashMsg={flashMsg}
          cloudEnabled={activeShop.cloudEnabled !== false}
          onOpenDevModal={() => {
            setDevPinModalInput("");
            setDevPinModalError(false);
            setShowDevModal(true);
          }}
        />
        {showDevModal && renderDevModal()}
      </>
    );
  }

  // ÉCRAN DE CONNEXION INITIAL
  return (
    <div style={{ minHeight:"100vh", background:T.bg, color:T.text, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
      {flash && <div className="flash-toast">{flash}</div>}

      <div style={{ background:T.surface, borderRadius:24, padding:24, width:"100%", maxWidth:390, border:`1px solid ${T.border}`, boxShadow:"0 10px 40px rgba(0,0,0,0.3)" }}>
        {/* LOGO AVEC ACCÈS RESTREINT CACHÉ PAR TRIPLE-CLIC */}
        <div
          onClick={handleLogoTripleClick}
          title="Caisse SaaS Pro (Triple-clic pour accès administration)"
          style={{ textAlign:"center", marginBottom:20, cursor:"pointer", userSelect:"none" }}
        >
          <div style={{ fontSize:40, marginBottom:4 }}>🏪</div>
          <div style={{ fontFamily:"'Outfit'", fontSize:20, fontWeight:900, color:T.accent }}>Caisse SaaS Pro</div>
          <div style={{ fontSize:11, color:T.textMute }}>Point de vente & Synchronisation Cloud</div>
        </div>

        <div>
          {/* SOUS-ONGLETS DE CONNEXION COMMERCE */}
            <div style={{ display:"flex", gap:4, background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:3, marginBottom:16 }}>
              <button
                type="button"
                onClick={()=>setShopLoginTab("credentials")}
                style={{
                  flex:1,
                  background: shopLoginTab === "credentials" ? T.accent : "transparent",
                  border: "none",
                  borderRadius: 9,
                  padding: "8px 6px",
                  fontSize: 11,
                  fontWeight: 700,
                  color: shopLoginTab === "credentials" ? T.bg : T.textMute,
                  cursor: "pointer"
                }}
              >
                🔑 Nom & Mot de passe
              </button>
              <button
                type="button"
                onClick={()=>setShopLoginTab("devcode")}
                style={{
                  flex:1,
                  background: shopLoginTab === "devcode" ? T.purple : "transparent",
                  border: "none",
                  borderRadius: 9,
                  padding: "8px 6px",
                  fontSize: 11,
                  fontWeight: 700,
                  color: shopLoginTab === "devcode" ? "#fff" : T.textMute,
                  cursor: "pointer"
                }}
              >
                🏷️ Code Développeur
              </button>
            </div>

            {loadingShops ? (
              <div style={{ textAlign:"center", padding:20, color:T.textMute, fontSize:12 }}>⏳ Chargement des commerces...</div>
            ) : availableShops.length === 0 ? (
              <div style={{ textAlign:"center", padding:20, color:T.orange, fontSize:12 }}>
                Aucun commerce trouvé.<br/>
                <button onClick={()=>{
                  const demoShop = { id: "demo_shop_1", shopName: "Mon Commerce", ownerName: "Gérant", whatsapp: "+221770000000", username: "commerce", password: "1234", accessCode: "DEV-1001", cloudEnabled: true, active: true, createdAt: Date.now() };
                  if(db) db.collection("shops").doc(demoShop.id).set(demoShop);
                  setActiveShop(demoShop);
                  setUserRole("shop");
                  localStorage.setItem("pos_active_shop", JSON.stringify(demoShop));
                  localStorage.setItem("pos_user_role", "shop");
                }} style={{ marginTop:10, background:T.accent, border:"none", borderRadius:10, padding:"8px 14px", fontWeight:700, color:T.bg, cursor:"pointer" }}>
                  + Créer commerce Démo
                </button>
              </div>
            ) : shopLoginTab === "credentials" ? (
              <div>
                <div style={{ fontSize:11, color:T.textMute, marginBottom:5 }}>Sélectionnez ou recherchez votre commerce :</div>
                <select
                  value={selectedShopId}
                  onChange={e => {
                    const id = e.target.value;
                    setSelectedShopId(id);
                    const found = availableShops.find(s => s.id === id);
                    if (found) setShopNameInput(getShopUsername(found));
                  }}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:"10px 12px", color:T.text, fontSize:13, marginBottom:10 }}
                >
                  <option value="">— Choisir dans la liste des commerces —</option>
                  {availableShops.map(s => (
                    <option key={s.id} value={s.id}>
                      {s.shopName} {s.cloudEnabled === false ? "(📴 Local)" : "(☁️ Cloud)"}
                    </option>
                  ))}
                </select>

                <div style={{ fontSize:11, color:T.textMute, marginBottom:5 }}>Nom du commerce ou Identifiant :</div>
                <input
                  type="text"
                  placeholder="Ex: Mon Commerce ou identifiant..."
                  value={shopNameInput}
                  onChange={e => {
                    const val = e.target.value;
                    setShopNameInput(val);
                    const found = availableShops.find(s =>
                      (s.username && s.username.toLowerCase() === val.trim().toLowerCase()) ||
                      (s.shopName && s.shopName.toLowerCase() === val.trim().toLowerCase())
                    );
                    if (found) setSelectedShopId(found.id);
                  }}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:"10px 12px", color:T.text, fontSize:13, marginBottom:10 }}
                />

                <div style={{ fontSize:11, color:T.textMute, marginBottom:5 }}>Mot de passe :</div>
                <div style={{ position:"relative", marginBottom:14 }}>
                  <input
                    type={showShopPassword ? "text" : "password"}
                    placeholder="Mot de passe du commerce (par défaut 1234)"
                    value={shopPasswordInput}
                    onChange={e => setShopPasswordInput(e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") handleShopCredentialsLogin(); }}
                    style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:"11px 40px 11px 12px", color:T.text, fontSize:14 }}
                  />
                  <button
                    type="button"
                    onClick={()=>setShowShopPassword(!showShopPassword)}
                    style={{ position:"absolute", right:12, top:"50%", transform:"translateY(-50%)", background:"transparent", border:"none", cursor:"pointer", color:T.textMute, fontSize:14 }}>
                    {showShopPassword ? "🙈" : "👁️"}
                  </button>
                </div>

                <button
                  type="button"
                  onClick={handleShopCredentialsLogin}
                  style={{ width:"100%", background:T.accent, border:"none", borderRadius:14, padding:14, fontWeight:800, color:T.bg, fontSize:14, cursor:"pointer" }}>
                  Se connecter à la caisse →
                </button>
              </div>
            ) : (
              <div>
                <div style={{ fontSize:11, color:T.textMute, marginBottom:8, lineHeight:1.5 }}>
                  Entrez le <strong>Code d'accès Développeur</strong> fourni pour déverrouiller instantanément votre caisse sans mot de passe :
                </div>
                <input
                  type="text"
                  placeholder="Ex: DEV-1001"
                  value={shopDevCodeInput}
                  onChange={e => setShopDevCodeInput(e.target.value.toUpperCase())}
                  onKeyDown={e => { if (e.key === "Enter") handleShopDevCodeLogin(); }}
                  style={{ width:"100%", background:T.inputBg, border:`1px solid ${T.purple}`, borderRadius:12, padding:12, color:T.accent, fontSize:17, textAlign:"center", letterSpacing:3, fontWeight:800, marginBottom:14 }}
                />
                <button
                  type="button"
                  onClick={handleShopDevCodeLogin}
                  style={{ width:"100%", background:T.purple, border:"none", borderRadius:14, padding:14, fontWeight:800, color:"#fff", fontSize:14, cursor:"pointer" }}>
                  Débloquer avec le code développeur →
                </button>
              </div>
            )}

            {/* Assistance développeur */}
            <div style={{ marginTop:14, textAlign:"center", fontSize:10, color:T.textMute }}>
              Besoin d'un code d'accès ou mot de passe oublié ?<br/>
              <a href={`https://wa.me/${DEV_WHATSAPP}?text=${encodeURIComponent("Bonjour, j'ai besoin de mon code d'accès développeur pour me connecter à ma caisse.")}`}
                target="_blank" rel="noreferrer"
                style={{ color:T.green, fontWeight:700, textDecoration:"none", display:"inline-flex", alignItems:"center", gap:4, marginTop:4 }}>
                💬 Demander un code au Développeur (WhatsApp)
              </a>
            </div>
          </div>

        <div style={{ textAlign:"center", marginTop:20, fontSize:10, color:T.textMute }}>
          Support WhatsApp : <a href={`https://wa.me/${DEV_WHATSAPP}`} style={{ color:T.accent, textDecoration:"none", fontWeight:700 }}>{DEV_WHATSAPP}</a>
        </div>
      </div>
      {showDevModal && renderDevModal()}
    </div>
  );
}

// Initialisation ReactDOM
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<!-- PWA Service Worker & Install Prompt Registration -->
<script>
window.deferredPWAInstallPrompt = null;

// Capture de l'événement d'installation PWA
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  window.deferredPWAInstallPrompt = e;
  window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
  console.log('[PWA] Prompt d\'installation intercepté et prêt.');
});

window.addEventListener('appinstalled', () => {
  window.deferredPWAInstallPrompt = null;
  window.dispatchEvent(new CustomEvent('pwa-installed'));
  console.log('[PWA] Application installée avec succès sur le système.');
});

// Enregistrement du Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then((registration) => {
        console.log('[PWA] Service Worker enregistré avec succès (scope: ' + registration.scope + ')');
      })
      .catch((error) => {
        console.warn('[PWA] Échec enregistrement Service Worker:', error);
      });
  });
}
</script>
</body>
</html>
